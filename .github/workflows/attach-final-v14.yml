name: Attach final ranking logic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  attach:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach final v14 script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="final_logic_v14.js?v=14"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'</body></html>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Attach final v14 ranking logic [skip ci]'
          git push