name: Load expanded roster
on:
  push:
    paths:
      - 'roster.js'
      - 'p4p.js'
      - '.github/workflows/load-roster.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for src in ['roster.js','p4p.js']:
              tag=f'<script src="{src}"></script>'
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add unified P4P logic'
          git push