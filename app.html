<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Ratings</title><style>body{margin:0;background:#090a0b;color:#eee;font:15px system-ui}header{position:sticky;top:0;background:#101214;padding:14px;z-index:2}h1{margin:0;font-size:24px}.tabs{display:flex;gap:6px;overflow:auto;padding:10px}.tabs button,.nav button,button{border:1px solid #30343a;background:#17191c;color:#ddd;border-radius:9px;padding:9px}.on,button.primary{background:#eee!important;color:#08090a!important}.main{max-width:850px;margin:auto;padding:10px}.card,.row{background:#121416;border:1px solid #292d31;border-radius:12px}.card{padding:14px;margin-bottom:10px}.row{display:flex;gap:10px;align-items:center;padding:10px;margin:6px 0}.rank{width:28px;text-align:center;font-weight:900}.avatar{width:40px;height:40px;border-radius:50%;background:#30343a;display:grid;place-items:center;font-weight:800}.grow{flex:1}.muted{font-size:11px;color:#858b92}.champ{font-size:11px;background:#eee;color:#090a0b;padding:4px 6px;border-radius:5px}.win{color:#58df83}.loss{color:#ff6666}.nav{position:fixed;bottom:0;left:0;right:0;background:#101214;padding:7px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stat{background:#191b1f;padding:12px;border-radius:9px}.stat b{font-size:20px;display:block}input,select{width:100%;padding:11px;margin:5px 0 10px;background:#0d0f11;color:#eee;border:1px solid #30343a;border-radius:8px}.modal{display:none;position:fixed;inset:0;background:#000c;padding:15px;z-index:5;overflow:auto}.modal.show{display:block}.box{max-width:650px;margin:auto;background:#111315;padding:15px;border-radius:14px}.close{float:right}</style><header><div class="muted">PERSONAL MMA DATABASE</div><h1>MMA RATINGS</h1></header><div class="tabs" id="tabs"></div><main class="main" id="main"></main><div class="nav"><button onclick="page='home';render()">Главная</button><button onclick="page='rank';render()">Рейтинги</button><button onclick="page='fight';render()">+ Бой</button></div><div class="modal" id="modal"><div class="box"><button class="close" onclick="modal.classList.remove('show')">✕</button><div id="profile"></div></div></div><script>
const D=['Heavyweight','Light Heavyweight','Middleweight','Welterweight','Lightweight','Featherweight','Bantamweight','Flyweight'],N={Heavyweight:'Тяжёлый', 'Light Heavyweight':'Полутяжёлый',Middleweight:'Средний',Welterweight:'Полусредний',Lightweight:'Лёгкий',Featherweight:'Полулёгкий',Bantamweight:'Легчайший',Flyweight:'Наилегчайший'};
const seed=[['Кёртис Блейдс','Heavyweight',6,0,2],['Том Аспиналл','Heavyweight',3,0,0],['Джон Джонс','Heavyweight',2,0,0],['Сирил Ган','Heavyweight',2,0,0],['Фёдор Емельяненко','Heavyweight',3,2,0],['Алекс Перейра','Light Heavyweight',6,1,2],['Магомед Анкалаев','Light Heavyweight',2,0,0],['Пауло Коста','Light Heavyweight',3,0,0],['Карлос Улберг','Light Heavyweight',3,3,0],['Ян Блахович','Light Heavyweight',2,0,0],['Исраэль Адесанья','Middleweight',6,0,2],['Алекс Перейра','Middleweight',3,1,0],['Роберт Уиттакер','Middleweight',1,2,0],['Шон Стрикленд','Middleweight',1,1,0],['Бо Никал','Middleweight',2,1,0],['Джек Маддалена','Welterweight',5,0,1],['Ислам Махачев','Welterweight',4,1,0],['Конор Макгрегор','Welterweight',4,2,0],['Шон Брэди','Welterweight',2,0,0],['Кевин Холланд','Welterweight',1,0,0],['Белал Мухаммад','Welterweight',1,0,0],['Тони Фергюсон','Lightweight',8,1,0],['Илия Топурия','Lightweight',10,3,0],['Майкл Чендлер','Lightweight',3,0,0],['Дастин Порье','Lightweight',3,1,0],['Маурисио Руффи','Lightweight',5,2,0],['Бенуа Сен-Дени','Lightweight',1,0,0],['Дональд Серроне','Lightweight',1,1,0],['Дэн Хукер','Lightweight',3,1,0],['Рафаэль Физиев','Lightweight',1,2,0],['Джастин Гейджи','Lightweight',1,3,0],['Бенеил Дариуш','Lightweight',1,0,0],['Халил Тёрнер','Lightweight',1,0,0],['Арман Царукян','Lightweight',1,2,0],['Эстебан Рибович','Lightweight',1,0,0],['Матеуш Гамрот','Lightweight',1,0,0],['Бобби Грин','Lightweight',1,0,0],['Корейский Зомби','Featherweight',5,0,1],['Мовсар Евлоев','Featherweight',2,0,0],['Макс Холлоуэй','Featherweight',1,0,0],['Александр Волкановски','Featherweight',1,2,0],['Брайан Ортега','Featherweight',2,0,0],['Лерон Мерфи','Featherweight',1,0,0],['Шон Вудсон','Featherweight',1,0,0],['Арнольд Аллен','Featherweight',1,1,0],['Кевин Вальехос','Featherweight',1,1,0],['Юрайя Фейбер','Featherweight',2,1,0],['Патрисио Питбуль','Featherweight',1,0,0],['Жозе Альдо','Featherweight',1,1,0],['Гига Чикадзе','Featherweight',1,0,0],['Джош Эмметт','Featherweight',0,0,0],['Кэлвин Каттар','Featherweight',0,0,0],['Джин Силва','Featherweight',0,1,0],['Пётр Ян','Bantamweight',5,1,1],['Мераб Двалишвили','Bantamweight',3,0,0],['Жозе Альдо','Bantamweight',3,1,0],['Ти Джей Диллашоу','Bantamweight',2,1,0],['Кори Сэндхаген','Bantamweight',3,2,0],['Коди Гарбрандт','Bantamweight',2,0,0],['Роб Фонт','Bantamweight',2,1,0],['Доминик Круз','Bantamweight',2,1,0],['Шон О’Мэлли','Bantamweight',1,1,0],['Умар Нурмагомедов','Bantamweight',2,1,0],['Кай Аскаура','Flyweight',2,0,0],['Брендон Морено','Flyweight',3,1,0],['Алешандру Пантожа','Flyweight',1,1,0],['Манель Капе','Flyweight',1,1,0],['Деметриус Джонсон','Flyweight',2,2,0],['Татсуро Тайра','Flyweight',0,0,0]];
let F=JSON.parse(localStorage.mmaRatingData||'null')||seed.map((x,i)=>({id:i,name:x[0],weight:x[1],wins:x[2],losses:x[3],def:x[4],streak:0,history:[]}));let weight='P4P',page='home';const save=()=>localStorage.mmaRatingData=JSON.stringify(F);function champ(f){return F.filter(x=>x.weight===f.weight).sort((a,b)=>a.rank-b.rank)[0]?.id===f.id}function list(d){return F.filter(f=>f.weight===d).sort((a,b)=>(a.rank||999)-(b.rank||999)||b.wins-a.wins)}function score(f){return f.wins*2-f.losses*2+f.streak*1.5+(champ(f)?10:0)}function p4p(){return F.slice().sort((a,b)=>score(b)-score(a)||b.wins-a.wins).slice(0,15)}function row(f,i){return `<div class=row onclick="openF(${f.id})"><div class=rank>${i+1}</div><div class=avatar>${f.name.split(/\s+/).map(x=>x[0]).join('').slice(0,2)}</div><div class=grow><b>${f.name}${champ(f)?' 🏆':''}</b><div class=muted>${N[f.weight]} · ${f.wins}-${f.losses} · серия <span class=${f.streak<0?'loss':'win'}>${f.streak>0?'+'+f.streak:f.streak}</span></div></div>${champ(f)&&f.def?`<span class=champ>${f.def}🏆</span>`:''}</div>`}function render(){tabs.innerHTML=['P4P',...D].map(x=>`<button class=${weight===x?'on':''} onclick="weight='${x}';page='rank';render()">${x==='P4P'?x:N[x]}</button>`).join('');if(page==='home')home();if(page==='rank')rank();if(page==='fight')fight()}function home(){let w=F.reduce((a,f)=>a+f.wins,0),l=F.reduce((a,f)=>a+f.losses,0);main.innerHTML=`<div class=card><div class=muted>ВСЕ БОИ</div><div style="font-size:32px;font-weight:900">${w}-${l}</div></div><div class=grid><div class=stat><b>${F.length}</b>бойцов</div><div class=stat><b>${w}</b>побед</div><div class=stat><b>${l}</b>поражений</div><div class=stat><b>${F.filter(f=>f.streak).length}</b>активных серий</div></div><h3>P4P TOP 15</h3>${p4p().map(row).join('')}`}function rank(){let a=weight==='P4P'?p4p():list(weight);main.innerHTML=`<div class=card><b>${weight==='P4P'?'P4P':N[weight]}</b><div class=muted>Полный рекорд · активная серия · защиты чемпиона</div></div>${a.map(row).join('')}`}function fight(){main.innerHTML=`<div class=card><h2>Записать бой</h2><label>Боец</label><select id=f>${F.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(x=>`<option value=${x.id}>${x.name} — ${N[x.weight]}</option>`).join('')}</select><label>Результат</label><select id=r><option value=1>Победа</option><option value=0>Поражение</option></select><label>Титульный бой</label><select id=t><option value=0>Нет</option><option value=1>Да</option></select><button class=primary onclick=addFight()>Сохранить</button></div>`}function addFight(){let f=F.find(x=>x.id==document.getElementById('f').value),win=+r.value,title=+t.value;if(win){f.wins++;f.streak=f.streak>0?f.streak+1:1;if(title&&champ(f))f.def++}else{f.losses++;f.streak=f.streak<0?f.streak-1:-1}f.history.unshift({win,date:new Date().toLocaleDateString()});save();alert(`${f.name}: ${win?'ПОБЕДА':'ПОРАЖЕНИЕ'} | ${f.wins}-${f.losses} | серия ${f.streak}`);weight=f.weight;page='rank';render()}function openF(id){let f=F.find(x=>x.id===id);profile.innerHTML=`<h2>${f.name}</h2><div class=muted>${N[f.weight]} · ${champ(f)?'ЧЕМПИОН · ':''}${f.wins}-${f.losses}</div><div class=grid><div class=stat><b>${f.wins}</b>победы</div><div class=stat><b>${f.losses}</b>поражения</div><div class=stat><b>${f.streak}</b>серия</div><div class=stat><b>${f.def}</b>защиты</div></div><h3>История</h3>${f.history.map(h=>`<div class=row>${h.win?'Победа':'Поражение'} · ${h.date}</div>`).join('')||'<div class=muted>Нет истории</div>'}`;modal.classList.add('show')}render();
</script></html>
