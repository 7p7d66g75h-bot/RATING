<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Road to UFC</title><style>*{box-sizing:border-box}body{margin:0;background:#08090c;color:#eee;font:15px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:62px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:#0e1014;border-bottom:1px solid #292d35}.logo{font-weight:900;letter-spacing:2px}.logo b{color:#e7353e}.layout{display:grid;grid-template-columns:210px 1fr;max-width:1400px;margin:auto}.side{padding:12px;border-right:1px solid #292d35;min-height:calc(100vh - 62px)}.nav{display:grid;gap:6px}.nav button{background:transparent;border:1px solid transparent;color:#999;padding:13px;border-radius:9px;text-align:left}.nav button:hover,.nav .on{background:#191b21;color:#fff;border-color:#343943}.main{padding:22px;max-width:1200px;width:100%;margin:auto}.hero{min-height:330px;padding:30px;border:1px solid #333842;border-radius:18px;background:linear-gradient(135deg,#1b1e25,#0b0d10);display:flex;justify-content:space-between;align-items:end}.ey{font-size:10px;letter-spacing:3px;color:#ef424b;font-weight:900}.title{font-size:38px;margin:6px 0}.muted{color:#9299a6}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.card,.offer{background:#111318;border:1px solid #2b2f38;border-radius:13px;padding:16px}.offer.hot{border-color:#a53b42}.btn{background:#191c22;color:#fff;border:1px solid #3a3f49;border-radius:9px;padding:12px 16px;font-weight:800}.red{background:#df3039;border-color:#df3039}.green{background:#287c53;border-color:#287c53}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag,.badge{display:inline-block;border:1px solid #383d47;border-radius:999px;padding:5px 9px;font-size:11px;margin:2px}.badge{border-radius:5px;background:#242831}.money,.stat{font-size:28px;font-weight:900}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#89919d;font-size:10px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;background:#0b0d11;color:#fff;border:1px solid #30343d;border-radius:8px}.toast{position:fixed;right:15px;top:75px;width:min(390px,calc(100% - 30px));z-index:10;background:#171a20;border:1px solid #424752;border-left:4px solid #e7353e;border-radius:12px;padding:14px}.mobile{display:none}@media(max-width:800px){.layout{display:block}.side{display:none}.main{padding:14px 12px 80px}.g2,.g3,.form{grid-template-columns:1fr}.hero{min-height:390px;padding:20px}.hero h1{font-size:38px}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:8;grid-template-columns:repeat(5,1fr);background:#0c0d11f5;border-top:1px solid #292d35;padding:6px}.mobile button{background:none;border:0;color:#999;font-size:10px}.mobile .on{color:#fff}.row .btn{width:auto}}</style></head><body><div id="app"></div><script>const ORGS=[['UFC','TOP'],['PFL','TOP'],['ONE Championship','TOP'],['RIZIN','TOP'],['ACA','TOP'],['KSW','TOP'],['Cage Warriors','TOP'],['LFA','TOP'],['BRAVE CF','TOP'],['OKTAGON MMA','TOP'],['RCC','REGIONAL'],['Fight Nights','REGIONAL'],['MFP','REGIONAL'],['Siberian Fight League','REGIONAL'],['ACA Young Eagles','REGIONAL'],['Open FC','REGIONAL']];const N=['Максим Орлов','Дмитрий Сафин','Илья Морозов','Роман Беляев','Тимур Абаев','Влад Ким','Марк Соколов','Денис Крылов','Иван Петров','Артур Магомедов'];let S=JSON.parse(localStorage.getItem('mmaRoadV7')||'null')||{page:'home',fighter:null,offers:[],contract:null,neg:null,toast:null};function save(){localStorage.setItem('mmaRoadV7',JSON.stringify(S))}function go(p){S.page=p;S.toast=null;save();render()}function money(n){return '$'+Math.round(n).toLocaleString()}function esc(x){return String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function nav(){return [['home','⌂','Главная'],['career','♟','Карьера'],['offers','✉','Предложения'],['match','⚔','Соперники'],['world','◉','Мир']].map(x=>`<button class="${S.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}function shell(c){return `${S.toast?`<div class="toast"><b>${esc(S.toast.t)}</b><p>${esc(S.toast.p)}</p><button class="btn red" onclick="S.toast=null;render()">Закрыть</button></div>`:''}<header class="top"><div class="logo">MMA <b>ROAD TO UFC</b></div><span class="muted">${S.fighter?esc(S.fighter.name)+' · '+S.fighter.record:'Новая карьера'}</span></header><div class="layout"><aside class="side"><div class="nav">${nav()}</div></aside><main class="main">${c}</main></div><nav class="mobile">${nav()}</nav>`}function home(){if(!S.fighter)return `<div class="hero"><div><div class="ey">CAREER RPG</div><h1>Пробейся в UFC.</h1><p class="muted">Создай бойца и начни путь через региональные лиги к крупнейшим организациям.</p><button class="btn red" onclick="go('create')">Создать бойца</button></div></div>`;let f=S.fighter;return `<div class="hero"><div><div class="ey">${f.league} · ${f.weight}</div><h1>${esc(f.name)}</h1><p class="muted">${f.style} · ${f.record}</p><span class="tag">${money(f.money)}</span><span class="tag">${f.fans} FANS</span></div><button class="btn red" onclick="go('${S.contract?'career':'offers'}')">${S.contract?'Открыть бой':'Проверить предложения'}</button></div><div class="grid g3" style="margin-top:12px"><div class="card"><small class="muted">ЛИГА</small><div class="stat" style="font-size:20px">${f.league}</div></div><div class="card"><small class="muted">РЕКОРД</small><div class="stat">${f.record}</div></div><div class="card"><small class="muted">РЕЙТИНГ</small><div class="stat">${f.rank?'#'+f.rank:'NR'}</div></div></div>`}function create(){return `<div class="ey">NEW CAREER</div><h1 class="title">Создание бойца</h1><div class="card"><div class="form"><div class="field"><label>Имя и фамилия</label><input id="name" value="Александр Брюханов"></div><div class="field"><label>Возраст</label><input id="age" value="20" type="number"></div><div class="field"><label>Рост</label><input id="height" value="174" type="number"></div><div class="field"><label>Весовая</label><select id="weight"><option>Flyweight</option><option>Bantamweight</option><option>Featherweight</option><option>Lightweight</option><option>Welterweight</option><option>Middleweight</option></select></div><div class="field"><label>Стиль</label><select id="style"><option>Ударник</option><option>Борец</option><option>BJJ</option><option>Кикбоксер</option><option>Прессинг</option><option>Контрпанчер</option><option>Универсал</option></select></div><div class="field"><label>Страна</label><input value="RUS"></div></div><button class="btn red" style="margin-top:14px" onclick="start()">Начать карьеру</button></div>`}function start(){S.fighter={name:document.getElementById('name').value,age:+document.getElementById('age').value,height:+document.getElementById('height').value,weight:document.getElementById('weight').value,style:document.getElementById('style').value,league:'Siberian Fight League',record:'0-0',wins:0,losses:0,money:1500,fans:5,rank:0,history:[]};S.page='career';save();render()}function career(){if(!S.fighter)return create();let f=S.fighter;return `<div class="ey">CAREER HUB</div><h1 class="title">${esc(f.name)}</h1><p class="muted">${f.league} · ${f.weight} · ${f.record}</p><div class="grid g3"><div class="card"><small class="muted">ДЕНЬГИ</small><div class="stat">${money(f.money)}</div></div><div class="card"><small class="muted">РЕКОРД</small><div class="stat">${f.record}</div></div><div class="card"><small class="muted">СЛЕДУЮЩИЙ БОЙ</small><div>${S.contract?esc(S.contract.org)+' · '+esc(S.contract.opponent.name):'Нет контракта'}</div></div></div><div class="card" style="margin-top:12px"><h2>Контракт</h2>${S.contract?`<p><b>${esc(S.contract.org)}</b> предлагает бой против <b>${esc(S.contract.opponent.name)}</b>.</p><span class="tag">ONE FIGHT</span><span class="tag">SHOW ${money(S.contract.show)}</span><span class="tag">WIN ${money(S.contract.win)}</span>`:'<p class="muted">Контракта нет. Открой предложения.</p>'}</div>`}function makeOffer(org){let show=600+Math.floor(Math.random()*18)*250;return {org,name:N[Math.floor(Math.random()*N.length)],record:(1+Math.floor(Math.random()*14))+'-'+Math.floor(Math.random()*4),style:['Ударник','Борец','Кикбоксер','BJJ'][Math.floor(Math.random()*4)],rank:Math.random()<.55?0:1+Math.floor(Math.random()*15),show,win:show}}function genOffers(){let f=S.fighter;S.offers=[makeOffer(f.league),makeOffer(f.league),makeOffer(f.league)];if(f.wins>=2)S.offers.push(makeOffer('RCC'));if(f.wins>=4)S.offers.push(makeOffer('ACA'));if(f.wins>=7)S.offers.push(makeOffer('Cage Warriors'));if(f.wins>=10)S.offers.push(makeOffer('UFC'));S.page='offers';S.toast={t:'Новые предложения',p:`Тебе предложено ${S.offers.length} боёв.`};save();render()}function offers(){if(!S.fighter)return create();if(!S.offers.length)return `<div class="card"><h2>Входящих предложений нет</h2><p class="muted">Топовые лиги не дают бой без причины. Нужны победы и внимание матчмейкеров.</p><button class="btn red" onclick="genOffers()">Проверить рынок</button></div>`;return `<div class="ey">INBOX · FIGHT OFFERS</div><h1 class="title">Предложения</h1><p class="muted">У каждого боя крупно указано, <b>какая лига его предлагает</b>. Все предложения — контракт ровно на один бой.</p><div class="grid g2">${S.offers.map((o,i)=>`<div class="offer ${o.org==='UFC'?'hot':''}"><div class="row"><span class="badge">ПРЕДЛАГАЕТ: ${esc(o.org)}</span><span class="tag">ONE FIGHT</span></div><h2>${esc(o.name)}</h2><p class="muted">${o.record} · ${o.style} · ${o.rank?'#'+o.rank:'NR'}</p><div class="grid g2"><div><small class="muted">SHOW</small><div class="money">${money(o.show)}</div></div><div><small class="muted">WIN</small><div class="money">${money(o.win)}</div></div></div><div class="row" style="margin-top:12px"><button class="btn green" onclick="accept(${i})">Принять</button><button class="btn" onclick="talk(${i})">Переговоры</button><button class="btn" onclick="reject(${i})">Отказать</button></div></div>`).join('')}</div>`}function accept(i){let o=S.offers[i];S.contract={org:o.org,opponent:o,show:o.show,win:o.win};S.offers=[];S.page='career';S.toast={t:'Контракт подписан',p:`${o.org} · один бой · ${o.name}`};save();render()}function reject(i){S.offers.splice(i,1);save();render()}function talk(i){let o=S.offers[i];S.neg={org:o.org,opponent:o,show:o.show,win:o.win};S.page='neg';save();render()}function neg(){let n=S.neg,o=n.opponent;return `<div class="ey">NEGOTIATION</div><h1 class="title">${esc(n.org)} · ${esc(o.name)}</h1><div class="card"><span class="badge">КОНТРАК НА ОДИН БОЙ</span><p>${o.record} · ${o.style}</p><p class="muted">Твои условия</p><label>Show: ${money(n.show)}</label><input type="range" min="500" max="10000" step="100" value="${n.show}" oninput="S.neg.show=+this.value;render()" style="width:100%"><label>Win: ${money(n.win)}</label><input type="range" min="500" max="12000" step="100" value="${n.win}" oninput="S.neg.win=+this.value;render()" style="width:100%"><div class="row" style="margin-top:14px"><button class="btn red" onclick="submitNeg()">Отправить условия</button><button class="btn" onclick="go('offers')">Назад</button></div></div>`}function submitNeg(){let n=S.neg,base=n.opponent.show*2,r=(n.show+n.win)/base;if(r>1.8){S.toast={t:'Отказ',p:`${n.org} отказалась от твоих условий.`};n.show=n.opponent.show;n.win=n.opponent.show;save();render();return}if(r>1.3){n.show=Math.round(n.opponent.show*1.15/50)*50;n.win=Math.round(n.opponent.show*1.2/50)*50;S.toast={t:'Встречное предложение',p:`${n.org}: ${money(n.show)} / ${money(n.win)}`};save();render();return}S.contract={org:n.org,opponent:n.opponent,show:n.show,win:n.win};S.offers=[];S.neg=null;S.page='career';S.toast={t:'Сделка закрыта',p:`Один бой с ${n.opponent.name}`};save();render()}function match(){return `<div class="ey">MATCHMAKING</div><h1 class="title">Выбор соперника</h1><p class="muted">Нажми обновить — получишь конкретные предложения. Лига и статус будут видны на каждой карточке.</p><button class="btn red" onclick="genOffers()">Обновить предложения</button>`}function world(){return `<div class="ey">MMA WORLD</div><h1 class="title">Организации</h1><div class="grid g3">${ORGS.map(o=>`<div class="card"><h2>${o[0]}</h2><span class="tag">${o[1]}</span><p class="muted">${o[1]==='TOP'?'Рейтинги · P4P · титулы · контракты':'Региональная лига без рейтинга'}</p></div>`).join('')}</div>`}function render(){let c=S.page==='home'?home():S.page==='create'?create():S.page==='career'?career():S.page==='offers'?offers():S.page==='match'?match():S.page==='neg'?neg():world();document.getElementById('app').innerHTML=shell(c)}render();</script></body></html>
