<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MMA Road to UFC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f4f5f7;font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,#252831,#07080b 58%)}header{height:64px;border-bottom:1px solid #292d36;background:#0a0b0eeF;backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20}.logo{font-weight:950;letter-spacing:.08em}.logo b{color:#e9343c}.muted{color:#8f96a4}.layout{display:grid;grid-template-columns:220px 1fr;max-width:1500px;margin:auto}.side{border-right:1px solid #292d36;min-height:calc(100vh - 64px);padding:15px}.nav{display:grid;gap:6px}.nav button{padding:12px;border:1px solid transparent;background:transparent;color:#aeb4bf;text-align:left;border-radius:9px}.nav button.on,.nav button:hover{background:#171920;border-color:#2c3039;color:#fff}.nav button.on{box-shadow:inset 3px 0 #e9343c}.main{padding:24px;max-width:1250px;width:100%;margin:auto}.title{font-size:34px;margin:5px 0 8px;font-weight:950}.eyebrow{font-size:10px;letter-spacing:.17em;font-weight:900;color:#ed4148;text-transform:uppercase}.grid{display:grid;gap:13px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{background:#111318;border:1px solid #2a2e37;border-radius:14px;padding:17px}.hero{min-height:300px;padding:30px;border:1px solid #30343d;border-radius:18px;background:linear-gradient(130deg,#181b22,#0c0e12);display:flex;justify-content:space-between;align-items:end;gap:20px}.hero h1{font-size:52px;line-height:1;margin:9px 0}.btn{border:1px solid #343944;background:#191c22;color:#fff;padding:11px 16px;border-radius:9px;font-weight:850}.btn.red{background:#df2932;border-color:#df2932}.btn.gold{background:#c7a05b;color:#111;border-color:#c7a05b}.btn.green{background:#277a52;border-color:#277a52}.btn:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stat{font-size:28px;font-weight:950}.tag{display:inline-block;border:1px solid #333842;border-radius:999px;padding:5px 9px;margin:3px;color:#cbd0d9;font-size:11px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #292d36}.table th{color:#727986;text-transform:uppercase;font-size:10px;letter-spacing:.08em}.rank{color:#c9a45f;font-weight:950}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice button{padding:14px;background:#0d0f13;color:#bdc3cc;border:1px solid #2b2f38;border-radius:10px;text-align:left}.choice button.on{border-color:#e9343c;background:#1b1013;color:#fff}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;color:#808793;font-size:10px;text-transform:uppercase;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;background:#0b0d11;color:#fff;border:1px solid #2b2f38;border-radius:8px}.bar{height:7px;background:#292d36;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#df3038}.notice{padding:13px;background:#16130e;border-left:3px solid #c7a05b;color:#d8dbe2;border-radius:5px}.mobile{display:none}.opponent{position:relative}.opponent .risk{position:absolute;right:14px;top:14px}.risk.low{color:#55c586}.risk.mid{color:#d5aa57}.risk.high{color:#e95656}.score{font-size:20px;font-weight:900}.offerbox{border:1px solid #343944;background:#0d0f13;border-radius:12px;padding:15px}.money{font-size:30px;font-weight:950}.neggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slider{width:100%;accent-color:#df3038}.fight-screen{max-width:1000px;margin:auto}.fight-head{display:grid;grid-template-columns:1fr 90px 1fr;gap:12px;align-items:center}.fighter-side{text-align:center}.avatar{width:80px;height:80px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#323641,#15171c);border:1px solid #404550;font-weight:950;font-size:22px}.vs{text-align:center;color:#e9343c;font-size:27px;font-weight:950}.clock{text-align:center;font-size:52px;font-weight:950;line-height:1}.round{text-align:center;color:#9097a3;margin-top:3px}.hp{height:10px;background:#272b34;border-radius:8px;overflow:hidden;margin-top:8px}.hp i{display:block;height:100%;background:#df3038}.stamina i{background:#c8a15c}.fight-log{height:230px;overflow:auto;background:#08090c;border:1px solid #292d36;border-radius:10px;padding:13px;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.tactics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tactic{padding:17px;background:#14171d;border:1px solid #2b2f38;color:#fff;border-radius:10px;text-align:left}.tactic b{display:block;margin-bottom:5px}.tactic small{color:#858c99}.phase{padding:8px 11px;border-radius:999px;background:#1b1e25;color:#cbd0d8;font-size:11px}.result{padding:25px;text-align:center;border:1px solid #343944;background:#111318;border-radius:15px}.result.win{border-color:#3d7659}.result.loss{border-color:#733c42}.bigresult{font-size:40px;font-weight:950}.weekbar{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.week{padding:11px 5px;border:1px solid #2a2e37;border-radius:8px;text-align:center;background:#0d0f13}.week.active{border-color:#df3038;background:#1b1013}.week.done{opacity:.45}.small{font-size:12px}.success{color:#55c586}.danger{color:#eb5a5a}@media(max-width:850px){header{padding:0 13px}.layout{display:block}.side{display:none}.main{padding:14px 12px 82px}.hero{min-height:410px;padding:21px;align-items:end}.hero h1{font-size:38px}.g2,.g3,.g4,.form,.neggrid{grid-template-columns:1fr}.choice{grid-template-columns:1fr 1fr}.weekbar{grid-template-columns:repeat(4,1fr)}.fight-head{grid-template-columns:1fr}.vs{display:none}.tactics{grid-template-columns:1fr 1fr}.mobile{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:30;grid-template-columns:repeat(4,1fr);background:#0b0c10F7;border-top:1px solid #2b2f37;padding:7px}.mobile button{border:0;background:transparent;color:#8d94a0;font-size:10px}.mobile button.on{color:#fff}}
</style></head>
<body><div id="app"></div>
<script>
const ORGS=[['UFC','🇺🇸','major'],['PFL','🇺🇸','major'],['ONE Championship','🇸🇬','major'],['RIZIN','🇯🇵','major'],['ACA','🇷🇺','major'],['KSW','🇵🇱','major'],['Cage Warriors','🇬🇧','major'],['LFA','🇺🇸','major'],['BRAVE CF','🇧🇭','major'],['OKTAGON MMA','🇨🇿','major'],['RCC','🇷🇺','regional'],['Fight Nights','🇷🇺','regional'],['MFP','🇷🇺','regional'],['Siberian Fight League','🇷🇺','regional'],['ACA Young Eagles','🇷🇺','regional'],['Open FC','🇷🇺','regional']];
const WEIGHTS=[['FLY','Flyweight',56.7],['BW','Bantamweight',61.2],['FW','Featherweight',65.8],['LW','Lightweight',70.3],['WW','Welterweight',77.1],['MW','Middleweight',83.9],['LHW','Light Heavyweight',93],['HW','Heavyweight',120.2]];
const STYLES=[['Striker','Ударник'],['Wrestler','Борец'],['Submission','Сабмишн-хантер'],['Kickboxer','Кикбоксер'],['Pressure','Прессинг-файтер'],['Counter','Контрпанчер'],['AllRounder','Универсал']];
const NAMES=['Максим Орлов','Дмитрий Сафин','Илья Морозов','Роман Беляев','Тимур Абаев','Владислав Ким','Алексей Волков','Марк Соколов','Денис Крылов','Иван Петров','Сергей Белов','Артур Магомедов','Никита Лебедев','Марат Абдуллин','Егор Фёдоров','Роман Кузнецов','Даниил Каримов','Матвей Соколов'];
const AI_STYLES=['Striker','Wrestler','Submission','Kickboxer','Pressure','Counter'];
let old=JSON.parse(localStorage.getItem('mmaRoadV3')||'null');
let S=JSON.parse(localStorage.getItem('mmaRoadV4')||'null')||{page:'home',style:0,week:1,month:1,year:2026,fighter:null,opponents:[],selectedOpp:null,negotiation:null,contract:null,fight:null,lastResult:null,log:[]};
if(!S.fighter&&old?.fighter){S.fighter=old.fighter;S.page='career';if(S.fighter.stats.wrestling&&!S.fighter.stats.takedowns)S.fighter.stats.takedowns=S.fighter.stats.wrestling;save()}
function save(){localStorage.setItem('mmaRoadV4',JSON.stringify(S))}function go(p){S.page=p;save();render()}function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nav(){return [['home','⌂','Главная'],['career','♟','Карьера'],['match','⚔','Соперники'],['camp','⚡','Лагерь'],['world','◉','Мир'],['rank','♛','Рейтинги'],['profile','●','Профиль']].map(x=>`<button class="${S.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}
function shell(c){return `<div class="app"><header><div class="logo">MMA <b>ROAD TO UFC</b></div><div class="muted">${S.fighter?esc(S.fighter.name)+' · '+S.fighter.record:'Новая карьера'}</div></header><div class="layout"><aside class="side"><div class="nav">${nav()}</div></aside><main class="main">${c}</main></div><nav class="mobile">${nav()}</nav></div>`}
function home(){if(!S.fighter)return `<div class="hero"><div><div class="eyebrow">MMA CAREER RPG · V4</div><h1>Пробейся в UFC.</h1><p class="muted">Теперь не просто кнопка «драться». Ищи подходящего соперника, торгуйся за контракт, готовь лагерь и принимай решения прямо во время боя.</p><button class="btn red" onclick="go('create')">Создать бойца</button></div></div><div class="grid g3" style="margin-top:14px"><div class="card"><div class="muted">Major organizations</div><div class="stat">10</div></div><div class="card"><div class="muted">Regional</div><div class="stat">6</div></div><div class="card"><div class="muted">Новая механика боя</div><div class="stat">TACTICS</div></div>`;let f=S.fighter;return `<div class="hero"><div><div class="eyebrow">CAREER · ${S.year} WEEK ${S.week}</div><h1>${esc(f.name)}</h1><p class="muted">${f.weightName} · ${f.styleName} · ${f.league}</p><span class="tag">${f.record}</span><span class="tag">$${f.money.toLocaleString()}</span><span class="tag">Popularity ${f.popularity}</span></div><button class="btn red" onclick="go(S.offer?'negotiation':'match')">${S.contract?'Открыть бой':S.negotiation?'Переговоры':'Найти соперника'}</button></div><div class="grid g3" style="margin-top:14px"><div class="card"><div class="muted">Статус</div><div class="stat">${S.contract?'FIGHT BOOKED':S.negotiation?'NEGOTIATION':'AVAILABLE'}</div></div><div class="card"><div class="muted">Здоровье</div><div class="stat">${f.health}%</div></div><div class="card"><div class="muted">Уверенность</div><div class="stat">${f.confidence||70}</div></div></div>`}
function create(){return `<div class="eyebrow">CHARACTER CREATION</div><h1 class="title">Создание бойца</h1><div class="card"><div class="form"><div class="field"><label>Имя</label><input id="fn" placeholder="Александр"></div><div class="field"><label>Фамилия</label><input id="ln" placeholder="Брюханов"></div><div class="field"><label>Страна</label><input id="ct" value="RUS"></div><div class="field"><label>Возраст</label><input id="age" value="20" type="number"></div><div class="field"><label>Рост, см</label><input id="ht" value="174" type="number"></div><div class="field"><label>Вес вне лагеря, кг</label><input id="walk" value="70" type="number"></div><div class="field"><label>Весовая</label><select id="wt">${WEIGHTS.map(w=>`<option value="${w[0]}">${w[1]} · ${w[2]} кг</option>`).join('')}</select></div><div class="field"><label>Стойка</label><select id="stance"><option>Orthodox</option><option>Southpaw</option><option>Switch</option></select></div></div><h3>Стиль</h3><div class="choice">${STYLES.map((x,i)=>`<button class="${S.style===i?'on':''}" onclick="S.style=${i};save();render()"><b>${x[1]}</b><br><small>${desc(x[0])}</small></button>`).join('')}</div><br><button class="btn red" onclick="createF()">Начать карьеру</button></div>`}
function desc(x){return {Striker:'Бокс, дистанция, точность',Wrestler:'Тейкдауны, контроль, клинч',Submission:'Партер и сабмишны',Kickboxer:'Кики, колени, дистанция',Pressure:'Темп, давление, объём',Counter:'Тайминг, контратаки, защита',AllRounder:'Ровный MMA-баланс'}[x]}
function createF(){let w=WEIGHTS.find(x=>x[0]===document.getElementById('wt').value),st=STYLES[S.style];S.fighter={name:((document.getElementById('fn').value||'Александр')+' '+(document.getElementById('ln').value||'Брюханов')).trim(),country:document.getElementById('ct').value||'RUS',age:+document.getElementById('age').value||20,height:+document.getElementById('ht').value||174,walk:+document.getElementById('walk').value||70,weight:w[0],weightName:w[1],limit:w[2],stance:document.getElementById('stance').value,style:st[0],styleName:st[1],league:'Regional',record:'0-0',wins:0,losses:0,money:1500,popularity:5,health:100,confidence:70,stats:{boxing:68,kicks:68,power:66,speed:68,defense:65,takedowns:65,tddef:65,clinch:64,ground:64,submission:64,cardio:70,strength:66,chin:70,iq:64},history:[]};S.page='career';S.log.push('Профессиональная карьера началась на региональном уровне.');save();render()}
function career(){if(!S.fighter)return create();let f=S.fighter;return `<div class="row"><div><div class="eyebrow">CAREER</div><h1 class="title">${esc(f.name)}</h1><p class="muted">${f.league} · ${f.weightName} · ${f.styleName}</p></div><button class="btn red" onclick="go('match')">${S.contract?'Открыть бой':'Подобрать соперника'}</button></div><div class="card" style="margin-top:14px"><div class="row"><b>${S.year} · Неделя ${S.week}</b><span class="phase">${S.contract?'FIGHT BOOKED':S.negotiation?'NEGOTIATION':'MATCHMAKING'}</span></div><div class="weekbar" style="margin-top:12px">${Array.from({length:8},(_,i)=>`<div class="week ${i+1===S.week?'active':''} ${i+1<S.week?'done':''}"><b>${i+1}</b><small>${i===7?'FIGHT':'CAMP'}</small></div>`).join('')}</div></div><div class="grid g3" style="margin-top:14px"><div class="card"><div class="muted">Рекорд</div><div class="stat">${f.record}</div></div><div class="card"><div class="muted">Баланс</div><div class="stat">$${f.money.toLocaleString()}</div></div><div class="card"><div class="muted">Организация</div><div class="stat">${f.league}</div></div></div>${S.contract?contractCard():S.negotiation?negCard():`<div class="card" style="margin-top:14px"><div class="eyebrow">NEXT MOVE</div><h2>Найди подходящий бой</h2><p class="muted">Сравни риск, рейтинг, стиль соперника и деньги. После выбора начнутся переговоры.</p><button class="btn red" onclick="go('match')">Открыть matchmaking</button></div>`}<div class="card" style="margin-top:14px"><h2>История</h2>${f.history?.length?`<table class="table"><tr><th>Соперник</th><th>Результат</th><th>Метод</th><th>Лига</th></tr>${f.history.slice().reverse().map(x=>`<tr><td>${esc(x.o)}</td><td class="${x.w?'success':'danger'}">${x.w?'ПОБЕДА':'ПОРАЖЕНИЕ'}</td><td>${x.m}</td><td>${x.org||'Regional'}</td></tr>`).join('')}</table>`:'<p class="muted">Профессиональный дебют впереди.</p>'}</div>`}
function match(){if(!S.fighter)return create();if(S.contract)return `<div class="notice">Бой уже забронирован. Перейди в карьеру и открой Fight Night.</div>`;if(!S.opponents.length)S.opponents=makeOpponents();return `<div class="eyebrow">MATCHMAKING</div><h1 class="title">Выбор соперника</h1><p class="muted">Не будет случайного «другого соперника». Здесь ты сам выбираешь риск. Сильнее соперник = выше шанс на скачок рейтинга и гонорар.</p><div class="grid g2">${S.opponents.map((o,i)=>opponentCard(o,i)).join('')}</div><button class="btn" style="margin-top:14px" onclick="S.opponents=makeOpponents();save();render()">Обновить рынок</button>`}
function makeOpponents(){let f=S.fighter,arr=[];for(let i=0;i<6;i++){let wins=Math.max(1,f.wins-1+Math.floor(Math.random()*6)),loss=Math.floor(Math.random()*3);let styles=AI_STYLES,st=styles[Math.floor(Math.random()*styles.length)];let org=f.league==='Regional'?['Siberian Fight League','MFP','Open FC','ACA Young Eagles'][Math.floor(Math.random()*4)]:f.league;let score=Math.max(58,65+f.wins*2+Math.floor(Math.random()*24)-i*3);let risk=score>82?'high':score>72?'mid':'low';arr.push({id:Date.now()+i,name:NAMES[Math.floor(Math.random()*NAMES.length)],record:wins+'-'+loss,style:st,score,org,purse:800+score*25+i*130,risk,age:20+Math.floor(Math.random()*14),height:168+Math.floor(Math.random()*18)})}return arr}
function opponentCard(o,i){let f=S.fighter;let quality=o.score>84?'Элитный проспект':o.score>74?'Опасный соперник':'Проходимый матч';return `<div class="card opponent"><span class="risk ${o.risk}">${o.risk==='high'?'HIGH RISK':o.risk==='mid'?'MEDIUM':'LOW RISK'}</span><div class="avatar" style="width:64px;height:64px">OP</div><h2>${esc(o.name)}</h2><p class="muted">${o.age} лет · ${o.height} см · ${o.style}</p><div class="tag">${o.record}</div><div class="tag">${o.org}</div><div class="row" style="margin-top:12px"><div><div class="muted">Match score</div><div class="score">${o.score}</div></div><div style="text-align:right"><div class="muted">Гонорар</div><div class="money">$${o.purse.toLocaleString()}</div></div></div><p class="muted">${quality}. ${o.score>f.stats.iq+f.wins*2?'Победа заметно повысит статус.':'Безопаснее для рекорда.'}</p><button class="btn red" onclick="selectOpp(${i})">Выбрать</button></div>`}
function selectOpp(i){S.selectedOpp=S.opponents[i];S.negotiation={purse:S.selectedOpp.purse,bonus:Math.round(S.selectedOpp.purse*.7),rounds:3,step:0,message:'Промоутер предложил базовые условия.'};S.page='negotiation';save();render()}
function negCard(){let o=S.selectedOpp,n=S.negotiation;return `<div class="card" style="margin-top:14px"><div class="eyebrow">NEGOTIATION</div><h2>${esc(o.name)} · ${o.org}</h2><p class="muted">Твоя задача не просто нажать «принять». Выбери условия. Слишком жадный запрос может сорвать бой.</p><div class="offerbox"><div class="row"><div><div class="muted">Show money</div><div class="money">$${n.purse.toLocaleString()}</div></div><div><div class="muted">Win bonus</div><div class="money">$${n.bonus.toLocaleString()}</div></div></div><hr style="border-color:#292d36"><div class="muted">Раунды</div><b>${n.rounds} × 5 минут</b></div><div class="neggrid" style="margin-top:13px"><div class="card"><label>Требуемый гонорар: <b>$${n.purse.toLocaleString()}</b></label><input class="slider" type="range" min="${Math.round(o.purse*.7)}" max="${Math.round(o.purse*1.8)}" value="${n.purse}" oninput="S.negotiation.purse=+this.value;document.getElementById('pval').textContent=this.value;save()"><p class="muted">$<span id="pval">${n.purse}</span></p></div><div class="card"><label>Win bonus: <b>$${n.bonus.toLocaleString()}</b></label><input class="slider" type="range" min="${Math.round(o.purse*.4)}" max="${Math.round(o.purse*1.4)}" value="${n.bonus}" oninput="S.negotiation.bonus=+this.value;document.getElementById('bval').textContent=this.value;save()"><p class="muted">$<span id="bval">${n.bonus}</span></p></div></div><div class="grid g3" style="margin-top:13px"><button class="btn green" onclick="negotiate('accept')">Принять предложение</button><button class="btn gold" onclick="negotiate('counter')">Отправить встречное</button><button class="btn" onclick="negotiate('reject')">Отказаться</button></div><p class="notice" style="margin-top:13px">${n.message}</p></div>`}
function negotiate(action){let n=S.negotiation,o=S.selectedOpp;if(action==='reject'){S.negotiation=null;S.selectedOpp=null;S.page='match';save();render();return}if(action==='accept'){bookFight();return}let demand=n.purse/o.purse;let chance=Math.max(0,Math.min(1,1-(demand-1)*1.7));if(Math.random()<chance){n.message='Промоутер согласился на встречные условия. Контракт готов.';bookFight()}else{n.purse=Math.round(n.purse*.94);n.bonus=Math.round(n.bonus*.94);n.message='Промоутер отказался от суммы. Он немного снизил потолок. Попробуй снова или прими условия.';n.step++;save();render()}}
function bookFight(){let o=S.selectedOpp,n=S.negotiation;S.contract={opponent:o,show:n.purse,bonus:n.bonus,org:o.org,rounds:3};S.negotiation=null;S.opponents=[];S.page='career';S.week=Math.max(S.week,4);save();render()}
function contractCard(){let c=S.contract,o=c.opponent;return `<div class="card" style="margin-top:14px"><div class="eyebrow">FIGHT BOOKED</div><div class="row"><div><h2>${esc(o.name)}</h2><p class="muted">${o.record} · ${o.style} · ${c.org}</p></div><div style="text-align:right"><div class="muted">Show / Win</div><b>$${c.show.toLocaleString()} / $${c.bonus.toLocaleString()}</b></div></div><div class="grid g3" style="margin-top:12px"><button class="btn" onclick="go('camp')">Готовить лагерь</button><button class="btn gold" onclick="advanceWeek()">Следующая неделя</button><button class="btn red" onclick="startFight()">Fight Night</button></div></div>`}
function camp(){if(!S.fighter)return create();let f=S.fighter;return `<div class="eyebrow">TRAINING CAMP</div><h1 class="title">Лагерь</h1><p class="muted">Неделя ${S.week}. Выбери приоритет. Каждая тренировка повышает профиль, но расходует здоровье.</p><div class="grid g2"><div class="card"><h2>🥊 Ударка</h2><p class="muted">Бокс, кики, скорость, точность.</p><button class="btn" onclick="train('striking')">Тренировать</button></div><div class="card"><h2>🤼 Борьба</h2><p class="muted">Тейкдаун, защита, клинч, контроль.</p><button class="btn" onclick="train('wrestling')">Тренировать</button></div><div class="card"><h2>🫁 Кардио</h2><p class="muted">Выносливость и восстановление.</p><button class="btn" onclick="train('cardio')">Тренировать</button></div><div class="card"><h2>🛌 Recovery</h2><p class="muted">Вернуть здоровье перед боем.</p><button class="btn gold" onclick="train('recovery')">Восстановиться</button></div></div><div class="card" style="margin-top:14px"><h2>Профиль</h2>${[['boxing','Бокс'],['kicks','Кики'],['takedowns','Тейкдауны'],['tddef','Защита от тейкдаунов'],['ground','Контроль'],['submission','Сабмишны'],['cardio','Кардио'],['defense','Защита']].map(x=>`<div style="margin:9px 0"><div class="row"><span>${x[1]}</span><b>${f.stats[x[0]]||0}</b></div><div class="bar"><i style="width:${f.stats[x[0]]||0}%"></i></div></div>`).join('')}</div>`}
function train(t){let f=S.fighter;if(t==='striking'){f.stats.boxing=Math.min(100,f.stats.boxing+2);f.stats.kicks=Math.min(100,f.stats.kicks+1);f.stats.speed=Math.min(100,f.stats.speed+1);f.health=Math.max(40,f.health-5)}if(t==='wrestling'){f.stats.takedowns=Math.min(100,f.stats.takedowns+2);f.stats.tddef=Math.min(100,f.stats.tddef+1);f.stats.ground=Math.min(100,f.stats.ground+1);f.health=Math.max(40,f.health-5)}if(t==='cardio'){f.stats.cardio=Math.min(100,f.stats.cardio+2);f.health=Math.max(45,f.health-2)}if(t==='recovery')f.health=Math.min(100,f.health+9);save();render()}
function advanceWeek(){S.week++;if(S.week>8){S.week=1;S.month++;if(S.month>12){S.month=1;S.year++}}if(S.contract&&S.week===8)S.week=8;save();render()}
function startFight(){if(!S.contract)return go('match');S.fight={round:1,clock:300,youHP:100,oppHP:100,youSTA:100,oppSTA:100,momentum:0,oppMomentum:0,log:['FIGHT NIGHT. Оба бойца выходят в клетку.','Раунд 1. Выбери тактику на ближайший отрезок боя.'],finished:false};S.page='fight';save();render()}
function fight(){if(!S.fight)return career();let q=S.fight,f=S.fighter,o=S.contract.opponent;return `<div class="fight-screen"><div class="eyebrow" style="text-align:center">${esc(S.contract.org)} · FIGHT NIGHT</div><div class="fight-head" style="margin-top:12px"><div class="fighter-side"><div class="avatar">${initials(f.name)}</div><h2>${esc(f.name)}</h2><div>${q.youHP}% HP · ${q.youSTA}% STA</div><div class="hp"><i style="width:${q.youHP}%"></i></div><div class="hp stamina"><i style="width:${q.youSTA}%"></i></div></div><div><div class="clock">${fmt(q.clock)}</div><div class="round">ROUND ${q.round} / 3</div><div class="vs">VS</div></div><div class="fighter-side"><div class="avatar">OP</div><h2>${esc(o.name)}</h2><div>${q.oppHP}% HP · ${q.oppSTA}% STA</div><div class="hp"><i style="width:${q.oppHP}%"></i></div><div class="hp stamina"><i style="width:${q.oppSTA}%"></i></div></div></div><div class="card" style="margin-top:15px"><div class="row"><b>Тактика на следующие 30 секунд</b><span class="phase">${q.momentum>=8?'ТВОЙ MOMENTUM':q.momentum<=-8?'ТЫ ПОД ДАВЛЕНИЕМ':'РАВНЫЙ БОЙ'}</span></div><div class="tactics" style="margin-top:12px"><button class="tactic" onclick="fightAct('box')"><b>🥊 BOXING</b><small>Работа руками, объём и точность</small></button><button class="tactic" onclick="fightAct('kick')"><b>🦵 KICKING</b><small>Дистанция, ноги, накопительный урон</small></button><button class="tactic" onclick="fightAct('pressure')"><b>🔥 PRESSURE</b><small>Давление и высокий темп</small></button><button class="tactic" onclick="fightAct('wrestle')"><b>🤼 WRESTLING</b><small>Тейкдауны и контроль</small></button><button class="tactic" onclick="fightAct('grapple')"><b>🥋 GRAPPLING</b><small>Партер и попытки сабмишна</small></button><button class="tactic" onclick="fightAct('counter')"><b>🧠 COUNTER</b><small>Защита и наказание за ошибки</small></button></div></div><div class="fight-log" style="margin-top:12px">${q.log.slice(-14).join('<br>')}</div></div>`}
function fightAct(a){let q=S.fight,f=S.fighter,o=S.contract.opponent;if(q.finished)return;let r=Math.random(),s=f.stats;let base={box:(s.boxing+s.speed+s.accuracy)/3,kick:(s.kicks+s.power+s.speed)/3,pressure:(s.power+s.cardio+s.strength)/3,wrestle:(s.takedowns+s.tddef+s.clinch)/3,grapple:(s.ground+s.submission+s.strength)/3,counter:(s.defense+s.accuracy+s.iq)/3}[a];let enemyBase={Striker:74,Wrestler:77,Submission:73,Kickboxer:75,Pressure:78,Counter:76}[o.style]||74;let tactical={box:{opp:0.9,sta:8,mom:2},kick:{opp:1.0,sta:7,mom:2},pressure:{opp:1.25,sta:13,mom:4},wrestle:{opp:.8,sta:12,mom:5},grapple:{opp:.75,sta:10,mom:4},counter:{opp:.55,sta:5,mom:3}}[a];let effectiveness=(base-enemyBase*.55)+r*22+q.momentum*.35;let damage=Math.max(0,Math.round(effectiveness/13*tactical.opp));let taken=Math.max(0,Math.round((enemyBase-base*.42+r*18)/14));let ai=['box','kick','pressure','wrestle','grapple','counter'][Math.floor(Math.random()*6)];if(ai==='wrestle'&&s.tddef<58)taken+=5;if(a==='wrestle'&&r<(s.takedowns/100)){damage+=Math.round(s.ground/18);q.momentum+=4;q.log.push(`R${q.round} ${fmt(q.clock)} · Тейкдаун! Ты переводишь бой в партер.`)}else{q.log.push(`R${q.round} ${fmt(q.clock)} · ${label(a)}: урон ${damage}, получено ${taken}.`)}q.oppHP=Math.max(0,q.oppHP-damage);q.youHP=Math.max(0,q.youHP-taken);q.youSTA=Math.max(0,q.youSTA-tactical.sta);q.oppSTA=Math.max(0,q.oppSTA-(5+Math.floor(r*7)));q.momentum=Math.max(-15,Math.min(15,q.momentum+tactical.mom-(taken>damage?3:0)));q.oppMomentum=Math.max(-15,Math.min(15,q.oppMomentum+2));if(q.oppHP<=0){q.finished=true;q.result={win:true,method:damage>12?'KO/TKO':'TKO'};return endFight()}if(q.youHP<=0){q.finished=true;q.result={win:false,method:'KO/TKO'};return endFight()}q.clock-=30;if(q.clock<=0){if(q.round<3){q.round++;q.clock=300;q.youSTA=Math.min(100,q.youSTA+8);q.oppSTA=Math.min(100,q.oppSTA+7);q.log.push(`--- Конец раунда. Начинается раунд ${q.round}. ---`)}else{let youScore=q.youHP+q.youSTA*.35+q.momentum*2,oppScore=q.oppHP+q.oppSTA*.35;if(youScore>=oppScore){q.result={win:true,method:'Decision'}}else{q.result={win:false,method:'Decision'}}q.finished=true;endFight()}}save();render()}
function label(a){return {box:'BOXING',kick:'KICKING',pressure:'PRESSURE',wrestle:'WRESTLING',grapple:'GRAPPLING',counter:'COUNTER'}[a]}
function endFight(){let q=S.fight,f=S.fighter,c=S.contract,o=c.opponent,win=q.result.win;let method=q.result.method;f.history=f.history||[];f.history.push({o:o.name,w:win,m:method,org:c.org});if(win){f.wins++;f.money+=c.show+c.bonus;f.popularity=Math.min(100,f.popularity+Math.round(5+o.score/25));f.confidence=Math.min(100,(f.confidence||70)+5)}else{f.losses++;f.money+=c.show;f.popularity=Math.max(0,f.popularity-2);f.confidence=Math.max(0,(f.confidence||70)-8)}f.record=f.wins+'-'+f.losses;f.health=Math.max(45,f.health-(win?10:20));if(win&&f.league==='Regional'&&f.wins>=3)f.league='RCC';else if(win&&f.league==='RCC'&&f.wins>=6)f.league='ACA';else if(win&&f.league==='ACA'&&f.wins>=9)f.league='Cage Warriors';else if(win&&f.league==='Cage Warriors'&&f.wins>=12)f.league='UFC';S.lastResult={win,method,name:o.name,org:c.org,record:f.record,payout:win?c.show+c.bonus:c.show};S.fight=null;S.contract=null;S.selectedOpp=null;S.page='result';S.week=Math.min(8,S.week+1);save();render()}
function result(){let r=S.lastResult;if(!r)return career();return `<div class="result ${r.win?'win':'loss'}"><div class="eyebrow">OFFICIAL RESULT</div><div class="bigresult">${r.win?'ПОБЕДА':'ПОРАЖЕНИЕ'}</div><h2>${esc(r.name)}</h2><p class="muted">${r.org} · ${r.method}</p><div class="grid g3" style="margin-top:18px"><div><div class="muted">Рекорд</div><div class="stat">${r.record}</div></div><div><div class="muted">Заработано</div><div class="stat">$${r.payout.toLocaleString()}</div></div><div><div class="muted">Следующий шаг</div><div class="stat">${r.win?'MATCHMAKING':'RECOVERY'}</div></div></div><button class="btn red" style="margin-top:18px" onclick="S.lastResult=null;go('career')">Продолжить карьеру</button></div>`}
function world(){return `<div class="eyebrow">MMA WORLD</div><h1 class="title">Организации</h1><div class="grid g2">${ORGS.map(o=>`<div class="card"><div class="row"><div><h2>${o[2]==='major'?'🏆 ':''}${o[0]}</h2><div class="muted">${o[1]} · ${o[2]==='major'?'Top 15 · P4P · титулы':'Региональная сцена · без рейтинга'}</div></div><span class="tag">${o[2].toUpperCase()}</span></div></div>`).join('')}</div>`}
function rank(){let names=['Ислам Махачев','Илия Топурия','Арман Царукян','Алекс Перейра','Том Аспиналл','Дрикус Дю Плесси','Мераб Двалишвили','Александр Волкановски','Шон О’Мэлли','Чарльз Оливейра','Пётр Ян','Макс Холлоуэй','Мовсар Евлоев','Пэдди Пимблетт','Александр Волков'];if(S.fighter&&S.fighter.wins>=5)names[14]=S.fighter.name;return `<div class="eyebrow">MAJOR RANKINGS</div><h1 class="title">Рейтинги</h1><div class="card"><div class="row"><h2>UFC</h2><select><option>Featherweight</option><option>Lightweight</option><option>Bantamweight</option><option>Welterweight</option></select></div><table class="table">${names.map((n,i)=>`<tr><td class="rank">${i?'#'+i:'C'}</td><td><b>${n}</b></td><td>${i<4?'Elite':'Ranked'}</td></tr>`).join('')}</table></div><div class="card" style="margin-top:14px"><h2>🌎 P4P</h2>${names.slice(0,10).map((n,i)=>`<p><b class="rank">#${i+1}</b> ${n}</p>`).join('')}</div>`}
function profile(){if(!S.fighter)return create();let f=S.fighter;return `<div class="eyebrow">FIGHTER PROFILE</div><h1 class="title">${esc(f.name)}</h1><div class="grid g2"><div class="card"><div class="avatar">${initials(f.name)}</div><h2>${esc(f.name)}</h2><p class="muted">${f.country} · ${f.age} лет · ${f.height} см</p><p>${f.weightName} · ${f.stance} · ${f.styleName}</p><div class="stat">${f.record}</div><p class="muted">${f.league} · Popularity ${f.popularity}</p></div><div class="card"><h2>Навыки</h2>${Object.entries(f.stats).map(x=>`<div style="margin:8px 0"><div class="row"><span>${statName(x[0])}</span><b>${x[1]}</b></div><div class="bar"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div></div>`}
function statName(k){return ({boxing:'Бокс',kicks:'Кики',power:'Сила удара',speed:'Скорость',accuracy:'Точность',defense:'Защита',takedowns:'Тейкдауны',tddef:'Защита от ТД',clinch:'Клинч',ground:'Контроль',submission:'Сабмишны',cardio:'Кардио',strength:'Физика',chin:'Стойкость',iq:'Fight IQ'})[k]||k}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function render(){let c=S.page==='home'?home():S.page==='create'?create():S.page==='career'?career():S.page==='match'?match():S.page==='negotiation'?negCard():S.page==='camp'?camp():S.page==='fight'?fight():S.page==='result'?result():S.page==='world'?world():S.page==='rank'?rank():profile();document.getElementById('app').innerHTML=shell(c)}render();
</script></body></html>
