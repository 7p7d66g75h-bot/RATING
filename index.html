<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Road to UFC V6</title><style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f4f5f7;font:14px Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:64px;background:#0b0c10;border-bottom:1px solid #292d36;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.logo{font-weight:950;letter-spacing:.08em}.logo b{color:#e93640}.layout{display:grid;grid-template-columns:220px 1fr;max-width:1450px;margin:auto}.side{min-height:calc(100vh - 64px);border-right:1px solid #292d36;padding:14px}.nav{display:grid;gap:6px}.nav button{background:transparent;border:1px solid transparent;color:#9ba2ae;padding:13px;border-radius:10px;text-align:left}.nav button.on,.nav button:hover{background:#171920;border-color:#30343d;color:#fff}.main{width:100%;max-width:1200px;margin:auto;padding:22px}.title{font-size:34px;font-weight:950;margin:4px 0 8px}.eyebrow{font-size:10px;letter-spacing:.18em;color:#ed4149;font-weight:900}.muted{color:#9097a4}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{background:#111318;border:1px solid #2a2e37;border-radius:14px;padding:16px}.hero{min-height:290px;padding:28px;border-radius:18px;border:1px solid #30343c;background:linear-gradient(135deg,#1a1d24,#0b0d11);display:flex;justify-content:space-between;align-items:end;gap:20px}.hero h1{font-size:48px;line-height:1;margin:9px 0}.btn{background:#181b21;border:1px solid #343944;color:#fff;border-radius:10px;padding:12px 16px;font-weight:850}.red{background:#dd2d36;border-color:#dd2d36}.green{background:#277c52;border-color:#277c52}.gold{background:#c6a15c;border-color:#c6a15c;color:#111}.btn:disabled{opacity:.4}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stat{font-size:27px;font-weight:950}.big{font-size:40px;font-weight:950}.tag{display:inline-block;border:1px solid #343943;border-radius:999px;padding:5px 9px;margin:3px;color:#cbd0d9;font-size:11px}.bar{height:7px;background:#292d36;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#df3038}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid #262a32;text-align:left}.table th{font-size:10px;text-transform:uppercase;color:#7f8794}.rank{font-weight:950}.win{color:#55c586}.loss{color:#e9575c}.mobile{display:none}.event{padding:12px;background:#0d0f13;border:1px solid #292d36;border-radius:10px;margin:7px 0}.day{padding:12px 5px;border:1px solid #2a2e37;border-radius:9px;text-align:center;background:#0d0f13}.day.active{border-color:#e9343c;background:#1b1013}.day.done{opacity:.4}.fightweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.feed{display:grid;gap:8px}.news{padding:12px;background:#0d0f13;border:1px solid #292d36;border-radius:10px}.match{display:grid;grid-template-columns:1fr 90px 1fr;gap:12px;align-items:center;text-align:center}.versus{font-size:22px;font-weight:950}.avatar{width:68px;height:68px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#343844,#15171c);border:1px solid #424752;font-weight:950}.offer{background:#0c0e12;border:1px solid #30343d;border-radius:12px;padding:15px}.money{font-size:28px;font-weight:950}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice button{padding:14px;background:#0d0f13;color:#bdc3cc;border:1px solid #2b2f38;border-radius:10px;text-align:left}.choice button.on{border-color:#e9343c;background:#1b1013;color:#fff}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;color:#808793;font-size:10px;text-transform:uppercase;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;background:#0b0d11;color:#fff;border:1px solid #2b2f38;border-radius:8px}.camp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.camp button{padding:16px;background:#0d0f13;color:#fff;border:1px solid #2b2f38;border-radius:10px;text-align:left}.camp button.on{border-color:#e9343c;background:#1b1013}.slider{width:100%;accent-color:#df3038}@media(max-width:850px){.layout{display:block}.side{display:none}.main{padding:14px 12px 82px}.hero{min-height:390px;padding:20px}.hero h1{font-size:38px}.g2,.g3,.g4,.form,.camp{grid-template-columns:1fr}.choice{grid-template-columns:1fr 1fr}.fightweek{grid-template-columns:repeat(4,1fr)}.match{grid-template-columns:1fr}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:9;background:#0b0c10f7;border-top:1px solid #292d36;grid-template-columns:repeat(5,1fr);padding:7px}.mobile button{border:0;background:transparent;color:#9ca3af;font-size:10px}.mobile .on{color:#fff;font-weight:900}}
</style></head><body><div id="app"></div><script>
const ORGS=[['UFC','major','🇺🇸'],['PFL','major','🇺🇸'],['ONE Championship','major','🇸🇬'],['RIZIN','major','🇯🇵'],['ACA','major','🇷🇺'],['KSW','major','🇵🇱'],['Cage Warriors','major','🇬🇧'],['LFA','major','🇺🇸'],['BRAVE CF','major','🇧🇭'],['OKTAGON MMA','major','🇨🇿'],['RCC','regional','🇷🇺'],['Fight Nights','regional','🇷🇺'],['MFP','regional','🇷🇺'],['Siberian Fight League','regional','🇷🇺'],['ACA Young Eagles','regional','🇷🇺'],['Open FC','regional','🇷🇺']];
const WEIGHTS=[['FLY','Flyweight',56.7],['BW','Bantamweight',61.2],['FW','Featherweight',65.8],['LW','Lightweight',70.3],['WW','Welterweight',77.1],['MW','Middleweight',83.9],['LHW','Light Heavyweight',93],['HW','Heavyweight',120.2]];
const STYLES=[['Striker','Ударник'],['Wrestler','Борец'],['Submission','Сабмишн-хантер'],['Kickboxer','Кикбоксер'],['Pressure','Прессинг-файтер'],['Counter','Контрпанчер'],['AllRounder','Универсал']];
const NAMES=['Максим Орлов','Дмитрий Сафин','Илья Морозов','Роман Беляев','Тимур Абаев','Владислав Ким','Алексей Волков','Марк Соколов','Денис Крылов','Иван Петров','Сергей Белов','Артур Магомедов','Никита Лебедев','Марат Абдуллин','Егор Фёдоров','Роман Кузнецов','Даниил Каримов','Матвей Соколов','Аслан Мусаев','Кирилл Панов'];
let S=JSON.parse(localStorage.getItem('mmaRoadV6')||localStorage.getItem('mmaRoadV5')||'null')||{page:'home',year:2026,week:1,fighter:null,offers:[],contract:null,opponent:null,camp:null,fight:null,news:[],events:[]};
function save(){localStorage.setItem('mmaRoadV6',JSON.stringify(S))}function go(p){S.page=p;save();render()}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function initials(n){return String(n).split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}function money(n){return '$'+Math.round(n).toLocaleString()}
function nav(){return [['home','⌂','Главная'],['career','♟','Карьера'],['match','⚔','Соперники'],['world','◉','Мир'],['rank','♛','Рейтинги'],['profile','●','Профиль']].map(x=>`<button class="${S.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}
function shell(c){return `<header class="top"><div class="logo">MMA <b>ROAD TO UFC</b></div><div class="muted">${S.fighter?esc(S.fighter.name)+' · '+S.fighter.record:'Новая карьера'}</div></header><div class="layout"><aside class="side"><div class="nav">${nav()}</div></aside><main class="main">${c}</main></div><nav class="mobile">${nav()}</nav>`}
function home(){if(!S.fighter)return `<div class="hero"><div><div class="eyebrow">MMA CAREER SIMULATOR · V6</div><h1>Пробейся в UFC.</h1><p class="muted">Живой мир MMA, события, рейтинги, контракты и карьера бойца.</p><button class="btn red" onclick="go('create')">Создать бойца</button></div></div>`;let f=S.fighter;return `<div class="hero"><div><div class="eyebrow">${S.year} · ${f.league}</div><h1>${esc(f.name)}</h1><p class="muted">${f.weightName} · ${f.styleName||f.style}</p><span class="tag">${f.record}</span><span class="tag">${money(f.money)}</span><span class="tag">${f.popularity||5} FANS</span></div><button class="btn red" onclick="go('${S.contract?'camp':'match'}')">${S.contract?'Тренировочный лагерь':'Найти бой'}</button></div><div class="grid g3" style="margin-top:13px"><div class="card"><div class="muted">Рейтинг</div><div class="big">${f.divRank?'#'+f.divRank:'NR'}</div></div><div class="card"><div class="muted">Форма</div><div class="big">${f.form||70}%</div></div><div class="card"><div class="muted">Деньги</div><div class="stat">${money(f.money)}</div></div></div><div class="grid g2" style="margin-top:13px"><div class="card"><h2>Новости</h2>${newsHtml()}</div><div class="card"><h2>Ближайшие события</h2>${eventsHtml()}</div></div>`}
function create(){return `<div class="eyebrow">NEW CAREER</div><h1 class="title">Создание бойца</h1><div class="card"><div class="form"><div class="field"><label>Имя</label><input id="n" placeholder="Александр Брюханов"></div><div class="field"><label>Возраст</label><input id="age" type="number" value="20"></div><div class="field"><label>Рост</label><input id="h" type="number" value="174"></div><div class="field"><label>Страна</label><input id="c" value="RUS"></div><div class="field"><label>Весовая</label><select id="w">${WEIGHTS.map(x=>`<option value="${x[0]}">${x[1]} · ${x[2]} кг</option>`).join('')}</select></div><div class="field"><label>Стиль</label><select id="s">${STYLES.map(x=>`<option>${x[0]}</option>`).join('')}</select></div></div><button class="btn red" style="margin-top:15px" onclick="startCareer()">Начать карьеру</button></div>`}
function startCareer(){let w=WEIGHTS.find(x=>x[0]===document.getElementById('w').value);S.fighter={name:document.getElementById('n').value||'Александр Брюханов',age:+document.getElementById('age').value||20,height:+document.getElementById('h').value||174,country:document.getElementById('c').value||'RUS',weight:w[0],weightName:w[1],limit:w[2],style:document.getElementById('s').value,styleName:document.getElementById('s').value,league:'Siberian Fight League',record:'0-0',wins:0,losses:0,money:1500,popularity:5,form:70,divRank:0,history:[],stats:{boxing:68,kicks:67,wrestling:65,ground:64,cardio:70,defense:65,power:66,speed:68,chin:70,iq:64}};seedWorld();S.page='career';save();render()}
function seedWorld(){S.events=[{org:'SFL',name:'Siberian Fight Night 18',date:'12 JAN',loc:'Krasnoyarsk'},{org:'RCC',name:'RCC 19',date:'25 JAN',loc:'Yekaterinburg'},{org:'ACA',name:'ACA 204',date:'08 FEB',loc:'Moscow'},{org:'UFC',name:'UFC Fight Night',date:'21 FEB',loc:'Las Vegas'}];S.news=['RCC объявил новый главный бой.','Проспект забрал победу сабмишном в первом раунде.','ACA подписала двух непобеждённых региональных бойцов.']}
function eventsHtml(){return (S.events||[]).slice(0,4).map(e=>`<div class="event"><b>${e.org}</b> · ${e.name}<div class="muted">${e.date} · ${e.loc}</div></div>`).join('')}
function newsHtml(){return (S.news||[]).slice(0,5).map(n=>`<div class="news">${esc(n)}</div>`).join('')}
function career(){let f=S.fighter;if(!f)return create();return `<div class="row"><div><div class="eyebrow">CAREER HUB</div><h1 class="title">${esc(f.name)}</h1><div class="muted">${f.league} · ${f.weightName} · ${f.record}</div></div><button class="btn red" onclick="generateOffers()">Искать бой</button></div><div class="card" style="margin-top:13px"><h2>Fight Week</h2><div class="fightweek">${['MON','TUE','WED','THU','FRI','SAT','SUN'].map((x,i)=>`<div class="day ${i===3?'active':''}"><b>${x}</b><br><small>${['Rest','Gym','Spar','Media','Cut','Weigh-in','FIGHT'][i]}</small></div>`).join('')}</div></div><div class="grid g4" style="margin-top:13px">${[['Рекорд',f.record],['Деньги',money(f.money)],['Форма',(f.form||70)+'%'],['Рейтинг',f.divRank?'#'+f.divRank:'NR']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('')}</div><div class="grid g2" style="margin-top:13px"><div class="card"><h2>История боёв</h2>${f.history.length?f.history.slice().reverse().map(x=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #292d36"><span>${esc(x.o)}</span><b class="${x.w?'win':'loss'}">${x.w?'WIN':'LOSS'} · ${x.m}</b></div>`).join(''):'<div class="muted">Профессионального дебюта ещё не было.</div>'}</div><div class="card"><h2>Путь</h2><p>Regional → RCC → ACA → Cage Warriors → UFC. Победы и качество соперников двигают тебя вверх.</p></div></div>`}
function generateOffers(){let f=S.fighter;S.offers=Array.from({length:6},()=>{let rank=Math.max(0,(f.divRank||18)+Math.floor(Math.random()*9)-4);return{name:NAMES[Math.floor(Math.random()*NAMES.length)],record:(3+Math.floor(Math.random()*15))+'-'+Math.floor(Math.random()*4),style:STYLES[Math.floor(Math.random()*STYLES.length)][0],rank,score:55+Math.floor(Math.random()*40),purse:700+Math.floor(Math.random()*18)*250,risk:rank<=5?'HIGH':rank<=12?'MEDIUM':'LOW',org:f.league}});S.page='match';save();render()}
function match(){if(!S.fighter)return create();if(!S.offers.length)return `<div class="card"><h2>Нет активных предложений</h2><button class="btn red" onclick="generateOffers()">Запросить соперников</button></div>`;return `<div class="eyebrow">MATCHMAKING</div><h1 class="title">Шесть путей к следующему бою</h1><p class="muted">Безопасный бой, денежный бой или риск ради рейтинга.</p><div class="grid g2">${S.offers.map((o,i)=>`<div class="card"><div class="row"><span class="tag">${o.org}</span><b class="${o.risk==='HIGH'?'loss':o.risk==='MEDIUM'?'gold':''}">${o.risk}</b></div><div class="match" style="margin:15px 0"><div><div class="avatar">${initials(S.fighter.name)}</div><b>${esc(S.fighter.name)}</b><small class="muted">${S.fighter.record}</small></div><div class="versus">VS</div><div><div class="avatar">${initials(o.name)}</div><b>${esc(o.name)}</b><small class="muted">${o.record}</small></div></div><div class="grid g3"><div><small class="muted">RANK</small><br>${o.rank?'#'+o.rank:'NR'}</div><div><small class="muted">PURSE</small><br>${money(o.purse)}</div><div><small class="muted">MATCH</small><br>${o.score}</div></div><button class="btn red" style="width:100%;margin-top:12px" onclick="offer(${i})">Открыть переговоры</button></div>`).join('')}</div>`}
function offer(i){S.opponent=S.offers[i];S.neg={show:S.opponent.purse,win:S.opponent.purse};S.page='neg';save();render()}
function neg(){let o=S.opponent,n=S.neg;return `<div class="eyebrow">CONTRACT NEGOTIATION</div><h1 class="title">${esc(o.name)}</h1><div class="grid g2"><div class="card"><div class="avatar">${initials(o.name)}</div><h2>${esc(o.name)}</h2><p>${o.record} · ${o.style} · ${o.org}</p><p class="muted">Rank ${o.rank?'#'+o.rank:'NR'} · Match ${o.score}</p></div><div class="card"><h2>Условия</h2><div class="grid g2"><div class="offer"><small>SHOW</small><div class="money">${money(n.show)}</div></div><div class="offer"><small>WIN</small><div class="money">${money(n.win)}</div></div></div><p>Show <input class="slider" type="range" min="500" max="6000" step="100" value="${n.show}" oninput="S.neg.show=+this.value;render()"></p><p>Win <input class="slider" type="range" min="500" max="8000" step="100" value="${n.win}" oninput="S.neg.win=+this.value;render()"></p><button class="btn red" style="width:100%" onclick="sign()">Отправить предложение</button></div></div>`}
function sign(){let o=S.opponent,n=S.neg,ratio=(n.show+n.win)/(o.purse*2);if(ratio>1.8&&Math.random()<.75){alert('Промоушен отказал: требования слишком высокие.');S.neg={show:o.purse,win:o.purse};save();render();return}if(ratio>1.3&&Math.random()<.45){alert('Встречное предложение.');S.neg={show:Math.round(o.purse*1.15/100)*100,win:Math.round(o.purse*1.15/100)*100};save();render();return}S.contract={opponent:o,show:n.show,win:n.win,weeks:6};S.page='camp';save();render()}
function camp(){let c=S.contract;if(!c)return career();let f=S.fighter,x=S.camp||(S.camp={week:1,focus:null,fitness:55,hype:20,injury:0});let plans=[['boxing','🥊 Бокс','точность + скорость'],['wrestling','🤼 Борьба','тейкдауны + защита'],['ground','🥋 BJJ','контроль + сабмишны'],['kicks','🦵 Кики','дистанция + урон'],['cardio','🫁 Кардио','выносливость'],['power','🏋️ Сила','мощь + клинч'],['tape','🎥 Watch Tape','изучить стиль соперника'],['spar','🥊 Спарринг','форма + IQ, риск травмы'],['recovery','🛌 Recovery','здоровье + форма']];return `<div class="eyebrow">TRAINING CAMP · ${x.week}/${c.weeks}</div><div class="row"><div><h1 class="title">Лагерь: ${esc(c.opponent.name)}</h1><div class="muted">${c.opponent.style} · ${c.opponent.risk} risk</div></div><span class="tag">Fitness ${x.fitness}%</span><span class="tag">Hype ${x.hype}%</span></div><div class="card" style="margin-top:13px"><div class="fightweek">${Array.from({length:c.weeks},(_,i)=>`<div class="day ${i+1===x.week?'active':''} ${i+1<x.week?'done':''}"><b>${i+1}</b><br><small>${i+1===c.weeks?'FIGHT':'CAMP'}</small></div>`).join('')}</div></div><div class="camp" style="margin-top:13px">${plans.map(p=>`<button class="${x.focus===p[0]?'on':''}" onclick="campPick('${p[0]}')"><h3>${p[1]}</h3><div class="muted">${p[2]}</div></button>`).join('')}</div><div class="card" style="margin-top:13px"><h2>Форма лагеря</h2><p>Fitness</p><div class="bar"><i style="width:${x.fitness}%"></i></div><p>Hype</p><div class="bar"><i style="width:${x.hype}%"></i></div><p>Injury</p><div class="bar"><i style="width:${x.injury}%"></i></div><button class="btn red" style="margin-top:14px" onclick="campNext()">Завершить неделю</button></div>`}
function campPick(p){S.camp=S.camp||{week:1,focus:null,fitness:55,hype:20,injury:0};S.camp.focus=p;save();render()}
function campNext(){let x=S.camp,f=S.fighter,p=x.focus;if(!p){alert('Выбери фокус недели.');return}let map={boxing:'boxing',wrestling:'wrestling',ground:'ground',kicks:'kicks',cardio:'cardio',power:'power'};if(map[p])f.stats[map[p]]=Math.min(100,f.stats[map[p]]+2);if(p==='tape'){f.stats.iq=Math.min(100,f.stats.iq+2);x.hype+=3}if(p==='spar'){x.fitness+=9;f.stats.iq=Math.min(100,f.stats.iq+2);if(Math.random()<.14)x.injury=Math.min(100,x.injury+18)}if(p==='recovery'){x.fitness+=12;x.injury=Math.max(0,x.injury-20)}x.fitness=Math.min(100,x.fitness+3);if(p!=='recovery')x.injury=Math.min(100,x.injury+4);x.hype=Math.min(100,x.hype+4);if(x.week<c.weeks){x.week++;x.focus=null}else startFight();save();render()}
function startFight(){S.fight={round:1,time:300,you:100,opp:100,st:100,os:100,log:['FIGHT NIGHT. Раунд 1.'],finished:false};S.page='fight'}
function fight(){let q=S.fight,f=S.fighter,o=S.contract.opponent;if(q.finished)return `<div class="card" style="text-align:center"><div class="eyebrow">OFFICIAL RESULT</div><div class="big">${q.result}</div><p>${q.method}</p><button class="btn red" onclick="finishFight()">Завершить бой</button></div>`;let acts=[['box','🥊 Boxing','объём и точность'],['kick','🦵 Kicks','дистанция'],['wrestle','🤼 Wrestling','тейкдаун'],['ground','🥋 Grappling','партер'],['counter','🎯 Counter','тайминг'],['recover','🫁 Recover','восстановление']];return `<div style="max-width:980px;margin:auto"><div class="eyebrow" style="text-align:center">${esc(o.name)} · ${f.weightName}</div><div class="big" style="text-align:center">${Math.floor(q.time/60)}:${String(q.time%60).padStart(2,'0')}</div><div class="muted" style="text-align:center">ROUND ${q.round}/3</div><div class="match" style="margin:15px 0"><div><div class="avatar">${initials(f.name)}</div><h2>${esc(f.name)}</h2><b>${q.you}%</b><div class="bar"><i style="width:${q.you}%"></i></div><small>Stamina ${q.st}%</small></div><div class="versus">VS</div><div><div class="avatar">${initials(o.name)}</div><h2>${esc(o.name)}</h2><b>${q.opp}%</b><div class="bar"><i style="width:${q.opp}%"></i></div><small>Stamina ${q.os}%</small></div></div><div class="grid g3">${acts.map(a=>`<button class="card" style="color:#fff;text-align:left" onclick="act('${a[0]}')"><b>${a[1]}</b><br><small class="muted">${a[2]}</small></button>`).join('')}</div><div class="card" style="margin-top:12px"><b>Fight log</b><div class="feed" style="margin-top:8px">${q.log.slice(-8).map(x=>`<div class="news">${x}</div>`).join('')}</div></div></div>`}
function act(a){let q=S.fight,f=S.fighter,o=S.contract.opponent,r=Math.random(),atk=0,enemy=0,text='';if(a==='box'){atk=(f.stats.boxing+f.stats.speed)/12*(.7+r);q.st-=7;text='Бокс: работа первым номером.'}if(a==='kick'){atk=f.stats.kicks/7*(.6+r);q.st-=8;text='Кики: держишь дистанцию.'}if(a==='wrestle'){if(r<f.stats.wrestling/100){atk=12+f.stats.wrestling/8;text='Тейкдаун и контроль.'}else{text='Соперник защитил тейкдаун.'}q.st-=9}if(a==='ground'){atk=f.stats.ground/7*(.6+r);q.st-=8;text='Партер: контроль и давление.'}if(a==='counter'){atk=r<.7?f.stats.iq/6:3;q.st-=4;text='Контратака после ошибки.'}if(a==='recover'){q.st=Math.min(100,q.st+18);enemy=2;text='Сброс темпа.'}enemy+=Math.max(2,(o.score||70)/9*r);q.opp=Math.max(0,q.opp-Math.round(atk));q.you=Math.max(0,q.you-Math.round(enemy));q.st=Math.max(0,q.st);q.os=Math.max(0,q.os-5);q.log.push(`R${q.round} · ${text}`);if(q.opp<=0||q.you<=0){q.finished=true;q.result=q.opp<=0?'ПОБЕДА':'ПОРАЖЕНИЕ';q.method='KO/TKO'}else{q.time-=30;if(q.time<=0){if(q.round<3){q.round++;q.time=300;q.log.push('Перерыв. Угол даёт инструкции.')}else{q.finished=true;q.result=q.you>q.opp?'ПОБЕДА':'ПОРАЖЕНИЕ';q.method='Decision'}}}save();render()}
function finishFight(){let f=S.fighter,o=S.contract.opponent,q=S.fight,w=q.result==='ПОБЕДА';f.history.push({o:o.name,w,m:q.method});if(w){f.wins++;f.money+=S.contract.show+S.contract.win;f.popularity=(f.popularity||5)+6;f.form=Math.min(100,(f.form||70)+5);f.divRank=Math.max(1,(f.divRank||18)-4)}else{f.losses++;f.money+=S.contract.show;f.form=Math.max(40,(f.form||70)-9);f.divRank=Math.min(15,(f.divRank||10)+3)}f.record=f.wins+'-'+f.losses;promote();S.contract=null;S.opponent=null;S.offers=[];S.camp=null;S.fight=null;advanceWorld();S.page='career';save();render()}
function promote(){let f=S.fighter;if(f.league==='Siberian Fight League'&&f.wins>=3)f.league='RCC';else if(f.league==='RCC'&&f.wins>=6)f.league='ACA';else if(f.league==='ACA'&&f.wins>=9)f.league='Cage Warriors';else if(f.league==='Cage Warriors'&&f.wins>=12)f.league='UFC'}
function advanceWorld(){S.week++;if(S.week>4){S.week=1;S.year++;S.news.unshift('Новый месяц MMA: рейтинги снова изменились.');if(S.news.length>8)S.news.pop()}if(S.events.length){let e=S.events.shift();S.events.push({org:['UFC','PFL','RCC','ACA'][Math.floor(Math.random()*4)],name:'Fight Night '+(20+Math.floor(Math.random()*80)),date:'NEXT MONTH',loc:['Moscow','Las Vegas','London','Abu Dhabi'][Math.floor(Math.random()*4)]})}}
function world(){return `<div class="eyebrow">THE MMA WORLD</div><h1 class="title">Мир MMA</h1><div class="grid g2"><div class="card"><h2>Upcoming Events</h2>${eventsHtml()}</div><div class="card"><h2>News Feed</h2><div class="feed">${newsHtml()}</div></div></div><h2 style="margin-top:24px">Организации</h2><div class="grid g4">${ORGS.map(o=>`<div class="card"><h3>${o[2]} ${o[0]}</h3><div class="muted">${o[1]==='major'?'Rankings · P4P · Titles':'Regional · No rankings'}</div></div>`).join('')}</div>`}
function rank(){let f=S.fighter,n=['Islam Makhachev','Ilia Topuria','Alex Pereira','Tom Aspinall','Merab Dvalishvili','Dricus du Plessis','Arman Tsarukyan','Max Holloway','Petr Yan','Charles Oliveira','Justin Gaethje','Sean O’Malley','Movsar Evloev','Paddy Pimblett','Alexander Volkanovski'];if(f&&f.league==='UFC'&&f.wins>=12)n[13]=f.name;return `<div class="eyebrow">RANKINGS</div><h1 class="title">UFC Rankings</h1><div class="card"><div class="row"><select>${WEIGHTS.map(w=>`<option>${w[1]}</option>`).join('')}</select><span class="tag">P4P</span></div><table class="table"><tr><th>#</th><th>Fighter</th><th>Record</th><th>Status</th></tr>${n.map((x,i)=>`<tr><td class="rank">${i===0?'C':'#'+i}</td><td><b>${x}</b></td><td>${18-i}-${i%4}</td><td>${i<5?'ELITE':'RANKED'}</td></tr>`).join('')}</table></div><div class="card" style="margin-top:12px"><h2>P4P Top 10</h2>${n.slice(0,10).map((x,i)=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #292d36"><b>#${i+1}</b><span>${x}</span></div>`).join('')}</div>`}
function profile(){let f=S.fighter;if(!f)return create();return `<div class="eyebrow">FIGHTER</div><h1 class="title">${esc(f.name)}</h1><div class="grid g2"><div class="card"><div class="avatar">${initials(f.name)}</div><h2>${esc(f.name)}</h2><p>${f.country} · ${f.age} лет · ${f.height} см</p><p>${f.weightName} · ${f.styleName||f.style}</p><div class="big">${f.record}</div><p>${f.league} · ${money(f.money)}</p></div><div class="card"><h2>Attributes</h2>${Object.entries(f.stats).map(([k,v])=>`<div style="margin:9px 0"><div class="row"><span>${k}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</div></div>`}
function render(){let c=S.page==='home'?home():S.page==='create'?create():S.page==='career'?career():S.page==='match'?match():S.page==='neg'?neg():S.page==='camp'?camp():S.page==='fight'?fight():S.page==='world'?world():S.page==='rank'?rank():profile();document.getElementById('app').innerHTML=shell(c)}render();
</script></body></html>
