<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIGHTER RATINGS</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0b;color:#eee;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:760px;margin:auto;padding-bottom:90px}header{padding:18px 16px;border-bottom:1px solid #292c30;position:sticky;top:0;background:#090a0bee;backdrop-filter:blur(12px);z-index:3}.brand{font-size:10px;letter-spacing:2px;color:#888}.title{font-size:27px;font-weight:900;margin-top:3px}.nav{display:flex;gap:6px;padding:10px 12px;overflow:auto}.nav button,.bottom button,button{background:#17191b;color:#ddd;border:1px solid #292c30;border-radius:10px;padding:9px 12px}.nav .on,.bottom .on,.primary{background:#eee!important;color:#090a0b!important}.main{padding:10px 12px}.card,.row{background:#121416;border:1px solid #292c30;border-radius:13px}.card{padding:15px;margin-bottom:10px}.row{display:flex;align-items:center;padding:11px;gap:10px}.rank{width:30px;text-align:center;font-size:19px;font-weight:900}.flag{font-size:25px;width:30px;text-align:center}.grow{flex:1}.name{font-weight:800}.meta{font-size:10px;color:#858a90;margin-top:3px}.record{font-weight:900}.muted{font-size:11px;color:#858a90}.hero{font-size:32px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stat{background:#181a1d;border:1px solid #292c30;border-radius:10px;padding:12px}.stat b{display:block;font-size:19px}.stat span{font-size:9px;color:#858a90}.list{display:grid;gap:7px}.edit{background:#222;color:#fff;border:1px solid #3a3d41;padding:6px 8px;border-radius:7px;font-size:10px}.champ{font-size:10px;background:#eee;color:#090a0b;padding:4px 6px;border-radius:6px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0c0dee;border-top:1px solid #292c30;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;z-index:4}.bottom button{border:0;background:transparent;font-size:10px}.bottom span{display:block;font-size:17px;margin-bottom:2px}input,select{width:100%;padding:11px;background:#0e1012;color:#eee;border:1px solid #292c30;border-radius:9px;margin:5px 0 10px}label{font-size:10px;color:#888}.primary{width:100%;padding:12px;border:0;border-radius:9px;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:5;padding:20px 12px;overflow:auto}.modal.show{display:block}.box{max-width:700px;margin:auto;background:#111315;border:1px solid #292c30;border-radius:15px;padding:15px}.close{float:right;background:#222;color:#fff;border:0;border-radius:7px;padding:7px}.historyWin{color:#38df7b;font-weight:900}.historyLoss{color:#ff6060;font-weight:900}.historyDraw{color:#aaa;font-weight:900}.section{font-weight:900;margin:18px 0 8px}.outside{margin-top:20px}.outsideTitle{font-size:12px;font-weight:900;color:#999;text-transform:uppercase;letter-spacing:1px}</style></head><body><div class="app"><header><div class="brand">PERSONAL DATABASE</div><div class="title">FIGHTER RATINGS</div></header><div class="nav" id="weights"></div><main class="main" id="main"></main></div><div class="bottom"><button onclick="page='home';render()"><span>⌂</span>Главная</button><button onclick="page='rank';render()"><span>▤</span>Рейтинги</button><button onclick="page='fighters';render()"><span>◉</span>Бойцы</button><button onclick="page='add';render()"><span>＋</span>Бой</button></div><div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div><script>
const W=['P4P','Heavyweight','Light Heavyweight','Middleweight','Welterweight','Lightweight','Featherweight','Bantamweight','Flyweight'];const FLAGS={RU:'🇷🇺',US:'🇺🇸',BR:'🇧🇷',ES:'🇪🇸',NZ:'🇳🇿',GE:'🇬🇪',PL:'🇵🇱',FR:'🇫🇷',IE:'🇮🇪',AU:'🇦🇺',GB:'🇬🇧',MX:'🇲🇽',NL:'🇳🇱',CA:'🇨🇦',ZA:'🇿🇦',KZ:'🇰🇿',AM:'🇦🇲',AR:'🇦🇷',AE:'🇦🇪',NG:'🇳🇬',KR:'🇰🇷',JP:'🇯🇵',AO:'🇦🇴',AZ:'🇦🇿'};const names={Heavyweight:'Тяжёлый', 'Light Heavyweight':'Полутяжёлый',Middleweight:'Средний',Welterweight:'Полусредний',Lightweight:'Лёгкий',Featherweight:'Полулёгкий',Bantamweight:'Легчайший',Flyweight:'Наилегчайший'};
const seed=[['Кёртис Блейдс','Heavyweight','US',6,0,0],['Том Аспиналл','Heavyweight','GB',3,0,0],['Джон Джонс','Heavyweight','US',2,0,0],['Сирил Ган','Heavyweight','FR',2,0,0],['Фёдор Емельяненко','Heavyweight','RU',3,2,0],['Алекс Перейра','Light Heavyweight','BR',6,1,0],['Магомед Анкалаев','Light Heavyweight','RU',2,0,0],['Пауло Коста','Light Heavyweight','BR',3,0,0],['Карлос Улберг','Light Heavyweight','NZ',3,3,0],['Ян Блахович','Light Heavyweight','PL',2,0,0],['Исраэль Адесанья','Middleweight','NG',6,0,0],['Алекс Перейра','Middleweight','BR',3,1,0],['Роберт Уиттакер','Middleweight','AU',1,2,0],['Шон Стрикленд','Middleweight','US',1,1,0],['Бо Никал','Middleweight','US',2,1,0],['Джек Маддалена','Welterweight','AU',5,0,0],['Ислам Махачев','Welterweight','RU',4,1,0],['Конор Макгрегор','Welterweight','IE',4,2,0],['Шон Брэди','Welterweight','US',2,0,0],['Кевин Холланд','Welterweight','US',1,0,0],['Белал Мухаммад','Welterweight','AE',1,0,0],['Тони Фергюсон','Lightweight','US',8,1,0],['Илия Топурия','Lightweight','ES',10,3,0],['Майкл Чендлер','Lightweight','US',3,0,0],['Дастин Порье','Lightweight','US',3,1,0],['Маурисио Руффи','Lightweight','BR',5,2,0],['Бенуа Сен-Дени','Lightweight','FR',1,0,0],['Дональд Серроне','Lightweight','US',1,1,0],['Дэн Хукер','Lightweight','NZ',3,1,0],['Рафаэль Физиев','Lightweight','AZ',1,2,0],['Джастин Гейджи','Lightweight','US',1,3,0],['Бенеил Дариуш','Lightweight','US',1,0,0],['Халил Тёрнер','Lightweight','US',1,0,0],['Арман Царукян','Lightweight','AM',1,2,0],['Эстебан Рибович','Lightweight','AR',1,0,0],['Матеуш Гамрот','Lightweight','PL',1,0,0],['Бобби Грин','Lightweight','US',1,0,0],['Корейский Зомби','Featherweight','KR',5,0,0],['Мовсар Евлоев','Featherweight','RU',2,0,0],['Макс Холлоуэй','Featherweight','US',1,0,0],['Александр Волкановски','Featherweight','AU',1,2,0],['Брайан Ортега','Featherweight','US',2,0,0],['Лерон Мерфи','Featherweight','GB',1,0,0],['Шон Вудсон','Featherweight','US',1,0,0],['Арнольд Аллен','Featherweight','GB',1,1,0],['Кевин Вальехос','Featherweight','AR',1,1,0],['Юрайя Фейбер','Featherweight','US',2,1,0],['Патрисио Питбуль','Featherweight','BR',1,0,0],['Жозе Альдо','Featherweight','BR',1,1,0],['Гига Чикадзе','Featherweight','GE',1,0,0],['Джин Силва','Featherweight','BR',0,1,0],['Пётр Ян','Bantamweight','RU',5,1,0],['Мераб Двалишвили','Bantamweight','GE',3,0,0],['Жозе Альдо','Bantamweight','BR',3,1,0],['Ти Джей Диллашоу','Bantamweight','US',2,1,0],['Кори Сэндхаген','Bantamweight','US',3,2,0],['Коди Гарбрандт','Bantamweight','US',2,0,0],['Роб Фонт','Bantamweight','US',2,1,0],['Доминик Круз','Bantamweight','US',2,1,0],['Шон О’Мэлли','Bantamweight','US',1,1,0],['Умар Нурмагомедов','Bantamweight','RU',2,1,0],['Кай Аскаура','Flyweight','JP',2,0,0],['Брендон Морено','Flyweight','MX',3,1,0],['Алешандру Пантожа','Flyweight','BR',1,1,0],['Манель Капе','Flyweight','AO',1,1,0],['Деметриус Джонсон','Flyweight','US',2,2,0],['Татсуро Тайра','Flyweight','JP',0,0,0]];
let F=JSON.parse(localStorage.ratingDB||'null');if(!F)F=seed.map((x,i)=>({id:i+1,name:x[0],weight:x[1],country:x[2],wins:x[3],losses:x[4],draws:x[5],rank:99,champion:false,titleWins:0,titleDefenses:0,activeDefenses:0,streak:0,history:[]}));F.forEach((f,i)=>{f.id=f.id||i+1;f.draws=f.draws||0;f.history=f.history||[];f.rank=f.rank||99;f.titleWins=f.titleWins||0;f.titleDefenses=f.titleDefenses||0;f.activeDefenses=f.activeDefenses||0;f.streak=f.streak||0});let weight='P4P',page='home';const save=()=>localStorage.ratingDB=JSON.stringify(F),flag=f=>FLAGS[f.country]||'🏳️';
function p4p(){return F.slice().sort((a,b)=>(b.wins-b.losses)-(a.wins-a.losses)||b.wins-a.wins)}function ranked(){return F.filter(f=>f.weight===weight).slice().sort((a,b)=>(a.rank||99)-(b.rank||99)||b.wins-a.wins)}function render(){document.getElementById('weights').innerHTML=W.map(x=>`<button class="${weight===x?'on':''}" onclick="weight='${x}';page='rank';render()">${x==='P4P'?x:names[x]}</button>`).join('');let m=document.getElementById('main');({home:home,rank:rank,fighters:fighters,add:add,addfighter:addfighter}[page]||home)(m)}
function row(f,pos){return `<div class="row"><div class="rank">${pos}</div><div class="flag">${flag(f)}</div><div class="grow" onclick="openProfile(${f.id})"><div class="name">${f.name} ${f.champion?'🏆':''}</div><div class="meta">${names[f.weight]||'P4P'} · ${f.wins}-${f.losses}-${f.draws}</div></div><button class="edit" onclick="editFighter(${f.id})">✎</button></div>`}
function home(m){m.innerHTML=`<div class="card"><div class="muted">DATABASE</div><div class="hero">${F.length}</div><div class="muted">бойцов</div></div><h3>P4P TOP 15</h3><div class="list">${p4p().slice(0,15).map((f,i)=>row(f,i+1)).join('')}</div>`}function rank(m){let a=weight==='P4P'?p4p():ranked(),top=a.slice(0,15),out=a.slice(15);m.innerHTML=`<div class="card"><div class="muted">RANKING</div><div class="hero" style="font-size:25px">${weight==='P4P'?'P4P':names[weight]}</div><div class="muted">Всегда TOP-15 + все бойцы за пределами рейтинга</div></div><div class="list">${top.map((f,i)=>row(f,i+1)).join('')||'<div class="card muted">Нет бойцов</div>'}</div>${out.length?`<div class="outside"><div class="outsideTitle">За пределами TOP-15</div><div class="list">${out.map((f,i)=>row(f,i+16)).join('')}</div></div>`:''}`}
function fighters(m){m.innerHTML=`<div class="card"><button class="primary" onclick="page='addfighter';render()">＋ ДОБАВИТЬ БОЙЦА</button></div><input id="q" placeholder="Поиск..." oninput="searchF()"><div id="fl" class="list">${F.map((f,i)=>row(f,i+1)).join('')}</div>`}function searchF(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('fl').innerHTML=F.filter(f=>f.name.toLowerCase().includes(q)).map((f,i)=>row(f,i+1)).join('')}
function add(m){m.innerHTML=`<div class="card"><h2>＋ Бой</h2><label>Боец</label><select id="bf">${F.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(f=>`<option value="${f.id}">${flag(f)} ${f.name} — ${f.wins}-${f.losses}-${f.draws}</option>`).join('')}</select><label>Результат</label><select id="br"><option value="W">Победа</option><option value="L">Поражение</option><option value="D">Ничья</option></select><label>Метод</label><select id="bm"><option>KO/TKO</option><option>SUBMISSION</option><option>DECISION</option><option>DRAW</option></select><label>Раунд</label><select id="bround"><option>1R</option><option>2R</option><option>3R</option><option>4R</option><option>5R</option></select><button class="primary" onclick="addFight()">СОХРАНИТЬ БОЙ</button></div>`}
function addfighter(m){m.innerHTML=`<div class="card"><h2>Добавить бойца</h2><label>Имя</label><input id="nn"><label>Страна</label><select id="nc">${Object.entries(FLAGS).map(([k,v])=>`<option value="${k}">${v} ${k}</option>`).join('')}</select><label>Весовая</label><select id="nw">${W.slice(1).map(x=>`<option>${x}</option>`).join('')}</select><label>Место</label><input id="nr" type="number" value="15"><button class="primary" onclick="createFighter()">ДОБАВИТЬ</button></div>`}
function createFighter(){let name=nn.value.trim();if(!name)return alert('Введите имя');F.push({id:Date.now(),name,country:nc.value,weight:nw.value,wins:0,losses:0,draws:0,rank:+nr.value||15,champion:false,titleWins:0,titleDefenses:0,activeDefenses:0,streak:0,history:[]});save();page='fighters';render()}
function addFight(){let f=F.find(x=>x.id==bf.value),r=br.value;if(r==='W'){f.wins++;f.streak=f.streak>0?f.streak+1:1}else if(r==='L'){f.losses++;f.streak=f.streak<0?f.streak-1:-1}else f.draws++;f.history.unshift({result:r,method:bm.value,round:bround.value,date:new Date().toLocaleDateString('ru-RU')});save();openProfile(f.id)}
function openProfile(id){let f=F.find(x=>x.id===id),s=Math.abs(f.streak),st=f.streak>0?`+${s} побед`:f.streak<0?`-${s} поражений`:'—';modalContent.innerHTML=`<div class="muted">FIGHTER PROFILE</div><h1>${flag(f)} ${f.name}</h1><div class="muted">${names[f.weight]} · №${f.rank||'—'}</div>${f.champion?'<div class="champ">🏆 ЧЕМПИОН</div>':''}<h2>${f.wins}-${f.losses}-${f.draws}</h2><div class="grid"><div class="stat"><b>${f.wins}</b><span>ПОБЕД</span></div><div class="stat"><b>${f.losses}</b><span>ПОРАЖЕНИЙ</span></div><div class="stat"><b>${f.draws}</b><span>НИЧЬИХ</span></div><div class="stat"><b>${st}</b><span>АКТИВНАЯ СЕРИЯ</span></div><div class="stat"><b>${f.titleWins}</b><span>РАЗ ВЫИГРЫВАЛ ПОЯС</span></div><div class="stat"><b>${f.titleDefenses}</b><span>ОБЩИЕ ЗАЩИТЫ</span></div><div class="stat"><b>${f.activeDefenses}</b><span>АКТИВНАЯ СЕРИЯ ЗАЩИТ</span></div></div><button class="primary" style="margin-top:12px" onclick="editFighter(${f.id})">✎ РЕДАКТИРОВАТЬ БОЙЦА</button><div class="section">ИСТОРИЯ БОЁВ</div><div class="list">${(f.history||[]).map(h=>`<div class="row"><div class="grow"><div class="${h.result==='W'?'historyWin':h.result==='L'?'historyLoss':'historyDraw'}">${h.result==='W'?'WIN':h.result==='L'?'LOSS':'DRAW'} ${h.method==='SUBMISSION'?'SUB':h.method==='KO/TKO'?'KO':'DEC'} ${h.round||''}</div><div class="meta">${h.date}</div></div></div>`).join('')||'<div class="muted">Пока нет боёв</div>'}</div>`;modal.classList.add('show')}
function editFighter(id){let f=F.find(x=>x.id===id);modalContent.innerHTML=`<h2>Редактировать бойца</h2><label>Имя</label><input id="en" value="${f.name}"><label>Страна</label><select id="ec">${Object.entries(FLAGS).map(([k,v])=>`<option value="${k}" ${f.country===k?'selected':''}>${v} ${k}</option>`).join('')}</select><label>Весовая</label><select id="ew">${W.slice(1).map(x=>`<option ${f.weight===x?'selected':''}>${x}</option>`).join('')}</select><label>Место в рейтинге</label><input id="er" type="number" value="${f.rank||15}"><div class="grid"><div><label>Победы</label><input id="ewin" type="number" value="${f.wins}"></div><div><label>Поражения</label><input id="elos" type="number" value="${f.losses}"></div><div><label>Ничьи</label><input id="edr" type="number" value="${f.draws}"></div><div><label>Активная серия</label><input id="est" type="number" value="${f.streak}"></div><div><label>Выигрывал пояс</label><input id="etw" type="number" value="${f.titleWins}"></div><div><label>Общие защиты</label><input id="etd" type="number" value="${f.titleDefenses}"></div><div><label>Активные защиты</label><input id="ead" type="number" value="${f.activeDefenses}"></div></div><label>Чемпион</label><select id="ech"><option value="0">Нет</option><option value="1" ${f.champion?'selected':''}>Да</option></select><button class="primary" onclick="saveEdit(${id})">СОХРАНИТЬ</button>`;modal.classList.add('show')}
function saveEdit(id){let f=F.find(x=>x.id===id);f.name=en.value.trim()||f.name;f.country=ec.value;f.weight=ew.value;f.rank=+er.value||15;f.wins=+ewin.value||0;f.losses=+elos.value||0;f.draws=+edr.value||0;f.streak=+est.value||0;f.titleWins=+etw.value||0;f.titleDefenses=+etd.value||0;f.activeDefenses=+ead.value||0;f.champion=ech.value==='1';save();closeModal()}function closeModal(){modal.classList.remove('show');render()}render();</script><script src="roster.js"></script></body></html>
