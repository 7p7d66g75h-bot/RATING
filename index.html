<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Road to UFC V8</title><style>*{box-sizing:border-box}body{margin:0;background:#08090c;color:#f4f4f4;font:15px system-ui,-apple-system,sans-serif}.top{height:62px;background:#0e1014;border-bottom:1px solid #292d35;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.logo{font-weight:950;letter-spacing:2px}.logo b{color:#e7353e}.layout{display:grid;grid-template-columns:210px 1fr;max-width:1400px;margin:auto}.side{padding:12px;border-right:1px solid #292d35;min-height:calc(100vh - 62px)}.nav{display:grid;gap:6px}.nav button{background:transparent;border:1px solid transparent;color:#999;padding:13px;border-radius:9px;text-align:left;cursor:pointer}.nav button:hover,.nav .on{background:#191b21;color:#fff;border-color:#343943}.main{padding:22px;max-width:1150px;width:100%;margin:auto}.hero{min-height:310px;padding:30px;border:1px solid #333842;border-radius:18px;background:linear-gradient(135deg,#1b1e25,#0b0d10);display:flex;justify-content:space-between;align-items:end;gap:15px}.ey{font-size:10px;letter-spacing:3px;color:#ef424b;font-weight:900}.title{font-size:38px;margin:6px 0}.muted{color:#9299a6}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.card{background:#111318;border:1px solid #2b2f38;border-radius:13px;padding:16px}.btn{background:#191c22;color:#fff;border:1px solid #3a3f49;border-radius:9px;padding:12px 16px;font-weight:850;cursor:pointer}.btn:hover{filter:brightness(1.15)}.red{background:#df3039;border-color:#df3039}.green{background:#287c53;border-color:#287c53}.gold{background:#b9924f;color:#111}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag,.badge{display:inline-block;border:1px solid #383d47;border-radius:999px;padding:5px 9px;font-size:11px;margin:2px}.badge{border-radius:5px;background:#242831}.money,.stat{font-size:28px;font-weight:900}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#89919d;font-size:10px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;background:#0b0d11;color:#fff;border:1px solid #30343d;border-radius:8px}.offer{background:#111318;border:1px solid #2b2f38;border-radius:13px;padding:16px}.offer.hot{border-color:#b73b43}.toast{position:fixed;right:15px;top:75px;width:min(390px,calc(100% - 30px));z-index:20;background:#171a20;border:1px solid #424752;border-left:4px solid #e7353e;border-radius:12px;padding:14px;box-shadow:0 15px 40px #0009}.fight{max-width:950px;margin:auto}.fight-head{display:grid;grid-template-columns:1fr 100px 1fr;gap:12px;align-items:center}.fighter{text-align:center}.avatar{width:76px;height:76px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#242832;border:1px solid #454b57;font-weight:950;font-size:22px}.clock{text-align:center;font-size:45px;font-weight:950}.round{text-align:center;color:#969daa}.hp{height:10px;background:#292d36;border-radius:8px;overflow:hidden;margin:7px 0}.hp i{display:block;height:100%;background:#df3039}.st i{background:#c29b57}.momentum{height:15px;background:#292d36;border-radius:9px;overflow:hidden}.momentum i{display:block;height:100%;background:#c49a52}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.choice{min-height:115px;text-align:left;padding:15px;background:#15181e;border:1px solid #333843;color:#fff;border-radius:12px;cursor:pointer}.choice:hover{border-color:#df3039;transform:translateY(-1px)}.choice h3{margin:0 0 6px}.safe{border-left:4px solid #4b8e68}.standard{border-left:4px solid #b28a4d}.risk{border-left:4px solid #c8444b}.fightlog{height:190px;overflow:auto;background:#08090c;border:1px solid #292d36;border-radius:10px;padding:13px;font:12px/1.7 monospace;margin-top:12px}.result{text-align:center;padding:30px;background:#111318;border:1px solid #333842;border-radius:14px}.big{font-size:42px;font-weight:950}.notice{padding:15px;background:#171a20;border:1px solid #343943;border-radius:11px}.mobile{display:none}@media(max-width:800px){.layout{display:block}.side{display:none}.main{padding:14px 12px 82px}.g2,.g3,.form{grid-template-columns:1fr}.hero{min-height:390px;padding:20px}.hero h1{font-size:37px}.fight-head{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:8;grid-template-columns:repeat(5,1fr);background:#0c0d11f5;border-top:1px solid #292d35;padding:6px}.mobile button{background:none;border:0;color:#999;font-size:10px;padding:5px}.mobile .on{color:#fff}.row .btn{width:auto}}
</style></head><body><div id="app"></div><script>
const ORGS=['UFC','PFL','ONE Championship','RIZIN','ACA','KSW','Cage Warriors','LFA','BRAVE CF','OKTAGON MMA','RCC','Fight Nights','MFP','Siberian Fight League','ACA Young Eagles','Open FC'];const WEIGHTS=['Flyweight','Bantamweight','Featherweight','Lightweight','Welterweight','Middleweight','Light Heavyweight','Heavyweight'];const STYLES=['Ударник','Борец','BJJ','Кикбоксер','Прессинг','Контрпанчер','Универсал'];const N=['Максим Орлов','Дмитрий Сафин','Илья Морозов','Роман Беляев','Тимур Абаев','Влад Ким','Марк Соколов','Денис Крылов','Иван Петров','Артур Магомедов','Никита Лебедев','Марат Абдуллин'];let S=JSON.parse(localStorage.getItem('mmaRoadV8')||'null')||{page:'home',fighter:null,offers:[],contract:null,opponents:[],fight:null,week:1,toast:null};function save(){localStorage.setItem('mmaRoadV8',JSON.stringify(S))}function go(p){S.page=p;S.toast=null;save();render()}function esc(x){return String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function money(n){return '$'+Math.round(n).toLocaleString()}function init(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2)}function nav(){return [['home','⌂','Главная'],['career','♟','Карьера'],['offers','✉','Предложения'],['match','⚔','Соперники'],['world','◉','Мир']].map(x=>`<button class="${S.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}function shell(c){return `${S.toast?`<div class="toast"><b>${esc(S.toast.t)}</b><p>${esc(S.toast.p)}</p><button class="btn red" onclick="S.toast=null;render()">Закрыть</button></div>`:''}<header class="top"><div class="logo">MMA <b>ROAD TO UFC V8</b></div><span class="muted">${S.fighter?esc(S.fighter.name)+' · '+S.fighter.record:'Новая карьера'}</span></header><div class="layout"><aside class="side"><div class="nav">${nav()}</div></aside><main class="main">${c}</main></div><nav class="mobile">${nav()}</nav>`}
function home(){if(!S.fighter)return `<div class="hero"><div><div class="ey">CAREER RPG · V8</div><h1>Пробейся в UFC.</h1><p class="muted">Карьера бойца с реальными организациями, предложениями на один бой и новой системой боёв: решай, когда рисковать.</p><button class="btn red" onclick="go('create')">Создать бойца</button></div></div>`;let f=S.fighter;return `<div class="hero"><div><div class="ey">${esc(f.league)} · ${esc(f.weight)}</div><h1>${esc(f.name)}</h1><p class="muted">${f.style} · ${f.record}</p><span class="tag">${money(f.money)}</span><span class="tag">${f.fans} FANS</span></div><button class="btn red" onclick="go('${S.fight?'fight':S.contract?'career':'offers'}')">${S.fight?'Вернуться в бой':S.contract?'Открыть контракт':'Предложения'}</button></div><div class="grid g3" style="margin-top:12px"><div class="card"><small class="muted">ЛИГА</small><div class="stat" style="font-size:20px">${esc(f.league)}</div></div><div class="card"><small class="muted">РЕКОРД</small><div class="stat">${f.record}</div></div><div class="card"><small class="muted">ПОПУЛЯРНОСТЬ</small><div class="stat">${f.fans}</div></div></div>`}
function create(){return `<div class="ey">NEW CAREER</div><h1 class="title">Создание бойца</h1><div class="card"><div class="form"><div class="field"><label>Имя и фамилия</label><input id="name" value="Александр Брюханов"></div><div class="field"><label>Возраст</label><input id="age" value="20" type="number"></div><div class="field"><label>Рост</label><input id="height" value="174" type="number"></div><div class="field"><label>Весовая</label><select id="weight">${WEIGHTS.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Стиль</label><select id="style">${STYLES.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Страна</label><input id="country" value="RUS"></div></div><button class="btn red" style="margin-top:14px" onclick="start()">Начать карьеру</button></div>`}function start(){S.fighter={name:document.getElementById('name').value||'Александр Брюханов',age:+document.getElementById('age').value||20,height:+document.getElementById('height').value||174,weight:document.getElementById('weight').value,style:document.getElementById('style').value,country:document.getElementById('country').value||'RUS',league:'Siberian Fight League',record:'0-0',wins:0,losses:0,money:1500,fans:5,health:100,stamina:100,history:[],stats:{striking:70,wrestling:65,ground:64,cardio:72,defense:66,power:67}};S.page='career';S.offers=[];save();generateOffers()}
function career(){if(!S.fighter)return create();let f=S.fighter;return `<div class="ey">CAREER HUB</div><h1 class="title">${esc(f.name)}</h1><p class="muted">${esc(f.league)} · ${esc(f.weight)} · ${f.record}</p><div class="grid g3"><div class="card"><small class="muted">ДЕНЬГИ</small><div class="stat">${money(f.money)}</div></div><div class="card"><small class="muted">РЕКОРД</small><div class="stat">${f.record}</div></div><div class="card"><small class="muted">СЛЕДУЮЩИЙ БОЙ</small><div>${S.contract?esc(S.contract.org)+' · '+esc(S.contract.opponent.name):'Нет контракта'}</div></div></div><div class="card" style="margin-top:12px"><h2>Карьера</h2><p class="muted">Победы открывают более крупные организации. Контракт — только на один бой.</p><div class="row"><button class="btn" onclick="go('offers')">📨 Предложения</button>${S.contract?`<button class="btn red" onclick="startCamp()">🏋️ Лагерь</button>`:''}</div></div>`}
function offer(org){let show=600+Math.floor(Math.random()*14)*250;return{org,name:N[Math.floor(Math.random()*N.length)],record:(1+Math.floor(Math.random()*13))+'-'+Math.floor(Math.random()*4),style:STYLES[Math.floor(Math.random()*STYLES.length)],show,win:show,rank:Math.random()<.55?0:1+Math.floor(Math.random()*15)}}function generateOffers(){let f=S.fighter,a=[offer(f.league),offer(f.league)];if(f.wins>=2)a.push(offer('RCC'));if(f.wins>=4)a.push(offer('ACA'));if(f.wins>=7)a.push(offer('Cage Warriors'));if(f.wins>=10)a.push(offer('UFC'));S.offers=a;S.page='offers';S.toast={t:'Новые предложения',p:`Матчмейкеры прислали ${a.length} вариантов.`};save();render()}
function offers(){if(!S.fighter)return create();if(!S.offers.length)return `<div class="card"><h2>Входящих предложений нет</h2><p class="muted">Нужны результаты, чтобы крупные лиги обратили внимание.</p><button class="btn red" onclick="generateOffers()">Проверить рынок</button></div>`;return `<div class="ey">INBOX · FIGHT OFFERS</div><h1 class="title">Предложения на бой</h1><p class="muted">Каждая карточка показывает, <b>какая лига предлагает бой</b>. Все сделки — ONE FIGHT.</p><div class="grid g2">${S.offers.map((o,i)=>`<div class="offer ${o.org==='UFC'?'hot':''}"><div class="row"><span class="badge">ПРЕДЛАГАЕТ: ${esc(o.org)}</span><span class="tag">ONE FIGHT</span></div><h2>${esc(o.name)}</h2><p class="muted">${o.record} · ${o.style} · ${o.rank?'#'+o.rank:'NR'}</p><div class="grid g2"><div><small class="muted">SHOW</small><div class="money">${money(o.show)}</div></div><div><small class="muted">WIN</small><div class="money">${money(o.win)}</div></div></div><div class="row" style="margin-top:12px"><button class="btn green" onclick="accept(${i})">Принять</button><button class="btn" onclick="talk(${i})">Переговоры</button><button class="btn" onclick="reject(${i})">Отказать</button></div></div>`).join('')}</div>`}
function accept(i){let o=S.offers[i];S.contract={org:o.org,opponent:o,show:o.show,win:o.win};S.offers=[];S.page='career';S.toast={t:'Контракт подписан',p:`${o.org} · один бой · ${o.name}`};save();render()}function reject(i){S.offers.splice(i,1);save();render()}function talk(i){let o=S.offers[i];let a=prompt('Твоя сумма SHOW (по умолчанию '+o.show+')',o.show);let b=prompt('Твой WIN BONUS (по умолчанию '+o.win+')',o.win);if(a===null||b===null)return;let show=Math.max(0,+a||0),win=Math.max(0,+b||0),ratio=(show+win)/(o.show+o.win);if(ratio>1.8){S.toast={t:'Отказ промоушена',p:`${o.org} посчитала условия слишком высокими.`};save();render();return}if(ratio>1.3){o.show=Math.round(o.show*1.15/50)*50;o.win=Math.round(o.win*1.2/50)*50;S.toast={t:'Встречное предложение',p:`${o.org}: ${money(o.show)} / ${money(o.win)}`};save();render();return}o.show=show;o.win=win;accept(i)}
function generateOpponents(){let f=S.fighter;S.opponents=Array.from({length:6},(_,i)=>{let org=f.league;if(f.wins>=2&&Math.random()<.4)org=['RCC','ACA','Cage Warriors','PFL'][Math.floor(Math.random()*4)];let score=62+Math.floor(Math.random()*30);return{name:N[Math.floor(Math.random()*N.length)],record:(1+Math.floor(Math.random()*14))+'-'+Math.floor(Math.random()*4),style:STYLES[Math.floor(Math.random()*STYLES.length)],org,score,purse:700+Math.floor(Math.random()*10)*200,risk:score<70?'LOW':score<82?'MEDIUM':'HIGH'}})}function match(){if(!S.fighter)return create();if(!S.opponents.length)generateOpponents();return `<div class="ey">MATCHMAKING</div><h1 class="title">Выбор соперника</h1><p class="muted">Лига указана прямо на карточке. Выбирай не только имя — смотри на риск и деньги.</p><div class="grid g2">${S.opponents.map((o,i)=>`<div class="offer"><div class="row"><span class="badge">ПРЕДЛАГАЕТ: ${esc(o.org)}</span><span class="tag">${o.risk}</span></div><h2>${esc(o.name)}</h2><p class="muted">${o.record} · ${o.style} · сила ${o.score}</p><p>Гонорар: <b>${money(o.purse)}</b></p><button class="btn red" onclick="selectOpp(${i})">Выбрать бой</button></div>`).join('')}</div>`}function selectOpp(i){let o=S.opponents[i];S.contract={org:o.org,opponent:o,show:o.purse,win:o.purse};S.opponents=[];S.page='career';S.toast={t:'Бой согласован',p:`${o.org} · ${o.name}`};save();render()}
function startCamp(){S.week=1;S.page='camp';save();render()}function camp(){if(!S.contract)return offers();return `<div class="ey">TRAINING CAMP</div><h1 class="title">Неделя ${S.week}/4</h1><p class="muted">${esc(S.contract.org)} · VS ${esc(S.contract.opponent.name)}</p><div class="grid g2">${[['striking','🥊 Ударка'],['wrestling','🤼 Борьба'],['ground','🥋 Партер'],['cardio','🫁 Кардио'],['defense','🛡 Защита'],['recovery','🛌 Восстановление']].map(x=>`<div class="card"><h2>${x[1]}</h2><button class="btn" onclick="train('${x[0]}')">Тренировать</button></div>`).join('')}</div>`}function train(x){let f=S.fighter;if(x==='recovery')f.health=Math.min(100,f.health+8);else if(f.stats[x]!=null)f.stats[x]=Math.min(100,f.stats[x]+2);S.week++;if(S.week>4){S.fight={round:1,time:300,you:100,opp:100,stamina:100,os:100,momentum:0,log:['FIGHT NIGHT · Раунд 1.','Соперник выходит на центр.']};S.page='fight'}save();render()}
function fight(){let q=S.fight,f=S.fighter,o=S.contract.opponent;if(!q)return career();if(q.finished)return `<div class="result"><div class="ey">RESULT</div><div class="big">${q.result}</div><p>${q.method}</p><button class="btn red" onclick="finishFight()">Завершить бой</button></div>`;return `<div class="fight"><div class="ey" style="text-align:center">${esc(S.contract.org)} · ${esc(f.weight)}</div><div class="clock">${Math.floor(q.time/60)}:${String(q.time%60).padStart(2,'0')}</div><div class="round">РАУНД ${q.round}/3</div><div class="fight-head"><div class="fighter"><div class="avatar">${init(f.name)}</div><h2>${esc(f.name)}</h2><b>${q.you}%</b><div class="hp"><i style="width:${q.you}%"></i></div><b>${q.stamina}%</b><div class="hp st"><i style="width:${q.stamina}%"></i></div></div><div style="text-align:center;font-size:24px;font-weight:900">VS</div><div class="fighter"><div class="avatar">${init(o.name)}</div><h2>${esc(o.name)}</h2><b>${q.opp}%</b><div class="hp"><i style="width:${q.opp}%"></i></div><b>${q.os}%</b><div class="hp st"><i style="width:${q.os}%"></i></div></div></div><div class="card" style="margin-top:13px"><div class="row"><b>MOMENTUM</b><b>${q.momentum}/100</b></div><div class="momentum"><i style="width:${q.momentum}%"></i></div><p class="muted">Не ищи «правильную кнопку». Выбирай уровень риска по ситуации. Усталый соперник = хороший момент для риска.</p><div class="choices"><button class="choice safe" onclick="act('safe')"><h3>🛡 БЕЗОПАСНО</h3><div>Малый риск · малый урон</div><small>Сохраняешь выносливость и позицию.</small></button><button class="choice standard" onclick="act('standard')"><h3>⚔️ СТАНДАРТНО</h3><div>Средний риск · средний урон</div><small>Основной рабочий вариант.</small></button><button class="choice risk" onclick="act('risk')"><h3>🔥 РИСКОВАННО</h3><div>Большой риск · большой урон</div><small>Может перевернуть бой или наказать тебя.</small></button></div></div><div class="fightlog">${q.log.slice(-12).join('<br>')}</div></div>`}
function act(type){let q=S.fight,f=S.fighter,o=S.contract.opponent,enemy=Math.max(52,o.score-10),r=Math.random(),my=0,ed=0,msg='';let tired=q.os<35;let strong=q.stamina>60;if(type==='safe'){my=Math.round((f.stats.defense+f.stats.striking)/24*(.7+r));ed=Math.round(enemy/20*r);q.stamina=Math.min(100,q.stamina+3);q.momentum=Math.max(0,q.momentum-2);msg='Спокойно пережил эпизод, почти не рискуя.'}if(type==='standard'){my=Math.round((f.stats.striking+f.stats.power+f.stats.defense)/25*(.8+r));ed=Math.round(enemy/18*r);q.stamina-=7;q.momentum+=(my>ed?5:-3);msg='Размен в стойке. Нормальный темп.'}if(type==='risk'){let bonus=tired?1.35:1;let success=(f.stats.striking/100*.35+f.stats.defense/100*.2+r*.55)>0.62;my=success?Math.round((f.stats.striking+f.stats.power)/10*(.8+r)*bonus):Math.round(f.stats.striking/28*r);ed=success?Math.round(enemy/22*r):Math.round(enemy/9*(.6+r));q.stamina-=14;q.momentum+=success?12:-15;msg=success?'🔥 Риск оправдан: тяжёлое попадание и давление.':'❌ Поторопился — соперник поймал тебя на ошибке.'}q.you=Math.max(0,q.you-ed);q.opp=Math.max(0,q.opp-my);q.stamina=Math.max(0,q.stamina);q.os=Math.max(0,q.os-(type==='safe'?2:5));q.momentum=Math.max(0,Math.min(100,q.momentum));q.log.push(`R${q.round} ${Math.floor(q.time/60)}:${String(q.time%60).padStart(2,'0')} · ${msg} Урон ${my}/${ed}.`);if(q.opp<=0||q.you<=0){q.finished=true;q.result=q.opp<=0?'ПОБЕДА':'ПОРАЖЕНИЕ';q.method=q.opp<=0?'KO/TKO':'KO/TKO'}else{q.time-=30;if(q.time<=0){if(q.round<3){q.round++;q.time=300;q.log.push('— Перерыв. Ты читаешь бой и выходишь на новый раунд. —')}else{q.finished=true;q.result=q.you>q.opp?'ПОБЕДА':'ПОРАЖЕНИЕ';q.method='Decision'}}}save();render()}
function finishFight(){let f=S.fighter,o=S.contract.opponent,q=S.fight,w=q.result==='ПОБЕДА';f.history.push({o:o.name,l:S.contract.org,w,m:q.method});if(w){f.wins++;f.money+=S.contract.show+S.contract.win;f.fans+=6;f.league=f.wins>=3&&f.league==='Siberian Fight League'?'RCC':f.league;f.league=f.wins>=6&&f.league==='RCC'?'ACA':f.league;f.league=f.wins>=9&&f.league==='ACA'?'Cage Warriors':f.league;f.league=f.wins>=12&&f.league==='Cage Warriors'?'UFC':f.league}else{f.losses++;f.money+=S.contract.show;f.fans=Math.max(1,f.fans-1)}f.record=f.wins+'-'+f.losses;S.contract=null;S.fight=null;S.week=1;generateOffers()}
function world(){return `<div class="ey">MMA WORLD</div><h1 class="title">Организации</h1><div class="grid g2">${ORGS.map((x,i)=>`<div class="card"><div class="row"><h2>${x}</h2><span class="tag">${i<10?'TOP':'REGIONAL'}</span></div><p class="muted">${i<10?'Рейтинги · P4P · титулы · большие контракты':'Региональная сцена · без рейтинга'}</p></div>`).join('')}</div>`}function render(){let p=S.page,c=p==='home'?home():p==='create'?create():p==='career'?career():p==='offers'?offers():p==='match'?match():p==='camp'?camp():p==='fight'?fight():world();document.getElementById('app').innerHTML=shell(c)}render();
</script></body></html>
