<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMA Road to UFC</title>
<style>
:root{--bg:#07080a;--panel:#101216;--panel2:#15171c;--line:#252932;--text:#f5f5f4;--muted:#8c929e;--red:#d71920;--red2:#ff3038;--gold:#c7a15a;--green:#49c77a;--blue:#628cff}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(900px 420px at 70% -10%,#20242c 0,#0b0c0f 55%,#07080a 100%)}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:#090a0cdd;backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}.logo{font-weight:950;letter-spacing:.09em;font-size:18px}.logo b{color:var(--red2)}.topRight{display:flex;gap:18px;align-items:center;color:var(--muted);font-size:13px}.money{color:#eee}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1500px;margin:auto}.side{min-height:calc(100vh - 72px);border-right:1px solid var(--line);padding:22px 14px;background:#090a0caa}.sideLabel{color:#555b67;font-size:10px;font-weight:800;letter-spacing:.16em;margin:14px 12px 8px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:#aeb4bf;text-align:left;padding:12px;border-radius:10px;transition:.15s}.nav button:hover,.nav button.on{background:var(--panel2);border-color:var(--line);color:#fff}.nav button.on{box-shadow:inset 3px 0 var(--red)}.main{padding:28px;min-width:0}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.18em;color:var(--red2);text-transform:uppercase}.title{font-size:34px;line-height:1.05;margin:7px 0 6px;font-weight:900}.sub{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:#181b21;color:#fff;border-radius:9px;padding:11px 16px;font-weight:800}.btn:hover{filter:brightness(1.15)}.btn.red{background:var(--red);border-color:var(--red)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#111}.btn.ghost{background:transparent}.btn.small{padding:8px 11px;font-size:12px}.hero{min-height:330px;border:1px solid var(--line);border-radius:18px;padding:34px;display:flex;align-items:flex-end;justify-content:space-between;overflow:hidden;position:relative;background:linear-gradient(120deg,#15171c 0%,#0d0f13 58%,#16100e 100%)}.hero:after{content:"UFC";position:absolute;right:-20px;bottom:-80px;font-size:250px;font-weight:1000;color:#ffffff04;line-height:1}.heroContent{position:relative;z-index:2;max-width:760px}.hero h1{font-size:52px;margin:8px 0 12px;letter-spacing:-.04em}.hero p{color:#b0b5be;max-width:650px;line-height:1.6}.heroActions{display:flex;gap:10px;position:relative;z-index:2}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.card{background:linear-gradient(145deg,#121419,#0e1014);border:1px solid var(--line);border-radius:14px;padding:18px}.card h3,.card h2{margin:0 0 7px}.num{font-size:28px;font-weight:950}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.section{margin-top:24px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}.sectionHead h2{margin:0;font-size:20px}.fighterHero{display:grid;grid-template-columns:100px 1fr auto;gap:18px;align-items:center}.avatar{width:92px;height:92px;border-radius:14px;background:linear-gradient(145deg,#333741,#15171c);border:1px solid #3a3e48;display:grid;place-items:center;font-size:27px;font-weight:950}.record{font-size:35px;font-weight:950}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:#c7cbd2;font-size:11px}.dashboard{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.event{background:linear-gradient(135deg,#171a20,#101216);border:1px solid var(--line);border-radius:14px;padding:22px}.eventTitle{font-size:12px;color:var(--muted);letter-spacing:.12em;font-weight:800}.versus{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:10px;margin:20px 0}.versus .person{text-align:center}.versus .person strong{display:block;font-size:18px}.vs{font-weight:950;color:var(--red2);font-size:22px;text-align:center}.miniAvatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:auto auto 8px;background:#242831;border:1px solid #3a3f49;font-weight:900}.statsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.bar{height:5px;background:#262a31;border-radius:8px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--red)}.list{display:grid;gap:8px}.listItem{padding:13px;border:1px solid var(--line);background:#101217;border-radius:10px}.leagueGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.league{display:flex;justify-content:space-between;align-items:center;padding:15px;border:1px solid var(--line);background:#101217;border-radius:11px}.league strong{display:block}.badge{font-size:10px;padding:5px 7px;border-radius:5px;background:#20242c;color:#c9ced7}.badge.major{background:#241315;color:#ff7075}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tabs button{white-space:nowrap;background:#111318;color:#9da3ae;border:1px solid var(--line);border-radius:8px;padding:9px 12px}.tabs button.on{background:#22252c;color:#fff;border-color:#484d58}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{font-size:10px;color:#707681;text-transform:uppercase;letter-spacing:.1em}.rank{font-weight:950;color:var(--gold)}.pos{font-weight:900}.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;color:#858b96;font-size:11px;font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:.07em}.field input,.field select{width:100%;background:#0c0e12;border:1px solid var(--line);border-radius:9px;color:#fff;padding:12px;outline:none}.field input:focus,.field select:focus{border-color:#5a5f69}.styleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.styleBtn{background:#0e1014;color:#c7cbd2;border:1px solid var(--line);border-radius:10px;text-align:left;padding:14px}.styleBtn strong{display:block;color:#fff;margin-bottom:4px}.styleBtn.on{border-color:var(--red);background:#1c1012}.step{display:flex;gap:8px;margin-bottom:18px}.step b{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--red);font-size:12px}.step div{flex:1}.notice{border:1px solid #4b3b20;background:#19150e;color:#d9c38e;padding:13px;border-radius:10px}.empty{text-align:center;padding:40px;color:var(--muted)}.fightScreen{max-width:1100px;margin:auto}.fightTop{text-align:center}.round{font-size:11px;color:var(--red2);font-weight:900;letter-spacing:.15em}.clock{font-size:50px;font-weight:950;margin:2px}.fightFaces{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;gap:15px;margin:25px 0}.face{text-align:center}.face .avatar{margin:auto}.hp{font-size:20px;font-weight:900;margin-top:9px}.hpbar{height:8px;background:#25282e;border-radius:9px;overflow:hidden;margin-top:6px}.hpbar i{display:block;height:100%;background:var(--red)}.fightActions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.fightActions button{padding:16px;background:#14171c;color:#fff;border:1px solid var(--line);border-radius:10px;font-weight:850}.fightLog{margin-top:14px;height:210px;overflow:auto;background:#090a0c;border:1px solid var(--line);border-radius:10px;padding:13px;font:12px/1.7 ui-monospace,monospace;color:#aeb4be}.mobileNav{display:none}.danger{color:#ff6269}.success{color:var(--green)}@media(max-width:900px){.layout{display:block}.side{display:none}.main{padding:15px 13px 90px}.top{height:62px;padding:0 15px}.topRight{font-size:11px}.hero{min-height:420px;padding:23px;align-items:flex-end}.hero h1{font-size:39px}.heroActions{flex-direction:column}.cards,.dashboard{grid-template-columns:1fr}.fighterHero{grid-template-columns:70px 1fr}.fighterHero>.btn{grid-column:1/-1}.avatar{width:68px;height:68px;font-size:20px}.styleGrid,.leagueGrid{grid-template-columns:1fr 1fr}.formGrid{grid-template-columns:1fr}.fightActions{grid-template-columns:1fr 1fr}.mobileNav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:#0b0c0eeF;border-top:1px solid var(--line);z-index:30;padding:7px env(safe-area-inset-right) calc(7px + env(safe-area-inset-bottom)) env(safe-area-inset-left);backdrop-filter:blur(18px)}.mobileNav button{background:transparent;border:0;color:#858b96;font-size:10px}.mobileNav button.on{color:#fff}.fightFaces{grid-template-columns:1fr 45px 1fr}.fightFaces .avatar{width:60px;height:60px}.clock{font-size:34px}.versus{grid-template-columns:1fr 40px 1fr}}
</style></head>
<body><div id="app"></div>
<script>
const KEY='mmaRoadV2';
const leagues=[
 ['UFC','UFC','🇺🇸','major'],['PFL','PFL','🇺🇸','major'],['ONE','ONE Championship','🇸🇬','major'],['RIZIN','RIZIN','🇯🇵','major'],['ACA','ACA','🇷🇺','major'],['KSW','KSW','🇵🇱','major'],['CAGE','Cage Warriors','🇬🇧','major'],['LFA','LFA','🇺🇸','major'],['BRAVE','BRAVE Combat Federation','🇧🇭','major'],['OKTAGON','OKTAGON MMA','🇨🇿','major'],['RCC','RCC','🇷🇺','regional'],['FNG','Fight Nights','🇷🇺','regional'],['MFP','MFP','🇷🇺','regional'],['SFL','Siberian Fight League','🇷🇺','regional'],['YE','ACA Young Eagles','🇷🇺','regional'],['OFC','Open FC','🇷🇺','regional']
];
const weights=[['FLY','Flyweight','56.7'],['BW','Bantamweight','61.2'],['FW','Featherweight','65.8'],['LW','Lightweight','70.3'],['WW','Welterweight','77.1'],['MW','Middleweight','83.9'],['LHW','Light Heavyweight','93'],['HW','Heavyweight','120.2']];
const styles=[['Striker','Ударник','Ударка, скорость, дистанция'],['Wrestler','Борец','Тейкдауны, контроль, клинч'],['Submission','Сабмишн-хантер','Партер и финиши'],['Kickboxer','Кикбоксер','Кики, колени, дальняя дистанция'],['Pressure','Прессинг-файтер','Темп, давление, объём'],['Counter','Контрпанчер','Тайминг, защита, контратаки'],['AllRounder','Универсал','Сбалансированный MMA']];
const names=['Максим Орлов','Дмитрий Сафин','Илья Морозов','Роман Беляев','Тимур Абаев','Владислав Ким','Алексей Волков','Марк Соколов'];
const state=JSON.parse(localStorage.getItem(KEY)||'null')||{page:'home',fighter:null,style:0,rankOrg:'UFC',rankWeight:'FW',fight:null,opponent:null,day:1,month:1,year:2026};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function go(p){state.page=p;save();render()}
function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function nav(){const items=[['home','⌂','Главная'],['career','◈','Карьера'],['world','◎','Мир'],['rankings','♛','Рейтинги'],['profile','●','Профиль']];return `<aside class="side"><div class="sideLabel">CAREER</div><div class="nav">${items.map(x=>`<button class="${state.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('')}</div><div class="sideLabel">WORLD</div><div class="nav"><button class="${state.page==='leagues'?'on':''}" onclick="go('leagues')">▣ &nbsp; Организации</button><button onclick="go('rankings')">⌁ &nbsp; P4P / Rankings</button></div><div class="sideLabel">GAME</div><div class="nav"><button onclick="newCareer()">＋ &nbsp; Новая карьера</button></div></aside>`}
function mobile(){return `<nav class="mobileNav">${[['home','⌂','Главная'],['career','◈','Карьера'],['world','◎','Мир'],['profile','●','Профиль']].map(x=>`<button class="${state.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}</nav>`}
function shell(c){let f=state.fighter;return `<div class="app"><header class="top"><div class="logo">MMA <b>ROAD TO UFC</b></div><div class="topRight">${f?`<span>${f.name} · ${f.record}</span><span class="money">$${f.money.toLocaleString()}</span>`:'Career Mode'}</div></header><div class="layout">${nav()}<main class="main">${c}</main></div>${mobile()}</div>`}
function home(){if(!state.fighter)return `<section class="hero"><div class="heroContent"><div class="eyebrow">MMA CAREER RPG</div><h1>Твоя дорога<br>в UFC начинается здесь.</h1><p>Создай бойца. Начни с региональной сцены. Строй рекорд, выбирай контракты, проходи тренировочные лагеря и пробивайся в крупнейшие организации мира.</p><div class="heroActions"><button class="btn red" onclick="go('create')">Создать бойца</button><button class="btn ghost" onclick="go('world')">Посмотреть мир MMA</button></div></div></section><div class="cards"><div class="card"><div class="eyebrow">10 MAJOR</div><div class="num">10</div><p class="muted">Реальные крупные организации с рейтингами и P4P.</p></div><div class="card"><div class="eyebrow">REGIONAL</div><div class="num">6</div><p class="muted">Региональные лиги без рейтингов. Только рекорд и титулы.</p></div><div class="card"><div class="eyebrow">GOAL</div><div class="num">UFC</div><p class="muted">Контракт нужно заслужить, а не нажать кнопку.</p></div></div>`;
let f=state.fighter;return `<div class="hero"><div class="heroContent"><div class="eyebrow">CAREER HUB · ${f.weightName.toUpperCase()}</div><h1>${f.name}</h1><p>${f.country} · ${f.age} лет · ${f.height} см · ${f.styleName}. Текущий статус: <b>${f.league}</b>.</p><div class="heroActions"><button class="btn red" onclick="go('career')">Продолжить карьеру</button><button class="btn ghost" onclick="go('profile')">Профиль бойца</button></div></div></div><div class="section dashboard"><div class="event"><div class="eventTitle">NEXT FIGHT</div><div class="versus"><div class="person"><div class="miniAvatar">${initials(f.name)}</div><strong>${f.name}</strong><span class="muted">${f.record}</span></div><div class="vs">VS</div><div class="person"><div class="miniAvatar">OP</div><strong>${state.opponent?state.opponent.name:'Соперник не выбран'}</strong><span class="muted">${state.opponent?state.opponent.record:'Подбирается'}</span></div></div><button class="btn red" onclick="go('career')">Открыть карьеру</button></div><div class="card"><div class="eyebrow">CAREER</div><div class="record">${f.record}</div><div class="muted">Победы — ${f.wins} · Поражения — ${f.losses}</div><div class="section"><div class="row"><span class="muted">Популярность</span><b>${f.popularity}</b></div><div class="bar"><i style="width:${f.popularity}%"></i></div></div></div></div>`}
function create(){return `<div class="eyebrow">CHARACTER CREATION</div><h1 class="title">Создание бойца</h1><p class="sub">Собери основу карьеры. Остальное придётся заслужить.</p><div class="section card"><div class="step"><b>1</b><div><strong>Личные данные</strong><div class="muted">Кто ты?</div></div></div><div class="formGrid"><div class="field"><label>Имя</label><input id="fn" placeholder="Александр"></div><div class="field"><label>Фамилия</label><input id="ln" placeholder="Брюханов"></div><div class="field"><label>Страна</label><input id="country" value="RUS"></div><div class="field"><label>Возраст</label><input id="age" type="number" value="20" min="18" max="35"></div><div class="field"><label>Рост, см</label><input id="height" type="number" value="174"></div><div class="field"><label>Вес вне лагеря, кг</label><input id="walk" type="number" value="70"></div></div></div><div class="section card"><div class="step"><b>2</b><div><strong>Весовая категория</strong><div class="muted">Выбери дивизион</div></div></div><div class="tabs" id="weightTabs">${weights.map((w,i)=>`<button class="${i===2?'on':''}" onclick="pickWeight(${i})">${w[1]} · ${w[2]} кг</button>`).join('')}</div><input type="hidden" id="weight" value="FW"></div><div class="section card"><div class="step"><b>3</b><div><strong>Стиль</strong><div class="muted">Архетип влияет на стартовые характеристики</div></div></div><div class="styleGrid">${styles.map((s,i)=>`<button class="styleBtn ${i===0?'on':''}" id="style${i}" onclick="pickStyle(${i})"><strong>${s[1]}</strong><span class="muted">${s[2]}</span></button>`).join('')}</div></div><div class="section" style="display:flex;justify-content:flex-end;gap:8px"><button class="btn ghost" onclick="go('home')">Отмена</button><button class="btn red" onclick="createFighter()">Начать карьеру →</button></div>`}
let selectedWeight=2,selectedStyle=0;
function pickWeight(i){selectedWeight=i;document.querySelectorAll('#weightTabs button').forEach((b,j)=>b.classList.toggle('on',j===i));document.getElementById('weight').value=weights[i][0]}
function pickStyle(i){selectedStyle=i;document.querySelectorAll('.styleBtn').forEach((b,j)=>b.classList.toggle('on',j===i))}
function baseStats(style){let a={boxing:66,kicks:66,power:65,speed:67,accuracy:66,defense:64,takedowns:64,tddef:64,clinch:63,ground:63,submission:62,cardio:69,strength:66,chin:70,iq:64,composure:68};let boost={Striker:['boxing',10],Wrestler:['takedowns',12],Submission:['submission',14],Kickboxer:['kicks',12],Pressure:['cardio',10],Counter:['defense',10],AllRounder:['iq',7]};let b=boost[style];a[b[0]]+=b[1];return a}
function createFighter(){let w=weights[selectedWeight],s=styles[selectedStyle],name=((document.getElementById('fn').value||'Александр')+' '+(document.getElementById('ln').value||'Брюханов')).trim();state.fighter={name,country:document.getElementById('country').value||'RUS',age:+document.getElementById('age').value||20,height:+document.getElementById('height').value||174,walk:+document.getElementById('walk').value||70,weight:w[0],weightName:w[1],limit:w[2],style:s[0],styleName:s[1],record:'0-0',wins:0,losses:0,money:1500,popularity:5,health:100,confidence:70,league:'SFL',stats:baseStats(s[0]),history:[]};state.opponent=makeOpponent();state.page='career';save();render()}
function makeOpponent(){let f=state.fighter;let w=f?f.weight:'FW';let i=Math.floor(Math.random()*names.length);return{name:names[i],record:(Math.floor(Math.random()*5)+1)+'-'+Math.floor(Math.random()*3),style:styles[Math.floor(Math.random()*styles.length)][1],weight:w}}
function career(){if(!state.fighter)return create();let f=state.fighter;if(!state.opponent)state.opponent=makeOpponent();return `<div class="eyebrow">CAREER · WEEK ${Math.ceil(state.day/7)}</div><h1 class="title">${f.name}</h1><p class="sub">${f.league} · ${f.weightName} · ${f.record}</p><div class="section dashboard"><div class="event"><div class="eventTitle">NEXT FIGHT · ${f.league}</div><div class="versus"><div class="person"><div class="miniAvatar">${initials(f.name)}</div><strong>${f.name}</strong><span class="muted">${f.record}</span></div><div class="vs">VS</div><div class="person"><div class="miniAvatar">OP</div><strong>${state.opponent.name}</strong><span class="muted">${state.opponent.record} · ${state.opponent.style}</span></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn red" onclick="startFight()">Fight Night</button><button class="btn" onclick="changeOpponent()">Другой соперник</button></div></div><div class="card"><div class="eyebrow">CAMP</div><h3>Тренировочный лагерь</h3><p class="muted">Подготовься к бою и развивай характеристики.</p><div class="statsGrid">${[['Кардио','cardio'],['Бокс','boxing'],['Борьба','takedowns'],['Защита','defense']].map(x=>`<div><div class="row"><span>${x[0]}</span><b>${f.stats[x[1]]}</b></div><div class="bar"><i style="width:${f.stats[x[1]]}%"></i></div></div>`).join('')}</div><div style="margin-top:15px"><button class="btn small" onclick="train('cardio')">Кардио +</button> <button class="btn small" onclick="train('boxing')">Бокс +</button> <button class="btn small" onclick="train('takedowns')">Борьба +</button></div></div></div><div class="section cards"><div class="card"><div class="eyebrow">BALANCE</div><div class="num">$${f.money.toLocaleString()}</div><span class="muted">Гонорары и расходы</span></div><div class="card"><div class="eyebrow">CONFIDENCE</div><div class="num">${f.confidence}</div><span class="muted">Психология</span></div><div class="card"><div class="eyebrow">HEALTH</div><div class="num">${f.health}%</div><span class="muted">Готовность</span></div></div><div class="section card"><div class="sectionHead"><h2>История боёв</h2><span class="muted">${f.history.length} боёв</span></div>${f.history.length?`<table class="table"><tr><th>#</th><th>Соперник</th><th>Лига</th><th>Результат</th><th>Метод</th></tr>${f.history.slice().reverse().map((x,i)=>`<tr><td>${f.history.length-i}</td><td><b>${x.opponent}</b></td><td>${x.league}</td><td class="${x.win?'success':'danger'}">${x.win?'W':'L'}</td><td>${x.method}</td></tr>`).join('')}</table>`:'<div class="empty">Первый профессиональный бой ещё впереди.</div>'}</div>`}
function train(k){let f=state.fighter;if(f.stats[k]<95)f.stats[k]+=2;f.health=Math.max(70,f.health-2);state.day++;save();render()}
function changeOpponent(){state.opponent=makeOpponent();save();render()}
function startFight(){state.fight={round:1,time:300,you:100,opp:100,stamina:100,oppStamina:100,log:['FIGHT NIGHT — бой начался.'],done:false};state.page='fight';save();render()}
function fight(){let q=state.fight,f=state.fighter,o=state.opponent;if(!q)return career();return `<div class="fightScreen"><div class="fightTop"><div class="round">ROUND ${q.round} / 3</div><div class="clock">${time(q.time)}</div><div class="muted">${f.weightName} · ${f.league}</div></div><div class="fightFaces"><div class="face"><div class="avatar">${initials(f.name)}</div><h2>${f.name}</h2><div class="hp">${q.you}%</div><div class="hpbar"><i style="width:${q.you}%"></i></div></div><div class="vs">VS</div><div class="face"><div class="avatar">OP</div><h2>${o.name}</h2><div class="hp">${q.opp}%</div><div class="hpbar"><i style="width:${q.opp}%"></i></div></div></div><div class="fightActions"><button onclick="action('boxing')">🥊 Комбинация</button><button onclick="action('kick')">🦵 Кики</button><button onclick="action('wrestle')">🤼 Тейкдаун</button><button onclick="action('grapple')">🥋 Партер</button><button onclick="action('defend')">🛡 Защита</button><button onclick="action('recover')">🫁 Восстановление</button></div><div class="fightLog">${q.log.slice(-12).join('<br>')}</div></div>`}
function time(t){return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function action(type){let q=state.fight,f=state.fighter,s=f.stats,r=Math.random(),d=0,od=0,msg='';if(type==='boxing'){d=Math.round((s.boxing+s.speed+s.power)/18*(.7+r));od=Math.round(7*r);msg=`Серия руками попала. Урон ${d}.`}if(type==='kick'){d=Math.round((s.kicks+s.power)/12*(.6+r));od=Math.round(6*r);msg=`Кик прошёл по корпусу/ноге. Урон ${d}.`}if(type==='wrestle'){if(r<s.takedowns/100){d=8;od=2;q.oppStamina=Math.max(0,q.oppStamina-14);msg='Тейкдаун! Контроль сверху.'}else{od=9;msg='Соперник защитил перевод.'}}if(type==='grapple'){d=Math.round((s.ground+s.submission)/18*(.7+r));od=3;msg=`Работа в партере. Урон ${d}.`}if(type==='defend'){od=Math.round(2+r*3);msg='Закрылся и пережил атаку.'}if(type==='recover'){q.stamina=Math.min(100,q.stamina+14);od=2;msg='Снизил темп и восстановил дыхание.'}q.opp=Math.max(0,q.opp-d);q.you=Math.max(0,q.you-od);q.stamina=Math.max(0,q.stamina-(type==='recover'?1:7));q.time-=30;q.log.push(`R${q.round} ${time(q.time+30)} — ${msg}`);if(q.opp<=0||q.you<=0){q.done=true;q.result=q.opp<=0?'ПОБЕДА — KO/TKO':'ПОРАЖЕНИЕ — KO/TKO'}else if(q.time<=0){if(q.round<3){q.round++;q.time=300;q.log.push('--- Начался следующий раунд ---')}else{q.done=true;q.result=q.you>q.opp?'ПОБЕДА — решение судей':'ПОРАЖЕНИЕ — решение судей'}}if(q.done){finishFight()}save();render()}
function finishFight(){let q=state.fight,f=state.fighter,o=state.opponent,win=q.opp<=0||(q.you>q.opp&&q.round===3),method=q.opp<=0?'KO/TKO':q.you>q.opp?'Decision':'Decision';if(f.history.some(x=>x.id===q.id))return;q.id=Date.now();f.history.push({id:q.id,opponent:o.name,league:f.league,win,method});if(win){f.wins++;f.money+=1400;f.popularity=Math.min(100,f.popularity+5);f.confidence=Math.min(100,f.confidence+5)}else{f.losses++;f.money+=500;f.popularity=Math.max(0,f.popularity-2);f.confidence=Math.max(0,f.confidence-7)}f.record=f.wins+'-'+f.losses;state.day+=7;if(f.wins===3&&f.league==='SFL'){f.league='RCC';f.money+=1500}if(f.wins===6&&f.league==='RCC')f.league='ACA';if(f.wins===9&&f.league==='ACA')f.league='CAGE';if(f.wins>=12&&f.league==='CAGE')f.league='UFC';state.fight=null;state.opponent=makeOpponent();state.page='career'}
function profile(){let f=state.fighter;if(!f)return create();return `<div class="fighterHero card"><div class="avatar">${initials(f.name)}</div><div><div class="eyebrow">FIGHTER PROFILE</div><h1 class="title">${f.name}</h1><p class="sub">${f.country} · ${f.age} лет · ${f.height} см · ${f.weightName} · ${f.styleName}</p><div class="tags" style="margin-top:10px"><span class="tag">${f.record}</span><span class="tag">${f.league}</span><span class="tag">$${f.money}</span></div></div><button class="btn ghost" onclick="go('career')">← Карьера</button></div><div class="section card"><div class="sectionHead"><h2>Характеристики</h2><span class="muted">1–100</span></div>${Object.entries(f.stats).map(([k,v])=>`<div style="margin:12px 0"><div class="row"><span>${statName(k)}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</div>`}
function statName(k){return ({boxing:'Бокс',kicks:'Кики',power:'Сила удара',speed:'Скорость',accuracy:'Точность',defense:'Защита',takedowns:'Тейкдауны',tddef:'Защита от тейкдаунов',clinch:'Клинч',ground:'Контроль в партере',submission:'Сабмишны',cardio:'Кардио',strength:'Физическая сила',chin:'Стойкость',iq:'Fight IQ',composure:'Хладнокровие'})[k]||k}
const prospectData=[['Islam Nurmagomedov','RUS','LW','14-0'],['Mateo Silva','BRA','FW','10-1'],['Joon Park','KOR','BW','9-0'],['Lukas Novak','CZE','WW','11-1'],['Owen Price','USA','LW','12-2'],['Hiro Tanaka','JPN','BW','9-1'],['Youssef Benali','MAR','FW','8-0'],['Artem Volkov','RUS','MW','10-0']];
function world(){return `<div class="eyebrow">MMA WORLD</div><h1 class="title">Мир MMA</h1><p class="sub">Организации, контракты и путь к UFC.</p><div class="section"><div class="sectionHead"><h2>Крупные организации</h2><span class="muted">рейтинги + P4P</span></div><div class="leagueGrid">${leagues.filter(x=>x[3]==='major').map(l=>`<div class="league"><div><strong>${l[2]} ${l[1]}</strong><span class="muted">${l[0]==='UFC'?'Главная цель карьеры':'Major organization'}</span></div><span class="badge major">TOP 15</span></div>`).join('')}</div></div><div class="section"><div class="sectionHead"><h2>Региональная сцена</h2><span class="muted">без рейтингов</span></div><div class="leagueGrid">${leagues.filter(x=>x[3]==='regional').map(l=>`<div class="league"><div><strong>${l[2]} ${l[1]}</strong><span class="muted">Рекорд · титулы · контракты</span></div><span class="badge">REGIONAL</span></div>`).join('')}</div></div>`}
function leaguesPage(){return world()}
function rankings(){return `<div class="row"><div><div class="eyebrow">RANKINGS</div><h1 class="title">Рейтинги</h1><p class="sub">Топ-15 дивизиона и мировой P4P.</p></div></div><div class="section card"><div class="tabs">${leagues.filter(x=>x[3]==='major').map(l=>`<button class="${state.rankOrg===l[0]?'on':''}" onclick="state.rankOrg='${l[0]}';save();render()">${l[1]}</button>`).join('')}</div><div class="tabs" style="margin-top:8px">${weights.map(w=>`<button class="${state.rankWeight===w[0]?'on':''}" onclick="state.rankWeight='${w[0]}';save();render()">${w[1]}</button>`).join('')}</div></div><div class="section dashboard"><div class="card"><div class="sectionHead"><h2>${state.rankOrg} · ${weights.find(w=>w[0]===state.rankWeight)[1]}</h2><span class="muted">TOP 15</span></div><table class="table"><tr><th>#</th><th>Боец</th><th>Страна</th><th>Рекорд</th></tr>${prospectData.concat(state.fighter&&state.fighter.weight===state.rankWeight?[[state.fighter.name,state.fighter.country,state.fighter.weight,state.fighter.record]]:[]).slice(0,15).map((x,i)=>`<tr><td class="rank">${i===0?'C':i}</td><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[3]}</td></tr>`).join('')}</table></div><div class="card"><div class="sectionHead"><h2>WORLD P4P</h2></div><table class="table">${prospectData.slice(0,8).map((x,i)=>`<tr><td class="rank">#${i+1}</td><td><b>${x[0]}</b><br><span class="muted">${x[2]} · ${x[3]}</span></td></tr>`).join('')}</table></div></div>`}
function render(){let c=state.page==='home'?home():state.page==='create'?create():state.page==='career'?career():state.page==='fight'?fight():state.page==='world'?world():state.page==='leagues'?leaguesPage():state.page==='rankings'?rankings():profile();document.getElementById('app').innerHTML=shell(c)}
function newCareer(){if(confirm('Удалить текущую карьеру?')){localStorage.removeItem(KEY);location.reload()}}
render();
</script></body></html>
