<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MMA: Road to UFC</title>
<style>
:root{--bg:#08090c;--panel:#111319;--panel2:#171a21;--line:#282d38;--text:#f4f5f7;--muted:#9299a8;--gold:#d7aa52;--red:#e64b4b;--green:#4fc27a;--blue:#5b8cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#242832 0,#0b0c10 38%,#07080b 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:68px;border-bottom:1px solid var(--line);background:#090a0de8;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--gold)}.top small{color:var(--muted)}.layout{display:flex;min-height:calc(100vh - 68px)}.side{width:230px;border-right:1px solid var(--line);padding:18px 12px;background:#0b0c10}.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:1px solid transparent;background:transparent;color:#aeb4c0;text-align:left;padding:12px 14px;border-radius:9px}.nav button:hover,.nav button.active{background:var(--panel2);color:#fff;border-color:var(--line)}.main{flex:1;padding:28px;max-width:1250px;margin:auto;width:100%}.hero{border:1px solid var(--line);background:linear-gradient(135deg,#151820,#0e1015);border-radius:16px;padding:28px;display:flex;justify-content:space-between;gap:20px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:38px;margin:8px 0}.hero p{color:var(--muted);max-width:700px}.btn{border:1px solid #3a404d;background:#e9ebef;color:#101216;border-radius:9px;padding:11px 16px;font-weight:800}.btn.gold{background:var(--gold);border-color:var(--gold)}.btn.dark{background:#171a21;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.card h3{margin:0 0 7px}.muted{color:var(--muted)}.stat{font-size:28px;font-weight:900}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:#c7ccd5;font-size:12px}.section{margin-top:24px}.section h2{font-size:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.rank{font-weight:900;color:var(--gold);width:50px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;background:#0c0e13;border:1px solid var(--line);color:#fff;padding:11px;border-radius:8px}.full{grid-column:1/-1}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice button{padding:14px;text-align:left;background:#0d0f14;color:#cbd0da;border:1px solid var(--line);border-radius:9px}.choice button.sel{border-color:var(--gold);background:#19150e;color:#fff}.meter{height:7px;background:#262a33;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--gold)}.fighter{display:flex;align-items:center;gap:14px}.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#333844,#15171d);display:grid;place-items:center;font-weight:900;border:1px solid #3a404d}.big-avatar{width:86px;height:86px;font-size:26px}.pill{font-size:11px;padding:4px 7px;border-radius:5px;background:#1d222c;color:#cbd1db}.success{color:var(--green)}.danger{color:var(--red)}.center{text-align:center}.fightbox{display:grid;grid-template-columns:1fr 80px 1fr;gap:14px;align-items:center}.vs{font-size:28px;font-weight:900;color:var(--gold);text-align:center}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.actions button{background:#181b23;color:#fff;border:1px solid var(--line);padding:12px;border-radius:8px}.log{height:220px;overflow:auto;background:#090a0d;border:1px solid var(--line);padding:12px;border-radius:9px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.6}.notice{padding:12px;border-left:3px solid var(--gold);background:#15130f;color:#d9dde5}.back{margin-bottom:14px}@media(max-width:850px){.side{width:70px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.main{padding:16px}.grid,.form,.choice{grid-template-columns:1fr}.hero{flex-direction:column}.fightbox{grid-template-columns:1fr}.vs{display:none}}
</style></head>
<body><div id="app"></div>
<script>
const leagues=[
{id:'UFC',name:'UFC',country:'USA',tier:1,ratings:true,p4p:true,color:'#e64b4b'},
{id:'PFL',name:'PFL',country:'USA',tier:1,ratings:true,p4p:true},
{id:'ONE',name:'ONE Championship',country:'Singapore',tier:1,ratings:true,p4p:true},
{id:'RIZIN',name:'RIZIN',country:'Japan',tier:1,ratings:true,p4p:true},
{id:'ACA',name:'ACA',country:'Russia',tier:1,ratings:true,p4p:true},
{id:'KSW',name:'KSW',country:'Poland',tier:1,ratings:true,p4p:true},
{id:'CAGE',name:'Cage Warriors',country:'UK',tier:1,ratings:true,p4p:true},
{id:'LFA',name:'LFA',country:'USA',tier:1,ratings:true,p4p:true},
{id:'BRAVE',name:'BRAVE CF',country:'Bahrain',tier:1,ratings:true,p4p:true},
{id:'OKTAGON',name:'OKTAGON MMA',country:'Czechia/Slovakia',tier:1,ratings:true,p4p:true},
{id:'RCC',name:'RCC',country:'Russia',tier:2,ratings:false},
{id:'FNG',name:'Fight Nights',country:'Russia',tier:2,ratings:false},
{id:'MFP',name:'MFP',country:'Russia',tier:2,ratings:false},
{id:'SFL',name:'Siberian Fight League',country:'Siberia',tier:2,ratings:false},
{id:'YE',name:'ACA Young Eagles',country:'Russia',tier:2,ratings:false},
{id:'OFC',name:'Open FC',country:'Russia',tier:2,ratings:false}
];
const weights=[['FLY','Flyweight','56.7'],['BW','Bantamweight','61.2'],['FW','Featherweight','65.8'],['LW','Lightweight','70.3'],['WW','Welterweight','77.1'],['MW','Middleweight','83.9'],['LHW','Light Heavyweight','93.0'],['HW','Heavyweight','120.2']];
const styles=[['Striker','Ударник','Сильная ударка, дистанция и темп'],['Wrestler','Борец','Тейкдауны, контроль и клинч'],['Submission Hunter','Сабмишн-хантер','Переходы и финиши в партере'],['Kickboxer','Кикбоксер','Кики, колени и работа на дальней'],['Pressure Fighter','Прессинг-файтер','Давление, объём и кардио'],['Counter Striker','Контрпанчер','Тайминг, защита и контратаки'],['All-Rounder','Универсал','Ровный MMA-баланс']];
const prospects=[['Daniil Karimov','RUS','FW',9,0,78],['Mateo Silva','BRA','LW',10,1,82],['Joon Park','KOR','BW',8,0,80],['Lukas Novak','CZE','WW',11,1,84],['Owen Price','USA','LW',12,2,86],['Artem Volkov','RUS','MW',10,0,83],['Hiro Tanaka','JPN','BW',9,1,81],['Youssef Benali','MAR','FW',8,0,79]];
let state=JSON.parse(localStorage.getItem('mmaRoad')||'null')||{page:'home',fighter:null,day:1,year:2026,offer:null,careerLog:[],fight:null};
function save(){localStorage.setItem('mmaRoad',JSON.stringify(state))}
function nav(){return `<aside class="side"><div class="nav">${[['home','⌂ Главная'],['career','♟ Карьера'],['world','◉ Мир'],['rankings','♛ Рейтинги'],['leagues','▣ Лиги']].map(([p,t])=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('')}</div></aside>`}
function shell(content){return `<div class="app"><header class="top"><div class="brand">MMA <span>ROAD TO UFC</span></div><small>${state.fighter?state.fighter.name+' · '+state.fighter.record:'Карьерный режим'} · ${state.year}</small></header><div class="layout">${nav()}<main class="main">${content}</main></div></div>`}
function go(p){state.page=p;save();render()}
function home(){return `<section class="hero"><div><div class="eyebrow">Career RPG</div><h1>Пробейся в UFC.</h1><p>Создай бойца, начни в региональной лиге и поднимайся через реальные MMA-промоушены. Рейтинги, P4P, контракты, лагерь и бои сохраняются в одном мире.</p></div><div>${state.fighter?`<button class="btn gold" onclick="go('career')">Продолжить карьеру</button>`:`<button class="btn gold" onclick="go('create')">Создать бойца</button>`}</div></section><div class="grid"><div class="card"><div class="muted">Главная цель</div><div class="stat">UFC</div><p class="muted">Не кнопка перехода. Контракт нужно заслужить.</p></div><div class="card"><div class="muted">Больших лиг</div><div class="stat">10</div><p class="muted">С дивизионными рейтингами и P4P.</p></div><div class="card"><div class="muted">Региональных</div><div class="stat">6</div><p class="muted">Без рейтингов. Только бои, рекорд и титулы.</p></div></div>${state.fighter?`<div class="section card"><div class="fighter"><div class="avatar big-avatar">${initials(state.fighter.name)}</div><div><div class="eyebrow">Текущий боец</div><h2>${state.fighter.name}</h2><div class="muted">${state.fighter.country} · ${state.fighter.weightName} · ${state.fighter.styleName}</div></div></div><div class="grid"><div><div class="muted">Рекорд</div><div class="stat">${state.fighter.record}</div></div><div><div class="muted">Организация</div><div class="stat">${state.fighter.league}</div></div><div><div class="muted">Популярность</div><div class="stat">${state.fighter.popularity}</div></div></div></div>`:''}`}
function create(){if(state.fighter)return `<div class="notice">Боец уже создан. Текущий прогресс хранится локально.</div>`;return `<div class="back"><button class="btn dark" onclick="go('home')">← Назад</button></div><div class="card"><div class="eyebrow">Character creation</div><h1>Создание бойца</h1><div class="form"><div class="field"><label>Имя</label><input id="fn" placeholder="Александр"></div><div class="field"><label>Фамилия</label><input id="ln" placeholder="Брюханов"></div><div class="field"><label>Страна</label><input id="ct" value="RUS"></div><div class="field"><label>Возраст</label><input id="age" type="number" value="20" min="18" max="35"></div><div class="field"><label>Рост, см</label><input id="height" type="number" value="174"></div><div class="field"><label>Вес вне лагеря, кг</label><input id="walk" type="number" value="70"></div><div class="field"><label>Весовая категория</label><select id="weight">${weights.map(w=>`<option value="${w[0]}">${w[1]} · ${w[2]} кг</option>`).join('')}</select></div><div class="field"><label>Стойка</label><select id="stance"><option>Orthodox</option><option>Southpaw</option><option>Switch</option></select></div><div class="full"><label class="muted">Стиль</label><div class="choice">${styles.map((s,i)=>`<button id="st${i}" onclick="pickStyle(${i})"><b>${s[1]}</b><br><small>${s[2]}</small></button>`).join('')}</div></div><div class="full"><button class="btn gold" onclick="createFighter()">Начать профессиональную карьеру</button></div></div></div>`}
let selectedStyle=0;function pickStyle(i){selectedStyle=i;document.querySelectorAll('.choice button').forEach((b,j)=>b.classList.toggle('sel',j===i))}
function createFighter(){let w=weights.find(x=>x[0]===document.getElementById('weight').value),s=styles[selectedStyle];let name=((document.getElementById('fn').value||'Александр')+' '+(document.getElementById('ln').value||'Брюханов')).trim();state.fighter={name,country:document.getElementById('ct').value||'RUS',age:+document.getElementById('age').value||20,height:+document.getElementById('height').value||174,walk:+document.getElementById('walk').value||70,weight:w[0],weightName:w[1],limit:w[2],stance:document.getElementById('stance').value,style:s[0],styleName:s[1],record:'0-0',wins:0,losses:0,popularity:5,money:1500,league:'Regional',rank:null,stats:baseStats(s[0]),confidence:70,health:100,career:[]};state.careerLog.push('Дебютный контракт: Siberian Fight League.');state.page='career';save();render()}
function baseStats(style){let a={boxing:68,kicks:68,power:66,speed:68,accuracy:67,defense:65,takedowns:65,tddef:65,clinch:64,ground:64,submission:64,cardio:70,strength:66,chin:70,iq:64,composure:68};let m={Striker:['boxing',10],Wrestler:['takedowns',12], 'Submission Hunter':['submission',14],Kickboxer:['kicks',12],'Pressure Fighter':['cardio',10], 'Counter Striker':['defense',10], 'All-Rounder':['iq',6]};let x=m[style];a[x[0]]+=x[1];return a}
function career(){if(!state.fighter)return create();let f=state.fighter;let fight=state.fight;return `<div class="row"><div><div class="eyebrow">My Career</div><h1>${f.name}</h1><div class="muted">${f.record} · ${f.weightName} · ${f.styleName}</div></div><button class="btn dark" onclick="resetGame()">Новая карьера</button></div><div class="grid"><div class="card"><div class="muted">Организация</div><div class="stat">${f.league}</div><p class="muted">${f.league==='Regional'?'Следующий шаг: региональный бой':'Рейтинговый путь продолжается'}</p></div><div class="card"><div class="muted">Баланс</div><div class="stat">$${f.money.toLocaleString()}</div></div><div class="card"><div class="muted">Здоровье</div><div class="stat">${f.health}%</div></div></div><div class="section card"><h2>Следующее событие</h2>${fight?fightCard():offerCard()}</div><div class="section card"><h2>Характеристики</h2>${Object.entries(f.stats).map(([k,v])=>`<div style="margin:9px 0"><div class="row"><span>${statName(k)}</span><b>${v}</b></div><div class="meter"><i style="width:${v}%"></i></div></div>`).join('')}</div><div class="section card"><h2>История</h2>${f.career.length?`<table class="table"><tr><th>День</th><th>Соперник</th><th>Результат</th><th>Метод</th></tr>${f.career.slice().reverse().map(x=>`<tr><td>${x.day}</td><td>${x.opponent}</td><td class="${x.win?'success':'danger'}">${x.win?'ПОБЕДА':'ПОРАЖЕНИЕ'}</td><td>${x.method}</td></tr>`).join('')}</table>`:'<div class="muted">Первый бой ещё впереди.</div>'}</div>`}
function offerCard(){let f=state.fighter;if(!state.offer)state.offer=makeOffer();let o=state.offer;return `<div class="fightbox"><div class="card"><div class="eyebrow">Ты</div><h2>${f.name}</h2><div>${f.record} · ${f.weightName}</div><div class="chips"><span class="chip">${f.styleName}</span><span class="chip">${f.height} см</span></div></div><div class="vs">VS</div><div class="card"><div class="eyebrow">Предложение</div><h2>${o.name}</h2><div>${o.record} · ${o.style}</div><div class="chips"><span class="chip">${o.league}</span><span class="chip">$${o.purse}</span></div></div></div><div style="margin-top:14px"><button class="btn gold" onclick="acceptOffer()">Принять бой</button> <button class="btn dark" onclick="state.offer=makeOffer(true);save();render()">Другой соперник</button></div>`}
function makeOffer(){let f=state.fighter;let names=['Максим Орлов','Дмитрий Сафин','Илья Морозов','Роман Беляев','Тимур Абаев','Владислав Ким'];let stylesO=['Wrestler','Striker','Kickboxer','Pressure Fighter','Submission Hunter'];let w=weights.find(x=>x[0]===f.weight);let wins=Math.floor(Math.random()*6)+1,loss=Math.floor(Math.random()*3);return{name:names[Math.floor(Math.random()*names.length)],record:wins+'-'+loss,style:stylesO[Math.floor(Math.random()*stylesO.length)],league:'Siberian Fight League',purse:700+Math.floor(Math.random()*4)*200}}
function acceptOffer(){state.fight={round:1,time:300,you:100,opp:100,stamina:100,oppStamina:100,log:['Бой начался. Три раунда по пять минут.'],finished:false};state.offer=null;save();render()}
function fightCard(){let q=state.fight;if(q.finished)return `<div class="notice">Бой завершён. ${q.result}</div><button class="btn gold" onclick="finishFight()">Забрать результат</button>`;return `<div class="fightbox"><div class="card center"><div class="avatar big-avatar" style="margin:auto">${initials(state.fighter.name)}</div><h2>${state.fighter.name}</h2><div>${q.you} HP · ${q.stamina} STA</div></div><div class="vs">R${q.round}</div><div class="card center"><div class="avatar big-avatar" style="margin:auto">OP</div><h2>${state.offer?.name||'Соперник'}</h2><div>${q.opp} HP · ${q.oppStamina} STA</div></div></div><div class="section actions"><button onclick="fightAction('strike')">🥊 Комбинация</button><button onclick="fightAction('kick')">🦵 Кики</button><button onclick="fightAction('wrestle')">🤼 Тейкдаун</button><button onclick="fightAction('grapple')">🥋 Партер</button><button onclick="fightAction('defend')">🛡 Защита</button><button onclick="fightAction('recover')">🫁 Восстановиться</button></div><div class="section log" id="fightlog">${q.log.slice(-10).join('<br>')}</div>`}
function fightAction(a){let q=state.fight,f=state.fighter;let s=f.stats;let roll=Math.random();let dmg=0,od=0,msg='';if(a==='strike'){dmg=Math.max(2,Math.round((s.boxing+s.speed+s.power)/12*(.7+roll*.6)));od=Math.max(1,Math.round((70+s.stats.defense)/18*roll));msg=`Ты попал серией руками: -${dmg} HP.`}else if(a==='kick'){dmg=Math.round((s.kicks+s.power)/9*(.6+roll*.7));od=Math.round(8*roll);msg=`Кик прошёл: -${dmg} HP.`}else if(a==='wrestle'){if(roll<(s.takedowns/100)){dmg=10+Math.round(s.strength/10);q.oppStamina-=8;msg='Тейкдаун! Ты забрал позицию.'}else{od=10;msg='Соперник защитил тейкдаун.'}}else if(a==='grapple'){dmg=Math.round((s.ground+s.submission)/14*(.5+roll));od=Math.round(7*roll);msg=`Работа в партере: -${dmg} HP.`}else if(a==='defend'){od=2;msg='Ты закрылся и почти не получил урона.'}else{f.health=Math.min(100,f.health+2);q.stamina=Math.min(100,q.stamina+10);msg='Ты сбросил темп и восстановил дыхание.'}q.opp=Math.max(0,q.opp-dmg);q.you=Math.max(0,q.you-od);q.stamina=Math.max(0,q.stamina-(a==='recover'?2:7+Math.floor(Math.random()*5)));q.oppStamina=Math.max(0,q.oppStamina-(a==='wrestle'?12:5));q.log.push(`R${q.round} ${formatTime(q.time)} — ${msg}`);if(q.opp<=0||q.you<=0){q.finished=true;q.result=q.opp<=0?'Ты победил KO/TKO.':'Ты проиграл KO/TKO.'}else{q.time-=30;if(q.time<=0){if(q.round<3){q.round++;q.time=300;q.log.push(`--- Раунд ${q.round} ---`)}else{q.finished=true;q.result=q.you>q.opp?'Ты победил решением.':'Ты проиграл решением.'}}}save();render()}
function finishFight(){let q=state.fight,f=state.fighter,win=q.opp<=0||(q.you>q.opp&&q.round>=3);let method=q.opp<=0?'KO/TKO':q.you>q.opp?'Decision':'KO/TKO';let opponent=state.offer?.name||'Региональный соперник';if(win){f.wins++;f.money+=1400;f.popularity=Math.min(100,f.popularity+6);f.confidence=Math.min(100,f.confidence+5)}else{f.losses++;f.money+=500;f.popularity=Math.max(0,f.popularity-2);f.confidence=Math.max(0,f.confidence-8)}f.record=f.wins+'-'+f.losses;f.career.push({day:state.day,opponent,win,method});state.fight=null;state.offer=null;state.day++;if(f.wins>=4&&f.league==='Regional'){f.league='RCC';f.money+=2500;state.careerLog.push('После четырёх побед тебе предложили контракт RCC.');}if(f.wins>=7&&f.league==='RCC'){f.league='ACA';state.careerLog.push('Ты получил предложение от ACA.');}save();render()}
function world(){return `<div class="eyebrow">World</div><h1>Мир MMA</h1><div class="grid">${leagues.map(l=>`<div class="card"><div class="row"><h3>${l.name}</h3><span class="pill">${l.tier===1?'MAJOR':'REGIONAL'}</span></div><div class="muted">${l.country}</div><p>${l.ratings?'Дивизионные рейтинги · P4P · титулы':'Без рейтингов · рекорд · титулы'}</p></div>`).join('')}</div>`}
function rankings(){let f=state.fighter;let rows=prospects.map((p,i)=>({name:p[0],country:p[1],weight:p[2],record:p[3]+'-'+p[4],score:p[5]}));if(f){rows.push({name:f.name,country:f.country,weight:f.weight,record:f.record,score:Math.round((f.stats.iq+f.stats.cardio+f.stats.boxing+f.stats.takedowns)/4)+f.wins*2});rows.sort((a,b)=>b.score-a.score)}return `<div class="row"><div><div class="eyebrow">Major rankings</div><h1>Рейтинги и P4P</h1></div><span class="pill">10 главных лиг</span></div><div class="grid"><div class="card full"><h2>UFC · Lightweight</h2><table class="table"><tr><th>#</th><th>Боец</th><th>Страна</th><th>Рекорд</th><th>Score</th></tr>${rows.slice(0,15).map((r,i)=>`<tr><td class="rank">${i+1}</td><td><b>${r.name}</b></td><td>${r.country}</td><td>${r.record}</td><td>${r.score}</td></tr>`).join('')}</table></div><div class="card full"><h2>World P4P</h2><table class="table">${rows.slice(0,10).map((r,i)=>`<tr><td class="rank">#${i+1}</td><td><b>${r.name}</b></td><td>${r.weight}</td><td>${r.record}</td></tr>`).join('')}</table></div></div>`}
function leaguesPage(){return `<div class="eyebrow">Organizations</div><h1>Лиги</h1><div class="section"><h2>10 главных</h2><div class="grid">${leagues.filter(x=>x.tier===1).map(l=>`<div class="card"><h3>${l.name}</h3><div class="muted">${l.country}</div><div class="chips" style="margin-top:10px"><span class="chip">Top 15</span><span class="chip">P4P</span><span class="chip">Title</span></div></div>`).join('')}</div></div><div class="section"><h2>Региональные · без рейтингов</h2><div class="grid">${leagues.filter(x=>x.tier===2).map(l=>`<div class="card"><h3>${l.name}</h3><div class="muted">${l.country}</div><p class="muted">Только бои, рекорд, контракты и титулы.</p></div>`).join('')}</div></div>`}
function statName(k){return ({boxing:'Бокс',kicks:'Кики',power:'Сила',speed:'Скорость',accuracy:'Точность',defense:'Защита',takedowns:'Тейкдауны',tddef:'Защита от тейкдаунов',clinch:'Клинч',ground:'Контроль в партере',submission:'Сабмишны',cardio:'Кардио',strength:'Сила тела',chin:'Стойкость',iq:'Fight IQ',composure:'Хладнокровие'})[k]||k}function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}function formatTime(t){return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}function resetGame(){if(confirm('Удалить карьеру и начать заново?')){localStorage.removeItem('mmaRoad');location.reload()}}
function render(){let c=state.page==='home'?home():state.page==='create'?create():state.page==='career'?career():state.page==='world'?world():state.page==='rankings'?rankings():leaguesPage();document.getElementById('app').innerHTML=shell(c);if(state.page==='create')pickStyle(selectedStyle)}render();
</script></body></html>
