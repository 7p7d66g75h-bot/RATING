<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MMA Road to UFC</title><style>
*{box-sizing:border-box}body{margin:0;background:#08090c;color:#f4f4f5;font:14px Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(900px 500px at 70% -10%,#252830,#08090c 55%)}header{height:64px;border-bottom:1px solid #272a32;background:#0b0c0eeF;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.logo{font-weight:950;letter-spacing:.08em}.logo b{color:#ef3940}.muted{color:#8e95a2}.layout{display:grid;grid-template-columns:220px 1fr;max-width:1450px;margin:auto}.side{border-right:1px solid #272a32;min-height:calc(100vh - 64px);padding:16px}.nav{display:grid;gap:6px}.nav button{padding:12px;border:1px solid transparent;background:transparent;color:#aeb3bd;text-align:left;border-radius:9px}.nav button.on,.nav button:hover{background:#16181e;border-color:#292d36;color:#fff}.nav button.on{box-shadow:inset 3px 0 #e52c34}.main{padding:24px;max-width:1200px;width:100%;margin:auto}.title{font-size:34px;font-weight:950;margin:5px 0}.eyebrow{font-size:10px;letter-spacing:.17em;font-weight:900;color:#ef4148;text-transform:uppercase}.grid{display:grid;gap:13px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#111318;border:1px solid #292d36;border-radius:14px;padding:17px}.hero{padding:30px;border:1px solid #30343d;border-radius:17px;background:linear-gradient(130deg,#181b22,#0e1014);min-height:280px;display:flex;justify-content:space-between;align-items:end;gap:20px}.hero h1{font-size:50px;line-height:1;margin:8px 0}.btn{border:1px solid #30343d;background:#191c22;color:#fff;padding:11px 15px;border-radius:9px;font-weight:800}.btn.red{background:#df252d;border-color:#df252d}.btn.gold{background:#c8a15c;color:#111;border-color:#c8a15c}.btn:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.stat{font-size:28px;font-weight:950}.tag{display:inline-block;border:1px solid #30343d;border-radius:99px;padding:5px 9px;margin:3px;color:#c9cdd5;font-size:11px}.timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.week{padding:12px 7px;border:1px solid #2b2f38;background:#0d0f13;border-radius:9px;text-align:center}.week.active{border-color:#df3038;background:#1b1012}.week.done{opacity:.5}.week b{display:block}.bar{height:7px;background:#282c34;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#df3038}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:11px;border-bottom:1px solid #282c34;text-align:left}.table th{color:#727985;font-size:10px;text-transform:uppercase}.rank{color:#c8a15c;font-weight:900}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice button{padding:14px;background:#0d0f13;color:#bfc4cc;border:1px solid #292d35;border-radius:10px;text-align:left}.choice button.on{border-color:#df3038;background:#1b1013;color:#fff}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;color:#818793;font-size:10px;text-transform:uppercase;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;background:#0b0d11;color:#fff;border:1px solid #292d35;border-radius:8px}.fight{max-width:950px;margin:auto}.faces{display:grid;grid-template-columns:1fr 70px 1fr;gap:12px;align-items:center}.face{text-align:center}.avatar{width:76px;height:76px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#292d35;font-size:22px;font-weight:900}.vs{text-align:center;font-size:25px;color:#ef4148;font-weight:950}.clock{text-align:center;font-size:45px;font-weight:950}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{padding:15px;background:#15181e;color:#fff;border:1px solid #2a2e37;border-radius:9px;font-weight:800}.log{height:190px;overflow:auto;background:#08090c;border:1px solid #292d35;padding:12px;border-radius:9px;font:12px/1.7 monospace}.mobile{display:none}@media(max-width:800px){.layout{display:block}.side{display:none}.main{padding:14px 12px 82px}.hero{min-height:390px;padding:22px;align-items:end}.hero h1{font-size:38px}.g3,.g2,.form{grid-template-columns:1fr}.timeline{grid-template-columns:repeat(4,1fr)}.choice{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:10;grid-template-columns:repeat(4,1fr);background:#0c0d10f5;border-top:1px solid #292d35;padding:7px}.mobile button{background:transparent;color:#9298a3;border:0;font-size:10px}.mobile button.on{color:#fff}}
</style></head><body><div id="app"></div><script>
const ORGS=[['UFC','🇺🇸','major'],['PFL','🇺🇸','major'],['ONE','🇸🇬','major'],['RIZIN','🇯🇵','major'],['ACA','🇷🇺','major'],['KSW','🇵🇱','major'],['Cage Warriors','🇬🇧','major'],['LFA','🇺🇸','major'],['BRAVE CF','🇧🇭','major'],['OKTAGON','🇨🇿','major'],['RCC','🇷🇺','regional'],['Fight Nights','🇷🇺','regional'],['MFP','🇷🇺','regional'],['Siberian Fight League','🇷🇺','regional'],['ACA Young Eagles','🇷🇺','regional'],['Open FC','🇷🇺','regional']];
const WEIGHTS=[['FLY','Flyweight',56.7],['BW','Bantamweight',61.2],['FW','Featherweight',65.8],['LW','Lightweight',70.3],['WW','Welterweight',77.1],['MW','Middleweight',83.9],['LHW','Light Heavyweight',93],['HW','Heavyweight',120.2]];
const STYLES=[['Striker','Ударник'],['Wrestler','Борец'],['Submission','Сабмишн-хантер'],['Kickboxer','Кикбоксер'],['Pressure','Прессинг-файтер'],['Counter','Контрпанчер'],['AllRounder','Универсал']];
const OPP=['Максим Орлов','Дмитрий Сафин','Илья Морозов','Роман Беляев','Тимур Абаев','Владислав Ким','Алексей Волков','Марк Соколов','Денис Крылов','Иван Петров'];
let S=JSON.parse(localStorage.getItem('mmaRoadV3')||'null')||{page:'home',style:0,week:1,month:1,year:2026,camp:{boxing:0,wrestling:0,cardio:0,recovery:0},fighter:null,offer:null,fight:null,log:[]};function save(){localStorage.setItem('mmaRoadV3',JSON.stringify(S))}function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2)}function nav(){return [['home','⌂','Главная'],['career','♟','Карьера'],['camp','⚡','Лагерь'],['world','◉','Мир'],['rank','♛','Рейтинги'],['profile','●','Профиль']].map(x=>`<button class="${S.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}function go(p){S.page=p;save();render()}function shell(c){return `<div class="app"><header><div class="logo">MMA <b>ROAD TO UFC</b></div><div class="muted">${S.fighter?S.fighter.name+' · '+S.fighter.record:''}</div></header><div class="layout"><aside class="side"><div class="nav">${nav()}</div></aside><main class="main">${c}</main></div><nav class="mobile">${nav()}</nav></div>`}
function home(){if(!S.fighter)return `<div class="hero"><div><div class="eyebrow">MMA CAREER RPG</div><h1>Пробейся в UFC.</h1><p class="muted">Создай бойца, начни с регионального уровня и построй карьеру через реальные MMA-организации.</p><button class="btn red" onclick="go('create')">Создать бойца</button></div></div><div class="grid g3" style="margin-top:14px"><div class="card"><div class="muted">Главные лиги</div><div class="stat">10</div></div><div class="card"><div class="muted">Региональные</div><div class="stat">6</div></div><div class="card"><div class="muted">Цель</div><div class="stat">UFC</div></div></div>`;let f=S.fighter;return `<div class="hero"><div><div class="eyebrow">CAREER DAY ${S.week}</div><h1>${f.name}</h1><p class="muted">${f.weightName} · ${f.styleName} · ${f.league}</p><div class="tag">${f.record}</div><div class="tag">$${f.money}</div><div class="tag">Popularity ${f.popularity}</div></div><button class="btn red" onclick="go('career')">Продолжить карьеру</button></div><div class="grid g3" style="margin-top:14px"><div class="card"><div class="muted">Следующее</div><h2>${S.offer?S.offer.name:'Тренировочная неделя'}</h2><p class="muted">${S.offer?'Бой уже предложен':'Подготовь лагерь и двигайся дальше'}</p></div><div class="card"><div class="muted">Здоровье</div><div class="stat">${f.health}%</div></div><div class="card"><div class="muted">Рекорд</div><div class="stat">${f.record}</div></div></div>`}
function create(){return `<div class="eyebrow">01 · CHARACTER</div><h1 class="title">Создание бойца</h1><div class="card"><div class="form"><div class="field"><label>Имя</label><input id="fn" placeholder="Александр"></div><div class="field"><label>Фамилия</label><input id="ln" placeholder="Брюханов"></div><div class="field"><label>Страна</label><input id="ct" value="RUS"></div><div class="field"><label>Возраст</label><input id="age" value="20" type="number"></div><div class="field"><label>Рост</label><input id="ht" value="174" type="number"></div><div class="field"><label>Вес вне лагеря</label><input id="walk" value="70" type="number"></div><div class="field"><label>Весовая</label><select id="wt">${WEIGHTS.map(w=>`<option value="${w[0]}">${w[1]} · ${w[2]} кг</option>`).join('')}</select></div><div class="field"><label>Стойка</label><select id="stance"><option>Orthodox</option><option>Southpaw</option><option>Switch</option></select></div></div><h3>Стиль</h3><div class="choice">${STYLES.map((x,i)=>`<button class="${S.style===i?'on':''}" onclick="S.style=${i};render()"><b>${x[1]}</b><br><small>${styleDesc(x[0])}</small></button>`).join('')}</div><br><button class="btn red" onclick="createF()">Начать карьеру</button></div>`}
function styleDesc(x){return {Striker:'Ударка и дистанция',Wrestler:'Тейкдауны и контроль',Submission:'Партер и сабмишны',Kickboxer:'Кики и колени',Pressure:'Темп и давление',Counter:'Тайминг и контратаки',AllRounder:'Баланс MMA'}[x]}
function createF(){let w=WEIGHTS.find(x=>x[0]===document.getElementById('wt').value),st=STYLES[S.style];S.fighter={name:(document.getElementById('fn').value||'Александр')+' '+(document.getElementById('ln').value||'Брюханов'),country:document.getElementById('ct').value,age:+document.getElementById('age').value,height:+document.getElementById('ht').value,walk:+document.getElementById('walk').value,weight:w[0],weightName:w[1],limit:w[2],stance:document.getElementById('stance').value,style:st[0],styleName:st[1],league:'Regional',record:'0-0',wins:0,losses:0,money:1500,popularity:5,health:100,confidence:70,stats:{boxing:68,kicks:68,power:66,speed:68,defense:65,wrestling:65,ground:64,submission:64,cardio:70,strength:66,chin:70,iq:64},history:[]};S.page='career';S.log.push('Профессиональная карьера началась в региональном MMA.');save();render()}
function career(){if(!S.fighter)return create();let f=S.fighter;return `<div class="row"><div><div class="eyebrow">CAREER</div><h1 class="title">${f.name}</h1><p class="muted">${f.league} · ${f.weightName} · ${f.styleName}</p></div><button class="btn" onclick="advance()">Следующая неделя →</button></div><div class="card" style="margin-top:15px"><div class="row"><b>2026 · Неделя ${S.week}</b><span class="muted">${S.offer?'FIGHT WEEK':'TRAINING'}</span></div><div class="timeline" style="margin-top:12px">${Array.from({length:8},(_,i)=>`<div class="week ${i+1===S.week?'active':''} ${i+1<S.week?'done':''}"><b>${i+1}</b><small class="muted">${i===7?'FIGHT':'CAMP'}</small></div>`).join('')}</div></div><div class="grid g3" style="margin-top:15px"><div class="card"><div class="muted">Рекорд</div><div class="stat">${f.record}</div></div><div class="card"><div class="muted">Баланс</div><div class="stat">$${f.money}</div></div><div class="card"><div class="muted">Здоровье</div><div class="stat">${f.health}%</div></div></div>${S.offer?offer():`<div class="card" style="margin-top:15px"><div class="eyebrow">NEXT OBJECTIVE</div><h2>Подготовить следующий бой</h2><p class="muted">Тренировочный лагерь готов. Улучшай навыки и используй недели с умом.</p><button class="btn red" onclick="go('camp')">Открыть лагерь</button></div>`}<div class="card" style="margin-top:15px"><h2>История боёв</h2>${f.history.length?`<table class="table"><tr><th>Соперник</th><th>Результат</th><th>Метод</th></tr>${f.history.slice().reverse().map(x=>`<tr><td>${x.o}</td><td class="${x.w?'success':'danger'}">${x.w?'ПОБЕДА':'ПОРАЖЕНИЕ'}</td><td>${x.m}</td></tr>`).join('')}</table>`:'<p class="muted">Профессиональный дебют ещё впереди.</p>'}</div>`}
function offer(){let o=S.offer;return `<div class="card" style="margin-top:15px"><div class="eyebrow">FIGHT CONTRACT</div><h2>${o.org}</h2><div class="grid g2"><div><div class="muted">Твой соперник</div><h2>${o.name}</h2><p>${o.record} · ${o.style}</p></div><div><div class="muted">Гонорар</div><div class="stat">$${o.purse}</div><p class="muted">Победа приносит дополнительную репутацию.</p></div></div><button class="btn red" onclick="startFight()">Принять бой</button></div>`}
function camp(){if(!S.fighter)return create();let f=S.fighter;return `<div class="eyebrow">TRAINING CAMP</div><h1 class="title">Тренировочный лагерь</h1><p class="muted">Неделя ${S.week}. Нельзя прокачать всё сразу. Человеческое тело, этот ужасно ограниченный биологический аппарат.</p><div class="grid g2"><div class="card"><h2>Ударка</h2><p class="muted">Бокс + кики</p><button class="btn" onclick="train('boxing')">Тренировать</button></div><div class="card"><h2>Борьба</h2><p class="muted">Тейкдауны + клинч</p><button class="btn" onclick="train('wrestling')">Тренировать</button></div><div class="card"><h2>Кардио</h2><p class="muted">Выносливость</p><button class="btn" onclick="train('cardio')">Тренировать</button></div><div class="card"><h2>Восстановление</h2><p class="muted">Здоровье + восстановление</p><button class="btn gold" onclick="train('recovery')">Восстановиться</button></div></div><div class="card" style="margin-top:14px"><h2>Прогресс</h2>${Object.entries(S.camp).map(x=>`<p>${x[0]} <b>${x[1]}</b></p><div class="bar"><i style="width:${Math.min(100,x[1]*10)}%"></i></div>`).join('')}</div>`}
function train(t){let f=S.fighter;if(t==='boxing'){f.stats.boxing=Math.min(100,f.stats.boxing+2);f.stats.kicks=Math.min(100,f.stats.kicks+1)}if(t==='wrestling'){f.stats.wrestling=Math.min(100,f.stats.wrestling+2);f.stats.ground=Math.min(100,f.stats.ground+1)}if(t==='cardio')f.stats.cardio=Math.min(100,f.stats.cardio+2);if(t==='recovery')f.health=Math.min(100,f.health+7);S.camp[t]++;f.health=Math.max(45,f.health-(t==='recovery'?0:4));save();render()}
function advance(){S.week++;if(S.week>8){S.week=1;S.month++;if(S.month>12){S.month=1;S.year++}}if(!S.offer&&S.week===8){S.offer=makeOffer()}if(!S.offer&&S.week%2===0)S.offer=makeOffer();save();render()}
function makeOffer(){let f=S.fighter;let n=OPP[Math.floor(Math.random()*OPP.length)];let org=f.league==='Regional'?'Siberian Fight League':f.league;return{name:n,record:(2+Math.floor(Math.random()*7))+'-'+Math.floor(Math.random()*3),style:STYLES[Math.floor(Math.random()*STYLES.length)][1],org,purse:700+Math.floor(Math.random()*5)*250}}
function startFight(){S.opponent=S.offer;S.fight={round:1,time:300,you:100,opp:100,stamina:100,os:100,log:['Раунд 1. Бой начался.']};S.page='fight';save();render()}
function fight(){if(!S.fight)return career();let q=S.fight,f=S.fighter;return `<div class="fight"><div class="eyebrow" style="text-align:center">FIGHT NIGHT · ${S.opponent.org}</div><div class="clock">${fmt(q.time)}</div><div style="text-align:center" class="muted">ROUND ${q.round}</div><div class="faces"><div class="face"><div class="avatar">${initials(f.name)}</div><h2>${f.name}</h2><div>${q.you}% HP · ${q.stamina}% STA</div></div><div class="vs">VS</div><div class="face"><div class="avatar">OP</div><h2>${S.opponent.name}</h2><div>${q.opp}% HP · ${q.os}% STA</div></div></div><div class="actions"><button onclick="act('box')">🥊 Руки</button><button onclick="act('kick')">🦵 Кики</button><button onclick="act('wrestle')">🤼 Тейкдаун</button><button onclick="act('ground')">🥋 Партер</button><button onclick="act('def')">🛡 Защита</button><button onclick="act('recover')">🫁 Восстановление</button></div><div class="log" style="margin-top:12px">${q.log.slice(-12).join('<br>')}</div></div>`}
function act(a){let q=S.fight,f=S.fighter,r=Math.random(),d=0,od=0,msg='';if(a==='box'){d=Math.round((f.stats.boxing+f.stats.speed+f.stats.power)/12*(.6+r));od=4+Math.floor(r*8);msg='Комбинация руками.'}if(a==='kick'){d=Math.round((f.stats.kicks+f.stats.power)/10*(.5+r));od=3;msg='Кик по корпусу/ноге.'}if(a==='wrestle'){if(r<f.stats.wrestling/100){d=12;msg='Тейкдаун удался.'}else{od=8;msg='Соперник защитился.'}}if(a==='ground'){d=Math.round((f.stats.ground+f.stats.submission)/14*(.5+r));od=4;msg='Работа в партере.'}if(a==='def'){od=1;msg='Закрылся и переждал атаку.'}if(a==='recover'){q.stamina=Math.min(100,q.stamina+12);od=2;msg='Восстановил дыхание.'}q.opp=Math.max(0,q.opp-d);q.you=Math.max(0,q.you-od);q.stamina=Math.max(0,q.stamina-(a==='recover'?1:7));q.os=Math.max(0,q.os-5);q.log.push(`R${q.round} ${fmt(q.time)} · ${msg} ${d?'Урон '+d+'.':''}`);if(q.opp<=0||q.you<=0){finish(q.opp<=0);return}q.time-=30;if(q.time<=0){if(q.round<3){q.round++;q.time=300;q.log.push('--- Начался новый раунд ---')}else{finish(q.you>q.opp)}}save();render()}
function finish(win){let f=S.fighter,o=S.opponent;f.history.push({o:o.name,w:win,m:win&&S.fight.opp<=0?'KO/TKO':'Decision'});if(win){f.wins++;f.money+=o.purse;f.popularity=Math.min(100,f.popularity+6);f.confidence=Math.min(100,f.confidence+4)}else{f.losses++;f.money+=Math.round(o.purse*.5);f.confidence=Math.max(0,f.confidence-8)}f.record=f.wins+'-'+f.losses;f.health=Math.max(50,f.health-(win?8:18));if(f.league==='Regional'&&f.wins>=3)f.league='RCC';else if(f.league==='RCC'&&f.wins>=6)f.league='ACA';else if(f.league==='ACA'&&f.wins>=9)f.league='Cage Warriors';else if(f.league==='Cage Warriors'&&f.wins>=12)f.league='UFC';S.fight=null;S.offer=null;S.page='career';save();render()}
function world(){return `<div class="eyebrow">MMA WORLD</div><h1 class="title">Организации</h1><div class="grid g2">${ORGS.map(o=>`<div class="card"><div class="row"><div><h2>${o[2]} ${o[0]}</h2><div class="muted">${o[1]==='major'?'Top 15 · P4P · титулы':'Региональный уровень · без рейтинга'}</div></div><span class="tag">${o[1].toUpperCase()}</span></div></div>`).join('')}</div>`}
function rank(){let base=['Александр Волкановски','Илия Топурия','Арман Царукян','Ислам Махачев','Шон О’Мэлли','Дрикус Дю Плесси','Алекс Перейра','Том Аспиналл','Макс Холлоуэй','Чарльз Оливейра','Пётр Ян','Александр Волков','Мовсар Евлоев','Пэдди Пимблетт','Мераб Двалишвили'];if(S.fighter&&S.fighter.wins>=5)base[14]=S.fighter.name;return `<div class="eyebrow">RANKINGS</div><h1 class="title">Мировые рейтинги</h1><div class="card"><div class="row"><h2>${S.rankOrg||'UFC'}</h2><select onchange="S.rankWeight=this.value;save();render()">${WEIGHTS.map(w=>`<option ${S.rankWeight===w[0]?'selected':''} value="${w[0]}">${w[1]}</option>`).join('')}</select></div><table class="table">${base.map((n,i)=>`<tr><td class="rank">${i?'#'+i:'C'}</td><td><b>${n}</b></td><td>${i<3?'Elite':'Ranked'}</td></tr>`).join('')}</table></div><div class="card" style="margin-top:14px"><h2>🌎 P4P</h2>${base.slice(0,10).map((n,i)=>`<p><b class="rank">#${i+1}</b> ${n}</p>`).join('')}</div>`}
function profile(){if(!S.fighter)return create();let f=S.fighter;return `<div class="eyebrow">FIGHTER PROFILE</div><h1 class="title">${f.name}</h1><div class="grid g2"><div class="card"><div class="avatar">${initials(f.name)}</div><h2>${f.name}</h2><p class="muted">${f.country} · ${f.age} лет · ${f.height} см</p><p>${f.weightName} · ${f.stance}</p><div class="stat">${f.record}</div></div><div class="card"><h2>Статистика</h2>${Object.entries(f.stats).map(x=>`<p>${x[0]} <b>${x[1]}</b></p><div class="bar"><i style="width:${x[1]}%"></i></div>`).join('')}</div></div>`}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function render(){let c=S.page==='home'?home():S.page==='create'?create():S.page==='career'?career():S.page==='camp'?camp():S.page==='fight'?fight():S.page==='world'?world():S.page==='rank'?rank():profile();document.getElementById('app').innerHTML=shell(c)}render();
</script></body></html>
