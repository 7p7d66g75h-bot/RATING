<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UFC 6 Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0b;color:#eee;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:700px;margin:auto;padding-bottom:90px}header{padding:20px 16px;border-bottom:1px solid #292c30;position:sticky;top:0;background:#090a0bee;backdrop-filter:blur(12px);z-index:2}.brand{font-size:10px;letter-spacing:2px;color:#888}.title{font-size:27px;font-weight:900;margin-top:3px}.nav{display:flex;gap:6px;padding:10px 12px;overflow:auto}.nav button,.bottom button{background:#17191b;color:#aaa;border:1px solid #292c30;border-radius:10px;padding:9px 12px;white-space:nowrap}.nav .on,.bottom .on{background:#eee;color:#090a0b}.main{padding:10px 12px}.card,.row{background:#121416;border:1px solid #292c30;border-radius:13px}.card{padding:15px;margin-bottom:10px}.hero{font-size:34px;font-weight:900}.muted{font-size:11px;color:#858a90}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stat{background:#181a1d;border:1px solid #292c30;border-radius:10px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:#858a90}.list{display:grid;gap:7px}.row{display:flex;align-items:center;padding:11px;gap:10px}.rank{width:30px;text-align:center;font-size:20px;font-weight:900}.avatar{width:44px;height:44px;border-radius:50%;background:#303338;display:grid;place-items:center;font-weight:900}.grow{flex:1}.name{font-weight:800}.meta{font-size:10px;color:#858a90;margin-top:3px}.badge{font-size:9px;background:#202327;padding:5px 7px;border-radius:6px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0c0dee;border-top:1px solid #292c30;padding:9px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.bottom button{border:0;background:transparent;font-size:10px}.bottom span{display:block;font-size:17px;margin-bottom:2px}input,select{width:100%;padding:12px;background:#0e1012;color:#eee;border:1px solid #292c30;border-radius:9px;margin:5px 0 10px}label{font-size:10px;color:#888}.primary{width:100%;padding:12px;background:#eee;color:#090a0b;border:0;border-radius:9px;font-weight:800}.close{float:right;background:#222;color:#fff;border:0;border-radius:7px;padding:7px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;padding:25px 12px;overflow:auto}.modal.show{display:block}.box{max-width:680px;margin:auto;background:#111315;border:1px solid #292c30;border-radius:15px;padding:15px}</style></head><body><div class="app"><header><div class="brand">UFC 6 / PERSONAL DATABASE</div><div class="title">FIGHTER RANKINGS</div></header><div class="nav" id="weights"></div><main class="main" id="main"></main></div><div class="bottom"><button onclick="page='home';render()"><span>⌂</span>Главная</button><button onclick="page='rank';render()"><span>▤</span>Рейтинг</button><button onclick="page='fighters';render()"><span>◉</span>Бойцы</button><button onclick="page='add';render()"><span>＋</span>Бой</button></div><div class="modal" id="modal"><div class="box"><button class="close" onclick="modal.classList.remove('show')">✕</button><div id="profile"></div></div></div><script>const W=['P4P','Heavyweight','Light Heavyweight','Middleweight','Welterweight','Lightweight','Featherweight','Bantamweight','Flyweight',"Women's Bantamweight","Women's Flyweight","Women's Strawweight"];let F=JSON.parse(localStorage.ufc6||'null')||[['Alex Pereira','Light Heavyweight',1,1,0,0,0,0,0],['Jon Jones','Heavyweight',1,0,0,0,0,0,0],['Tom Aspinall','Heavyweight',2,0,0,0,0,0,0],['Islam Makhachev','Welterweight',1,0,0,0,0,0,0],['Ilia Topuria','Lightweight',2,0,0,0,0,0,0]].map(x=>({name:x[0],weight:x[1],rank:x[2],wins:x[3],losses:x[4],ko:x[5],sub:x[6],dec:x[7],streak:x[8],history:[]}));let weight='P4P',page='home';const save=()=>localStorage.ufc6=JSON.stringify(F),esc=s=>encodeURIComponent(s);function render(){document.getElementById('weights').innerHTML=W.map(x=>`<button class="${x==weight?'on':''}" onclick="weight='${x}';page='rank';render()">${x}</button>`).join('');let m=document.getElementById('main');if(page==='home')home(m);if(page==='rank')rank(m);if(page==='fighters')fighters(m);if(page==='add')add(m)}function list(){return F.filter(f=>weight==='P4P'||f.weight===weight).sort((a,b)=>a.rank-b.rank)}function row(f){return `<div class="row" onclick="openF('${esc(f.name)}')"><div class="rank">${f.rank}</div><div class="avatar">${f.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="grow"><div class="name">${f.name}</div><div class="meta">${f.weight} · ${f.wins}-${f.losses}</div></div><span class="badge">${f.streak?'W'+f.streak:'—'}</span></div>`}function home(m){let w=F.reduce((a,f)=>a+f.wins,0),l=F.reduce((a,f)=>a+f.losses,0);m.innerHTML=`<div class="card"><div class="muted">MY UFC 6 RECORD</div><div class="hero">${w}-${l}</div><div class="muted">Записанные результаты</div></div><div class="grid"><div class="stat"><b>${F.length}</b><span>БОЙЦОВ</span></div><div class="stat"><b>${w}</b><span>ПОБЕД</span></div><div class="stat"><b>${l}</b><span>ПОРАЖЕНИЙ</span></div><div class="stat"><b>${F.filter(f=>f.streak>0).length}</b><span>СЕРИИ</span></div></div><h3>TOP P4P</h3><div class="list">${F.slice().sort((a,b)=>a.rank-b.rank).slice(0,5).map(row).join('')}</div>`}function rank(m){m.innerHTML=`<div class="card"><div class="muted">RANKINGS</div><div class="hero" style="font-size:25px">${weight}</div></div><div class="list">${list().map(row).join('')||'<div class="card muted">Нет бойцов</div>'}</div>`}function fighters(m){m.innerHTML=`<input id="q" placeholder="Поиск бойца..." oninput="searchF()"><div id="fl" class="list">${F.map(row).join('')}</div>`}function searchF(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('fl').innerHTML=F.filter(f=>f.name.toLowerCase().includes(q)).map(row).join('')}function add(m){m.innerHTML=`<div class="card"><div class="muted">NEW ONLINE FIGHT</div><h2>Записать бой</h2><label>Боец</label><input id="n" placeholder="Alex Pereira"><label>Весовая</label><select id="w">${W.slice(1).map(x=>`<option>${x}</option>`).join('')}</select><label>Результат</label><select id="r"><option>WIN</option><option>LOSS</option></select><label>Метод</label><select id="mt"><option>KO/TKO</option><option>SUBMISSION</option><option>DECISION</option></select><label>Серия побед</label><input id="s" type="number" value="1"><button class="primary" onclick="fight()">СОХРАНИТЬ</button></div>`}function fight(){let n=document.getElementById('n').value.trim();if(!n)return alert('Введите бойца');let f=F.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!f){f={name:n,weight:document.getElementById('w').value,rank:15,wins:0,losses:0,ko:0,sub:0,dec:0,streak:0,history:[]};F.push(f)}f.weight=document.getElementById('w').value;let win=document.getElementById('r').value==='WIN',mt=document.getElementById('mt').value;if(win){f.wins++;f.streak=+document.getElementById('s').value||0;if(mt==='KO/TKO')f.ko++;if(mt==='SUBMISSION')f.sub++;if(mt==='DECISION')f.dec++}else{f.losses++;f.streak=0}f.history.unshift({result:win?'WIN':'LOSS',method:mt,date:new Date().toLocaleDateString()});save();openF(esc(f.name))}function openF(n){let f=F.find(x=>x.name===decodeURIComponent(n));document.getElementById('modal').classList.add('show');document.getElementById('profile').innerHTML=`<div class="muted">FIGHTER PROFILE</div><h1>${f.name}</h1><div class="muted">${f.weight} · #${f.rank}</div><h2>${f.wins}-${f.losses}</h2><div class="grid"><div class="stat"><b>${f.streak}</b><span>WIN STREAK</span></div><div class="stat"><b>${f.ko}</b><span>KO/TKO</span></div><div class="stat"><b>${f.sub}</b><span>SUB</span></div><div class="stat"><b>${f.dec}</b><span>DEC</span></div></div><h3>FIGHT HISTORY</h3><div class="list">${f.history.map(h=>`<div class="row"><b>${h.result}</b><div class="grow"><div class="name">${h.method}</div><div class="meta">${h.date}</div></div></div>`).join('')||'<div class="muted">Пока нет боёв</div>'}</div>`}render();</script></body></html>
