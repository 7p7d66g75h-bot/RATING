<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Road to UFC</title><style>body{margin:0;background:#0b0c0f;color:#eee;font-family:Arial,sans-serif}#app{max-width:900px;margin:auto;padding:20px}.card,.offer,.notice{background:#15171c;border:1px solid #292d35;border-radius:14px;padding:16px;margin:10px 0}.btn{border:0;border-radius:12px;padding:14px 18px;background:#292d35;color:#fff;font-weight:700;cursor:pointer;margin:5px}.red{background:#b21f2d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.ey{color:#999;font-size:12px;letter-spacing:2px}.muted{color:#999}.title{font-size:30px}.row{display:flex;justify-content:space-between;gap:10px}.badge,.tag{background:#252932;border-radius:8px;padding:6px 9px;font-size:12px}.locked{opacity:.45;pointer-events:none}.bar{height:8px;background:#292d35;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#d33;width:0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:12px 18px;border-radius:12px;font-weight:700}</style></head><body><div id="app"></div><script>const KEY='mma_rtu_v9';const N=['Иван Петров','Алексей Волков','Марк Орлов','Денис Ким','Артур Соколов','Максим Белый'];const ORGS=['UFC','PFL','ACA','RCC','Cage Warriors','KSW','ONE','Bellator','Rizin','LFA','Siberian Fight League','ACA Siberia','RCC Regional','Fight Nights Regional','MMA Series Regional'];let S=JSON.parse(localStorage.getItem(KEY)||'null')||{page:'home',fighter:null,contract:null,opponents:[],offers:[],week:0,fight:null,toast:null};function save(){localStorage.setItem(KEY,JSON.stringify(S))}function money(n){return '$'+n.toLocaleString()}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function go(p){if(S.contract&&(p==='match'||p==='offers'))return toast('Сначала завершите текущий бой');S.page=p;save();render()}function toast(t){S.toast=t;render();setTimeout(()=>{S.toast=null;render()},1800)}function home(){return `<h1 class="title">MMA · ROAD TO UFC</h1><p class="muted">Карьерный симулятор бойца</p>${S.fighter?`<div class="card"><h2>${esc(S.fighter.name)}</h2><p>${S.fighter.wins}-${S.fighter.losses} · ${esc(S.fighter.league)}</p></div>`:''}<button class="btn red" onclick="${S.fighter?'go(\'career\')':'go(\'create\')'}">${S.fighter?'Продолжить карьеру':'Создать бойца'}</button>`}function create(){return `<h1 class="title">Создание бойца</h1><div class="card"><input id="nm" placeholder="Имя" style="padding:14px;width:90%"><p>Вес</p><select id="wt" style="padding:12px"><option>Lightweight</option><option>Featherweight</option><option>Welterweight</option></select><p>Стиль</p><select id="st" style="padding:12px"><option>Striker</option><option>Wrestler</option><option>Grappler</option><option>All-rounder</option></select></div><button class="btn red" onclick="createF()">Начать карьеру</button>`}function createF(){let name=document.getElementById('nm').value.trim()||'Александр';S.fighter={name,weight:document.getElementById('wt').value,style:document.getElementById('st').value,wins:0,losses:0,money:0,fans:100,league:'Siberian Fight League',health:100,stats:{striking:70,power:70,defense:70,wrestling:60,ground:60,cardio:70},history:[]};S.page='career';save();render()}function career(){let f=S.fighter,locked=!!S.contract;return `<h1 class="title">${esc(f.name)}</h1><p>${f.wins}-${f.losses} · ${esc(f.league)}</p>${locked?`<div class="notice"><b>🔒 Контракт активен</b><p>${esc(S.contract.org)} · VS ${esc(S.contract.opponent.name)}</p><button class="btn red" onclick="go('camp')">🏋️ Открыть лагерь</button></div>`:''}<div class="grid"><button class="btn ${locked?'locked':''}" onclick="go('match')">🥊 Выбор соперника</button><button class="btn ${locked?'locked':''}" onclick="go('offers')">📨 Предложения</button><button class="btn" onclick="go('world')">🌍 Лиги</button></div><div class="card"><h3>Последние бои</h3>${f.history.slice(-5).reverse().map(x=>`<p>${x.w?'🟢':'🔴'} ${x.o} · ${x.l}</p>`).join('')||'<p class="muted">Пока нет боёв</p>'}</div>`}function generateOpp(){let f=S.fighter;S.opponents=Array.from({length:6},()=>{let org=f.league;if(f.wins>=2&&Math.random()<.4)org=['RCC','ACA','Cage Warriors'][Math.floor(Math.random()*3)];let score=62+Math.floor(Math.random()*30);return{name:N[Math.floor(Math.random()*N.length)],record:(1+Math.floor(Math.random()*14))+'-'+Math.floor(Math.random()*4),org,score,purse:700+Math.floor(Math.random()*10)*200}})}function match(){if(S.contract)return `<div class="notice"><b>🔒 Выбор соперника недоступен</b><p>У тебя уже подписан контракт. Сначала закончи тренировочный лагерь и бой.</p><button class="btn red" onclick="go('camp')">Перейти в лагерь</button></div>`;if(!S.opponents.length)generateOpp();return `<h1 class="title">Выбор соперника</h1><div class="grid">${S.opponents.map((o,i)=>`<div class="offer"><span class="badge">ЛИГА: ${o.org}</span><h2>${o.name}</h2><p class="muted">${o.record} · сила ${o.score}</p><p>Гонорар: <b>${money(o.purse)}</b></p><button class="btn red" onclick="selectOpp(${i})">Подписать бой</button></div>`).join('')}</div>`}function selectOpp(i){if(S.contract)return;let o=S.opponents[i];S.contract={org:o.org,opponent:o,show:o.purse,win:o.purse};S.opponents=[];S.offers=[];S.week=1;S.page='camp';save();toast('Контракт подписан · тренировочный лагерь открыт')}function offers(){if(S.contract)return match();if(!S.offers.length)S.offers=[{org:'UFC',opponent:{name:'Макс Рид',record:'9-2',score:82},show:3500,win:3500},{org:'ACA',opponent:{name:'Илья Громов',record:'12-4',score:78},show:1800,win:1800}];return `<h1 class="title">Предложения</h1>${S.offers.map((x,i)=>`<div class="offer"><span class="badge">ПРЕДЛАГАЕТ: ${x.org}</span><h2>${x.opponent.name}</h2><p>${x.opponent.record} · сила ${x.opponent.score}</p><p>ONE FIGHT · SHOW ${money(x.show)} · WIN ${money(x.win)}</p><button class="btn red" onclick="acceptOffer(${i})">Принять</button><button class="btn" onclick="negotiate(${i})">Переговоры</button><button class="btn" onclick="S.offers.splice(${i},1);save();render()">Отказать</button></div>`).join('')}`}function acceptOffer(i){if(S.contract)return;let x=S.offers[i];S.contract={org:x.org,opponent:x.opponent,show:x.show,win:x.win};S.offers=[];S.opponents=[];S.week=1;S.page='camp';save();toast('Контракт подписан · лагерь открыт')}function negotiate(i){let x=S.offers[i];x.show+=500;x.win+=500;save();toast('Встречное предложение отправлено')}function camp(){if(!S.contract)return match();let p=(S.week-1)/4*100;return `<h1 class="title">🏋️ Тренировочный лагерь</h1><div class="notice"><b>${S.contract.org}</b> · VS ${S.contract.opponent.name}<p class="muted">ONE FIGHT · SHOW ${money(S.contract.show)} · WIN ${money(S.contract.win)}</p><div class="bar"><i style="width:${p}%"></i></div><p>Неделя ${S.week}/4</p></div><div class="grid">${[['striking','🥊 Ударка'],['wrestling','🤼 Борьба'],['ground','🥋 Партер'],['cardio','🫁 Кардио'],['defense','🛡 Защита'],['recovery','🛌 Восстановление']].map(x=>`<div class="card"><h3>${x[1]}</h3><button class="btn" onclick="train('${x[0]}')">Тренировать</button></div>`).join('')}</div>`}function train(x){if(!S.contract)return;let f=S.fighter;if(x==='recovery')f.health=Math.min(100,f.health+8);else f.stats[x]=Math.min(100,f.stats[x]+2);S.week++;if(S.week>4){S.fight={round:1,time:300,you:100,opp:100,stamina:100,os:100,momentum:0,log:['FIGHT NIGHT · Раунд 1']};S.page='fight'}save();render()}function fight(){let q=S.fight,o=S.contract?.opponent;if(!q)return camp();if(q.finished)return `<h1>${q.result}</h1><p>${q.method}</p><button class="btn red" onclick="finishFight()">Завершить бой</button>`;return `<h1 class="title">${S.contract.org} · FIGHT NIGHT</h1><h2>Раунд ${q.round}/3 · ${Math.floor(q.time/60)}:${String(q.time%60).padStart(2,'0')}</h2><div class="grid"><div class="card"><h2>${S.fighter.name}</h2><p>❤️ ${q.you} · 🫁 ${q.stamina}</p></div><div class="card"><h2>${o.name}</h2><p>❤️ ${q.opp} · 🫁 ${q.os}</p></div></div><div class="card"><p>MOMENTUM: ${q.momentum}/100</p><button class="btn" onclick="act('safe')">🛡 Безопасно</button><button class="btn" onclick="act('standard')">⚔️ Стандартно</button><button class="btn red" onclick="act('risk')">🔥 Рискованно</button><div class="muted">${q.log.slice(-5).join('<br>')}</div></div>`}function act(t){let q=S.fight,f=S.fighter,o=S.contract.opponent,r=Math.random(),power=(f.stats.striking+f.stats.power)/2,enemy=o.score;let my=0,ed=0;if(t==='safe'){my=Math.round(power/35*(.6+r));ed=Math.round(enemy/35*r);q.stamina=Math.min(100,q.stamina+3);q.momentum=Math.max(0,q.momentum-2);q.log.push('🛡 Безопасный эпизод.')}else if(t==='standard'){my=Math.round(power/20*(.6+r));ed=Math.round(enemy/24*r);q.stamina-=7;q.momentum+=my>ed?5:-3;q.log.push('⚔️ Ровный размен.')}else{let success=r<(.35+f.stats.defense/250);my=success?Math.round(power/9*(.7+r)):Math.round(power/35*r);ed=success?Math.round(enemy/25*r):Math.round(enemy/8*(.5+r));q.stamina-=14;q.momentum+=success?12:-15;q.log.push(success?'🔥 Риск оправдан!':'❌ Соперник наказал за риск.')}q.you=Math.max(0,q.you-ed);q.opp=Math.max(0,q.opp-my);q.stamina=Math.max(0,q.stamina);q.os=Math.max(0,q.os-5);q.momentum=Math.max(0,Math.min(100,q.momentum));if(q.you<=0||q.opp<=0){q.finished=true;q.result=q.opp<=0?'ПОБЕДА':'ПОРАЖЕНИЕ';q.method='KO/TKO'}else{q.time-=30;if(q.time<=0){if(q.round<3){q.round++;q.time=300}else{q.finished=true;q.result=q.you>q.opp?'ПОБЕДА':'ПОРАЖЕНИЕ';q.method='Decision'}}}save();render()}function finishFight(){let f=S.fighter,o=S.contract.opponent,q=S.fight,w=q.result==='ПОБЕДА';f.history.push({o:o.name,l:S.contract.org,w});if(w){f.wins++;f.money+=S.contract.show+S.contract.win;f.fans+=6}else{f.losses++;f.money+=S.contract.show}S.contract=null;S.fight=null;S.opponents=[];S.offers=[];S.week=0;S.page='career';save();toast(w?'Победа! Контракт завершён':'Поражение. Контракт завершён')}function world(){return `<h1 class="title">MMA WORLD</h1><div class="grid">${ORGS.map((x,i)=>`<div class="card"><div class="row"><b>${x}</b><span class="tag">${i<10?'TOP':'REGIONAL'}</span></div><p class="muted">${i<10?'Рейтинги · P4P · титулы':'Региональная сцена · без рейтинга'}</p></div>`).join('')}</div>`}function render(){let c=S.page==='home'?home():S.page==='create'?create():S.page==='career'?career():S.page==='match'?match():S.page==='offers'?offers():S.page==='camp'?camp():S.page==='fight'?fight():world();document.getElementById('app').innerHTML=c+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'')}render()</script></body></html>
