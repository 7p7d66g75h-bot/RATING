<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MMA Road to UFC</title><style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f5f5f5;font:14px Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:64px;border-bottom:1px solid #292d36;background:#0a0b0f;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}.logo{font-weight:950;letter-spacing:.08em}.logo b{color:#e9343c}.layout{display:grid;grid-template-columns:220px 1fr;max-width:1450px;margin:auto}.side{border-right:1px solid #292d36;min-height:calc(100vh - 64px);padding:14px}.nav{display:grid;gap:6px}.nav button{padding:13px;border:1px solid transparent;background:transparent;color:#aeb4bf;text-align:left;border-radius:10px}.nav button.on,.nav button:hover{background:#171920;border-color:#2c3039;color:#fff}.nav button.on{box-shadow:inset 3px 0 #e9343c}.main{padding:22px;max-width:1180px;width:100%;margin:auto}.title{font-size:34px;margin:4px 0 8px;font-weight:950}.eyebrow{font-size:10px;letter-spacing:.17em;font-weight:900;color:#ed4148;text-transform:uppercase}.muted{color:#8f96a4}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.card{background:#111318;border:1px solid #2a2e37;border-radius:14px;padding:16px}.hero{min-height:290px;padding:28px;border:1px solid #30343d;border-radius:18px;background:linear-gradient(130deg,#181b22,#0c0e12);display:flex;justify-content:space-between;align-items:end;gap:18px}.hero h1{font-size:48px;line-height:1;margin:9px 0}.btn{border:1px solid #343944;background:#191c22;color:#fff;padding:12px 16px;border-radius:10px;font-weight:850}.btn.red{background:#df2932;border-color:#df2932}.btn.gold{background:#c7a05b;color:#111;border-color:#c7a05b}.btn.green{background:#277a52;border-color:#277a52}.btn:disabled{opacity:.4}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stat{font-size:28px;font-weight:950}.tag{display:inline-block;border:1px solid #333842;border-radius:999px;padding:5px 9px;margin:3px;color:#cbd0d9;font-size:11px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;color:#808793;font-size:10px;text-transform:uppercase;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;background:#0b0d11;color:#fff;border:1px solid #2b2f38;border-radius:8px}.full{grid-column:1/-1}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice button{padding:14px;background:#0d0f13;color:#bdc3cc;border:1px solid #2b2f38;border-radius:10px;text-align:left}.choice button.on{border-color:#e9343c;background:#1b1013;color:#fff}.opponent{position:relative}.opponent .risk{position:absolute;right:13px;top:13px}.low{color:#55c586}.mid{color:#d5aa57}.high{color:#e95656}.score{font-size:22px;font-weight:950}.offerbox{border:1px solid #343944;background:#0d0f13;border-radius:12px;padding:15px}.money{font-size:30px;font-weight:950}.neggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slider{width:100%;accent-color:#df3038}.weekbar{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.week{padding:10px 4px;border:1px solid #2a2e37;border-radius:8px;text-align:center;background:#0d0f13}.week.active{border-color:#df3038;background:#1b1013}.week.done{opacity:.4}.bar{height:7px;background:#292d36;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#df3038}.mobile{display:none}.campday{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:center}.campday button{padding:13px;background:#14171d;border:1px solid #2b2f38;color:#fff;border-radius:9px;text-align:left}.campday button.active{border-color:#e9343c}.fight-screen{max-width:980px;margin:auto}.fight-head{display:grid;grid-template-columns:1fr 100px 1fr;gap:12px;align-items:center}.fighter-side{text-align:center}.avatar{width:78px;height:78px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#323641,#15171c);border:1px solid #404550;font-weight:950;font-size:22px}.clock{text-align:center;font-size:48px;font-weight:950}.round{text-align:center;color:#9097a3}.hp{height:10px;background:#272b34;border-radius:8px;overflow:hidden;margin-top:8px}.hp i{display:block;height:100%;background:#df3038}.stamina i{background:#c8a15c}.tactics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tactic{padding:17px;background:#14171d;border:1px solid #2b2f38;color:#fff;border-radius:10px;text-align:left}.tactic b{display:block;margin-bottom:5px}.tactic small{color:#858c99}.fight-log{height:190px;overflow:auto;background:#08090c;border:1px solid #292d36;border-radius:10px;padding:13px;font:12px/1.7 monospace}.result{text-align:center;padding:25px;border:1px solid #343944;background:#111318;border-radius:15px}.bigresult{font-size:40px;font-weight:950}@media(max-width:850px){.layout{display:block}.side{display:none}.main{padding:14px 12px 80px}.hero{min-height:400px;padding:20px;align-items:end}.hero h1{font-size:37px}.g2,.g3,.form,.neggrid{grid-template-columns:1fr}.choice{grid-template-columns:1fr 1fr}.weekbar{grid-template-columns:repeat(4,1fr)}.fight-head{grid-template-columns:1fr}.tactics{grid-template-columns:1fr 1fr}.mobile{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:30;grid-template-columns:repeat(4,1fr);background:#0b0c10f7;border-top:1px solid #2b2f37;padding:6px}.mobile button{border:0;background:transparent;color:#8d94a0;font-size:10px}.mobile button.on{color:#fff}}
</style></head><body><div id="app"></div><script>
const ORGS=[['UFC','🇺🇸','major'],['PFL','🇺🇸','major'],['ONE Championship','🇸🇬','major'],['RIZIN','🇯🇵','major'],['ACA','🇷🇺','major'],['KSW','🇵🇱','major'],['Cage Warriors','🇬🇧','major'],['LFA','🇺🇸','major'],['BRAVE CF','🇧🇭','major'],['OKTAGON MMA','🇨🇿','major'],['RCC','🇷🇺','regional'],['Fight Nights','🇷🇺','regional'],['MFP','🇷🇺','regional'],['Siberian Fight League','🇷🇺','regional'],['ACA Young Eagles','🇷🇺','regional'],['Open FC','🇷🇺','regional']];
const WEIGHTS=[['FLY','Flyweight',56.7],['BW','Bantamweight',61.2],['FW','Featherweight',65.8],['LW','Lightweight',70.3],['WW','Welterweight',77.1],['MW','Middleweight',83.9],['LHW','Light Heavyweight',93],['HW','Heavyweight',120.2]];
const STYLES=[['Striker','Ударник'],['Wrestler','Борец'],['Submission','Сабмишн-хантер'],['Kickboxer','Кикбоксер'],['Pressure','Прессинг-файтер'],['Counter','Контрпанчер'],['AllRounder','Универсал']];
const NAMES=['Максим Орлов','Дмитрий Сафин','Илья Морозов','Роман Беляев','Тимур Абаев','Владислав Ким','Алексей Волков','Марк Соколов','Денис Крылов','Иван Петров','Сергей Белов','Артур Магомедов','Никита Лебедев','Марат Абдуллин','Егор Фёдоров','Роман Кузнецов','Даниил Каримов','Матвей Соколов'];
let S=JSON.parse(localStorage.getItem('mmaRoadV5')||'null')||{page:'home',style:0,week:1,year:2026,fighter:null,opponents:[],selectedOpp:null,negotiation:null,contract:null,fight:null,lastResult:null,training:{},log:[]};
function save(){localStorage.setItem('mmaRoadV5',JSON.stringify(S))}function go(p){S.page=p;save();render()}function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nav(){return [['home','⌂','Главная'],['career','♟','Карьера'],['match','⚔','Соперник'],['camp','⚡','Тренировки'],['world','◉','Мир'],['rank','♛','Рейтинги'],['profile','●','Профиль']].map(x=>`<button class="${S.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}
function shell(c){return `<div class="app"><header class="top"><div class="logo">MMA <b>ROAD TO UFC</b></div><div class="muted">${S.fighter?esc(S.fighter.name)+' · '+S.fighter.record:'Новая карьера'}</div></header><div class="layout"><aside class="side"><div class="nav">${nav()}</div></aside><main class="main">${c}</main></div><nav class="mobile">${nav()}</nav></div>`}
function home(){if(!S.fighter)return `<div class="hero"><div><div class="eyebrow">CAREER RPG · V5</div><h1>Пробейся в UFC.</h1><p class="muted">Выбирай соперников, веди переговоры, строй тренировочный лагерь и принимай тактические решения в бою.</p><button class="btn red" onclick="go('create')">Создать бойца</button></div></div>`;let f=S.fighter;return `<div class="hero"><div><div class="eyebrow">${S.year} · НЕДЕЛЯ ${S.week}</div><h1>${esc(f.name)}</h1><p class="muted">${f.weightName} · ${f.styleName} · ${f.league}</p><span class="tag">${f.record}</span><span class="tag">$${f.money.toLocaleString()}</span><span class="tag">${f.popularity} POP</span></div><button class="btn red" onclick="go('${S.fight?'fight':S.contract?'camp':S.negotiation?'negotiation':'match'}')">${S.fight?'Продолжить бой':S.contract?'Тренировочный лагерь':S.negotiation?'Переговоры':'Найти соперника'}</button></div><div class="grid g3" style="margin-top:13px"><div class="card"><div class="muted">Рекорд</div><div class="stat">${f.record}</div></div><div class="card"><div class="muted">Здоровье</div><div class="stat">${f.health}%</div></div><div class="card"><div class="muted">Уверенность</div><div class="stat">${f.confidence}</div></div></div>`}
function create(){return `<div class="eyebrow">CHARACTER CREATION</div><h1 class="title">Создание бойца</h1><div class="card"><div class="form"><div class="field"><label>Имя</label><input id="fn" placeholder="Александр"></div><div class="field"><label>Фамилия</label><input id="ln" placeholder="Брюханов"></div><div class="field"><label>Страна</label><input id="ct" value="RUS"></div><div class="field"><label>Возраст</label><input id="age" value="20" type="number"></div><div class="field"><label>Рост</label><input id="ht" value="174" type="number"></div><div class="field"><label>Вес вне лагеря</label><input id="walk" value="70" type="number"></div><div class="field"><label>Весовая</label><select id="wt">${WEIGHTS.map(w=>`<option value="${w[0]}">${w[1]} · ${w[2]} кг</option>`).join('')}</select></div><div class="field"><label>Стойка</label><select id="stance"><option>Orthodox</option><option>Southpaw</option><option>Switch</option></select></div><div class="full"><label class="muted">Стиль</label><div class="choice">${STYLES.map((s,i)=>`<button id="st${i}" class="${i===S.style?'on':''}" onclick="S.style=${i};render()"><b>${s[1]}</b><br><small>${styleDesc(s[0])}</small></button>`).join('')}</div></div><div class="full"><button class="btn red" onclick="createFighter()">Начать карьеру</button></div></div></div>`}
function styleDesc(s){return {Striker:'Бокс, дистанция и точность',Wrestler:'Тейкдауны и контроль',Submission:'Партер и сабмишны',Kickboxer:'Кики, колени и дистанция',Pressure:'Темп и давление',Counter:'Тайминг и контратаки',AllRounder:'Сбалансированный MMA'}[s]}
function createFighter(){let w=WEIGHTS.find(x=>x[0]===document.getElementById('wt').value),s=STYLES[S.style];let name=((document.getElementById('fn').value||'Александр')+' '+(document.getElementById('ln').value||'Брюханов')).trim();let stats={boxing:68,kicks:67,power:66,speed:68,accuracy:67,defense:65,wrestling:65,tddef:65,clinch:64,ground:64,submission:64,cardio:70,strength:66,chin:70,iq:64};let bonus={Striker:['boxing',10],Wrestler:['wrestling',11],Submission:['submission',13],Kickboxer:['kicks',11],Pressure:['cardio',9],Counter:['defense',10],AllRounder:['iq',6]}[s[0]];stats[bonus[0]]+=bonus[1];S.fighter={name,country:document.getElementById('ct').value||'RUS',age:+document.getElementById('age').value||20,height:+document.getElementById('ht').value||174,walk:+document.getElementById('walk').value||70,weight:w[0],weightName:w[1],limit:w[2],stance:document.getElementById('stance').value,style:s[0],styleName:s[1],league:'Siberian Fight League',record:'0-0',wins:0,losses:0,money:1500,popularity:5,confidence:70,health:100,stats,history:[]};S.page='career';save();render()}
function career(){let f=S.fighter;if(!f)return create();return `<div class="row"><div><div class="eyebrow">CAREER</div><h1 class="title">${esc(f.name)}</h1><div class="muted">${f.record} · ${f.weightName} · ${f.league}</div></div><button class="btn dark" onclick="go('match')">Соперники</button></div><div class="card" style="margin-top:13px"><div class="eyebrow">CAREER ROADMAP</div><div class="weekbar" style="margin-top:10px">${Array.from({length:8},(_,i)=>`<div class="week ${i+1===S.week?'active':''} ${i+1<S.week?'done':''}"><b>${i+1}</b><br><small>${i+1===8?'FIGHT':'CAMP'}</small></div>`).join('')}</div></div><div class="grid g3" style="margin-top:13px"><div class="card"><div class="muted">Следующее</div><h2>${S.fight?'FIGHT NIGHT':S.contract?'TRAINING CAMP':S.negotiation?'NEGOTIATION':'MATCHMAKING'}</h2></div><div class="card"><div class="muted">Баланс</div><div class="stat">$${f.money.toLocaleString()}</div></div><div class="card"><div class="muted">Здоровье</div><div class="stat">${f.health}%</div></div></div><div class="card" style="margin-top:13px"><h2>История боёв</h2>${f.history.length?`<table class="table"><tr><th>№</th><th>Соперник</th><th>Результат</th><th>Метод</th></tr>${f.history.slice().reverse().map((x,i)=>`<tr><td>${f.history.length-i}</td><td>${esc(x.o)}</td><td class="${x.w?'success':'danger'}">${x.w?'WIN':'LOSS'}</td><td>${x.m}</td></tr>`).join('')}</table>`:'<div class="muted">Пока 0 профессиональных боёв.</div>'}</div>`}
function match(){let f=S.fighter;if(!f)return create();if(!S.opponents.length)generateOpponents();return `<div class="eyebrow">MATCHMAKING</div><h1 class="title">Выбери следующий бой</h1><p class="muted">Не просто самый слабый соперник. Смотри на риск, качество победы и деньги.</p><div class="grid g2">${S.opponents.map((o,i)=>`<div class="card opponent"><div class="risk ${o.risk==='LOW'?'low':o.risk==='MEDIUM'?'mid':'high'}">${o.risk}</div><div class="avatar">${initials(o.name)}</div><h2>${o.name}</h2><div class="muted">${o.record} · ${o.style}</div><p>Возраст ${o.age} · ${o.height} см</p><div class="grid g3"><div><small class="muted">SCORE</small><div class="score">${o.score}</div></div><div><small class="muted">PURSE</small><div>$${o.purse}</div></div><div><small class="muted">RISK</small><div>${o.risk}</div></div></div><button class="btn red" style="margin-top:12px;width:100%" onclick="selectOpponent(${i})">Выбрать</button></div>`).join('')}</div>`}
function generateOpponents(){let f=S.fighter;S.opponents=Array.from({length:6},(_,i)=>{let w=1+Math.floor(Math.random()*8),l=Math.floor(Math.random()*3),score=Math.max(45,65+i*4+Math.floor(Math.random()*20));return{name:NAMES[Math.floor(Math.random()*NAMES.length)],record:w+'-'+l,style:['Striker','Wrestler','Kickboxer','Pressure Fighter','Submission Hunter','Counter Striker'][Math.floor(Math.random()*6)],age:21+Math.floor(Math.random()*12),height:f.height-5+Math.floor(Math.random()*12),score,purse:700+Math.floor(Math.random()*8)*200,risk:score<68?'LOW':score<82?'MEDIUM':'HIGH'}})}
function selectOpponent(i){S.selectedOpp=S.opponents[i];S.negotiation={show:S.selectedOpp.purse,win:S.selectedOpp.purse};S.page='negotiation';save();render()}
function negotiation(){let o=S.selectedOpp,n=S.negotiation;if(!o)return match();return `<div class="eyebrow">NEGOTIATION</div><h1 class="title">Переговоры</h1><div class="grid g2"><div class="card"><div class="avatar">${initials(o.name)}</div><h2>${o.name}</h2><div class="muted">${o.record} · ${o.style} · ${o.risk} risk</div><p>Тебе предлагают бой на условиях промоушена.</p></div><div class="card"><h2>Твой контракт</h2><div class="neggrid"><div class="offerbox"><div class="muted">SHOW MONEY</div><div class="money">$${n.show.toLocaleString()}</div></div><div class="offerbox"><div class="muted">WIN BONUS</div><div class="money">$${n.win.toLocaleString()}</div></div></div><p class="muted">Повышение суммы увеличивает шанс отказа промоушена.</p><label>Show: $${n.show.toLocaleString()}</label><input class="slider" type="range" min="500" max="5000" step="100" value="${n.show}" oninput="S.negotiation.show=+this.value;render()"><label>Win: $${n.win.toLocaleString()}</label><input class="slider" type="range" min="500" max="5000" step="100" value="${n.win}" oninput="S.negotiation.win=+this.value;render()"><button class="btn red" style="width:100%;margin-top:12px" onclick="submitNegotiation()">Отправить предложение</button></div></div>`}
function submitNegotiation(){let n=S.negotiation,o=S.selectedOpp,ask=(n.show+n.win)/(o.purse*2);if(ask>1.9&&Math.random()<.7){alert('Промоушен отказал. Слишком высокие требования.');S.negotiation={show:o.purse,win:o.purse};save();render();return}if(ask>1.35&&Math.random()<.45){alert('Промоушен вернул встречное предложение.');n.show=Math.round(o.purse*1.15/100)*100;n.win=Math.round(o.purse*1.15/100)*100;save();render();return}S.contract={opponent:o,show:n.show,win:n.win};S.opponents=[];S.page='camp';save();render()}
function camp(){let f=S.fighter;if(!f)return create();if(!S.contract)return `<div class="notice">Сначала выбери соперника и подпиши контракт.</div><button class="btn red" onclick="go('match')">Найти соперника</button>`;let c=S.contract,t=S.training;let types=[['boxing','🥊 Бокс','Ударка и точность'],['wrestling','🤼 Борьба','Тейкдауны и защита'],['grappling','🥋 BJJ','Партер и сабмишны'],['kicks','🦵 Кики','Ноги и дистанция'],['cardio','🫁 Кардио','Выносливость'],['strength','🏋️ Сила','Сила и физика'],['sparring','🥊 Спарринги','Боевая адаптация'],['recovery','🛌 Восстановление','Здоровье и форма']];return `<div class="eyebrow">TRAINING CAMP</div><div class="row"><div><h1 class="title">8 недель до боя</h1><div class="muted">VS ${esc(c.opponent.name)} · ${c.opponent.style}</div></div><span class="tag">WEEK ${S.week}/8</span></div><div class="card" style="margin-top:13px"><div class="weekbar">${Array.from({length:8},(_,i)=>`<div class="week ${i+1===S.week?'active':''} ${i+1<S.week?'done':''}"><b>${i+1}</b><br><small>${i+1===8?'FIGHT':'TRAIN'}</small></div>`).join('')}</div></div><div class="grid g2" style="margin-top:13px">${types.map(x=>`<div class="card campday"><div><h3>${x[1]}</h3><div class="muted">${x[2]}</div><div class="tag">+${t[x[0]]||0} progress</div></div><button class="${t.selected===x[0]?'active':''}" onclick="chooseTraining('${x[0]}')">${t.selected===x[0]?'Выбрано':'Выбрать'}</button></div>`).join('')}</div><div class="card" style="margin-top:13px"><h2>Тренировочный план недели ${S.week}</h2><p class="muted">Каждая неделя имеет один основной фокус. Слишком много спаррингов повышает риск травмы, восстановление возвращает здоровье.</p><button class="btn red" onclick="finishTrainingWeek()">Завершить неделю →</button></div>`}
function chooseTraining(x){S.training.selected=x;S.training[x]=(S.training[x]||0)+1;save();render()}
function finishTrainingWeek(){let f=S.fighter,x=S.training.selected;if(!x){alert('Сначала выбери фокус недели.');return}let map={boxing:'boxing',wrestling:'wrestling',grappling:'submission',kicks:'kicks',cardio:'cardio',strength:'strength'};if(map[x])f.stats[map[x]]=Math.min(100,f.stats[map[x]]+2);if(x==='recovery')f.health=Math.min(100,f.health+8);if(x==='sparring'){f.stats.iq=Math.min(100,f.stats.iq+1);if(Math.random()<.15)f.health=Math.max(50,f.health-12)}f.confidence=Math.min(100,f.confidence+1);if(S.week<8){S.week++;S.training={}}else{S.fight={round:1,time:300,you:100,opp:100,stamina:100,os:100,log:['FIGHT NIGHT. Первый раунд начинается.'],finished:false};S.page='fight';S.training={};}save();render()}
function fight(){let q=S.fight,f=S.fighter,o=S.contract.opponent;if(!q)return career();if(q.finished)return `<div class="result"><div class="eyebrow">RESULT</div><div class="bigresult">${q.result}</div><p>${q.method}</p><button class="btn red" onclick="finishFight()">Завершить бой</button></div>`;return `<div class="fight-screen"><div class="eyebrow" style="text-align:center">${o.name} · ${f.weightName}</div><div class="clock">${fmt(q.time)}</div><div class="round">ROUND ${q.round}/3</div><div class="fight-head"><div class="fighter-side"><div class="avatar">${initials(f.name)}</div><h2>${esc(f.name)}</h2><div>${q.you}%</div><div class="hp"><i style="width:${q.you}%"></i></div><div>${q.stamina}%</div><div class="hp stamina"><i style="width:${q.stamina}%"></i></div></div><div class="vs">VS</div><div class="fighter-side"><div class="avatar">${initials(o.name)}</div><h2>${esc(o.name)}</h2><div>${q.opp}%</div><div class="hp"><i style="width:${q.opp}%"></i></div><div>${q.os}%</div><div class="hp stamina"><i style="width:${q.os}%"></i></div></div></div><div class="card" style="margin-top:14px"><div class="eyebrow">CHOOSE TACTIC</div><div class="tactics" style="margin-top:9px"><button class="tactic" onclick="fightAct('pressure')"><b>🔥 PRESSURE</b><small>Темп и объём</small></button><button class="tactic" onclick="fightAct('striking')"><b>🥊 STRIKING</b><small>Ударка на очки и урон</small></button><button class="tactic" onclick="fightAct('counter')"><b>🎯 COUNTER</b><small>Ждать ошибку</small></button><button class="tactic" onclick="fightAct('wrestling')"><b>🤼 WRESTLING</b><small>Тейкдауны и контроль</small></button><button class="tactic" onclick="fightAct('grappling')"><b>🥋 GRAPPLING</b><small>Партер и сабмишны</small></button><button class="tactic" onclick="fightAct('recover')"><b>🫁 RECOVER</b><small>Сбросить темп</small></button></div></div><div class="fight-log" style="margin-top:12px">${q.log.slice(-10).join('<br>')}</div></div>`}
function fightAct(a){let q=S.fight,f=S.fighter,o=S.contract.opponent,r=Math.random(),my=0,enemy=0,msg='';let st=f.stats;let oppPower=65+o.score/4;if(a==='striking'){my=Math.round((st.boxing+st.speed+st.accuracy+st.power)/18*(.7+r));enemy=Math.round(oppPower/14*r+3);q.stamina-=8;msg='Ударная работа: '+my+' урона.'}if(a==='pressure'){my=Math.round((st.boxing+st.cardio)/14*(.7+r));enemy=Math.round(oppPower/13*r+5);q.stamina-=10;msg='Прессинг и высокий объём.'}if(a==='counter'){my=r<st.defense/100?Math.round((st.accuracy+st.power)/10*(.7+r)):4;enemy=r<.55?3:Math.round(oppPower/15*r);q.stamina-=5;msg='Контратака после ошибки.'}if(a==='wrestling'){if(r<st.wrestling/100){my=12+Math.round(st.ground/12);q.os-=12;msg='Тейкдаун и контроль.'}else{enemy=10;msg='Соперник защитил тейкдаун.'}q.stamina-=9}if(a==='grappling'){my=Math.round((st.ground+st.submission)/14*(.6+r));enemy=4;q.stamina-=8;msg='Работа в партере.'}if(a==='recover'){q.stamina=Math.min(100,q.stamina+18);enemy=2;msg='Восстановил дыхание и держишь дистанцию.'}q.opp=Math.max(0,q.opp-my);q.you=Math.max(0,q.you-enemy);q.stamina=Math.max(0,q.stamina);q.os=Math.max(0,q.os-5);q.log.push(`R${q.round} ${fmt(q.time)} · ${msg}`);if(q.opp<=0||q.you<=0){q.finished=true;q.result=q.opp<=0?'ПОБЕДА':'ПОРАЖЕНИЕ';q.method=q.opp<=0?'KO/TKO':'KO/TKO'}else{q.time-=30;if(q.time<=0){if(q.round<3){q.round++;q.time=300;q.log.push('— Перерыв. Новый раунд. —')}else{q.finished=true;q.result=q.you>q.opp?'ПОБЕДА':'ПОРАЖЕНИЕ';q.method='Decision'}}}save();render()}
function finishFight(){let f=S.fighter,o=S.contract.opponent,q=S.fight,win=q.result==='ПОБЕДА';f.history.push({o:o.name,w:win,m:q.method});if(win){f.wins++;f.money+=S.contract.show+S.contract.win;f.popularity=Math.min(100,f.popularity+6);f.confidence=Math.min(100,f.confidence+5)}else{f.losses++;f.money+=S.contract.show;f.confidence=Math.max(0,f.confidence-8)}f.record=f.wins+'-'+f.losses;f.health=Math.max(50,f.health-(win?7:15));if(f.league==='Siberian Fight League'&&f.wins>=3)f.league='RCC';else if(f.league==='RCC'&&f.wins>=6)f.league='ACA';else if(f.league==='ACA'&&f.wins>=9)f.league='Cage Warriors';else if(f.league==='Cage Warriors'&&f.wins>=12)f.league='UFC';S.week=1;S.contract=null;S.fight=null;S.selectedOpp=null;S.page='career';save();render()}
function campStats(){return ''}function world(){return `<div class="eyebrow">MMA WORLD</div><h1 class="title">Организации</h1><div class="grid g2">${ORGS.map(o=>`<div class="card"><div class="row"><div><h2>${o[2]==='major'?o[1]+' ':''}${o[0]}</h2><div class="muted">${o[2]==='major'?'Top 15 · P4P · титулы':'Региональный уровень · без рейтинга'}</div></div><span class="tag">${o[2].toUpperCase()}</span></div></div>`).join('')}</div>`}
function rank(){let names=['Ислам Махачев','Илия Топурия','Арман Царукян','Алекс Перейра','Том Аспиналл','Мераб Двалишвили','Дрикус Дю Плесси','Александр Волков','Пётр Ян','Макс Холлоуэй','Чарльз Оливейра','Шон О’Мэлли','Мовсар Евлоев','Пэдди Пимблетт','Джастин Гейджи'];if(S.fighter&&S.fighter.wins>=5)names[14]=S.fighter.name;return `<div class="eyebrow">RANKINGS</div><h1 class="title">UFC · Рейтинги</h1><div class="card"><select>${WEIGHTS.map(w=>`<option>${w[1]}</option>`).join('')}</select><table class="table"><tr><th>#</th><th>Боец</th><th>Статус</th></tr>${names.map((n,i)=>`<tr><td class="rank">${i?'#'+i:'C'}</td><td><b>${n}</b></td><td>${i<3?'Elite':'Ranked'}</td></tr>`).join('')}</table></div><div class="card" style="margin-top:13px"><h2>🌎 P4P</h2>${names.slice(0,10).map((n,i)=>`<p><b class="rank">#${i+1}</b> ${n}</p>`).join('')}</div>`}
function profile(){let f=S.fighter;if(!f)return create();return `<div class="eyebrow">FIGHTER PROFILE</div><h1 class="title">${esc(f.name)}</h1><div class="grid g2"><div class="card"><div class="avatar">${initials(f.name)}</div><h2>${esc(f.name)}</h2><p class="muted">${f.country} · ${f.age} лет · ${f.height} см</p><p>${f.weightName} · ${f.stance}</p><div class="stat">${f.record}</div><p>${f.league} · $${f.money.toLocaleString()}</p></div><div class="card"><h2>Навыки</h2>${Object.entries(f.stats).map(x=>`<div style="margin:9px 0"><div class="row"><span>${x[0]}</span><b>${x[1]}</b></div><div class="bar"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div></div>`}
function render(){let c=S.page==='home'?home():S.page==='create'?create():S.page==='career'?career():S.page==='match'?match():S.page==='negotiation'?negotiation():S.page==='camp'?camp():S.page==='fight'?fight():S.page==='world'?world():S.page==='rank'?rank():profile();document.getElementById('app').innerHTML=shell(c)}render();
</script></body></html>
