<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIGHTER RATINGS</title><style>*{box-sizing:border-box}body{margin:0;background:#090a0b;color:#eee;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:720px;margin:auto;padding-bottom:90px}header{padding:18px 16px;border-bottom:1px solid #292c30;position:sticky;top:0;background:#090a0bee;backdrop-filter:blur(12px);z-index:3}.brand{font-size:10px;letter-spacing:2px;color:#888}.title{font-size:27px;font-weight:900;margin-top:3px}.nav{display:flex;gap:6px;padding:10px 12px;overflow:auto}.nav button,.bottom button{background:#17191b;color:#aaa;border:1px solid #292c30;border-radius:10px;padding:9px 12px;white-space:nowrap}.nav .on,.bottom .on{background:#eee;color:#090a0b}.main{padding:10px 12px}.card,.row{background:#121416;border:1px solid #292c30;border-radius:13px}.card{padding:15px;margin-bottom:10px}.hero{font-size:34px;font-weight:900}.muted{font-size:11px;color:#858a90}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stat{background:#181a1d;border:1px solid #292c30;border-radius:10px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:#858a90}.list{display:grid;gap:7px}.row{display:flex;align-items:center;padding:11px;gap:10px}.rank{width:30px;text-align:center;font-size:20px;font-weight:900}.flag{font-size:25px;width:30px;text-align:center}.grow{flex:1}.name{font-weight:800}.meta{font-size:10px;color:#858a90;margin-top:3px}.record{font-weight:900;font-size:14px}.badge{font-size:9px;background:#202327;padding:5px 7px;border-radius:6px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0c0dee;border-top:1px solid #292c30;padding:9px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;z-index:4}.bottom button{border:0;background:transparent;font-size:10px}.bottom span{display:block;font-size:17px;margin-bottom:2px}input,select{width:100%;padding:12px;background:#0e1012;color:#eee;border:1px solid #292c30;border-radius:9px;margin:5px 0 10px}label{font-size:10px;color:#888}.primary{width:100%;padding:12px;background:#eee;color:#090a0b;border:0;border-radius:9px;font-weight:800}.secondary{width:100%;padding:11px;background:#17191b;color:#eee;border:1px solid #292c30;border-radius:9px;font-weight:800;margin-top:5px}.close{float:right;background:#222;color:#fff;border:0;border-radius:7px;padding:7px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;padding:25px 12px;overflow:auto}.modal.show{display:block}.box{max-width:680px;margin:auto;background:#111315;border:1px solid #292c30;border-radius:15px;padding:15px}.success{padding:10px;border:1px solid #303338;border-radius:9px;background:#181a1d;margin-bottom:10px}h3{margin-bottom:9px}</style></head><body><div class="app"><header><div class="brand">PERSONAL DATABASE</div><div class="title">FIGHTER RATINGS</div></header><div class="nav" id="weights"></div><main class="main" id="main"></main></div><div class="bottom"><button onclick="page='home';render()"><span>⌂</span>Главная</button><button onclick="page='rank';render()"><span>▤</span>Рейтинг</button><button onclick="page='fighters';render()"><span>◉</span>Бойцы</button><button onclick="page='add';render()"><span>＋</span>Бой</button></div><div class="modal" id="modal"><div class="box"><button class="close" onclick="modal.classList.remove('show')">✕</button><div id="profile"></div></div></div><script>
const W=['P4P','Heavyweight','Light Heavyweight','Middleweight','Welterweight','Lightweight','Featherweight','Bantamweight','Flyweight'];
const FLAGS={RU:'🇷🇺',US:'🇺🇸',BR:'🇧🇷',ES:'🇪🇸',NZ:'🇳🇿',GE:'🇬🇪',PL:'🇵🇱',FR:'🇫🇷',IE:'🇮🇪',AU:'🇦🇺',GB:'🇬🇧',MX:'🇲🇽',NL:'🇳🇱',CA:'🇨🇦',ZA:'🇿🇦',KZ:'🇰🇿',AM:'🇦🇲',AR:'🇦🇷',AE:'🇦🇪'};
const seed=[
{name:'Alex Pereira',weight:'Light Heavyweight',country:'BR',rank:1,wins:1,losses:1,history:[]},
{name:'Jon Jones',weight:'Heavyweight',country:'US',rank:1,wins:1,losses:0,history:[]},
{name:'Tom Aspinall',weight:'Heavyweight',country:'GB',rank:2,wins:2,losses:0,history:[]},
{name:'Islam Makhachev',weight:'Welterweight',country:'RU',rank:1,wins:1,losses:0,history:[]},
{name:'Ilia Topuria',weight:'Lightweight',country:'ES',rank:1,wins:10,losses:3,history:[]},
{name:'Tony Ferguson',weight:'Lightweight',country:'US',rank:0,wins:8,losses:1,history:[]},
{name:'Michael Chandler',weight:'Lightweight',country:'US',rank:2,wins:3,losses:0,history:[]},
{name:'Dustin Poirier',weight:'Lightweight',country:'US',rank:3,wins:3,losses:1,history:[]},
{name:'Mauricio Ruffy',weight:'Lightweight',country:'BR',rank:4,wins:5,losses:2,history:[]},
{name:'Bobby Green',weight:'Lightweight',country:'US',rank:15,wins:1,losses:0,history:[]},
{name:'TJ Dillashaw',weight:'Bantamweight',country:'US',rank:3,wins:2,losses:1,history:[]},
{name:'Carlos Ulberg',weight:'Light Heavyweight',country:'NZ',rank:3,wins:3,losses:3,history:[]},
{name:'Israel Adesanya',weight:'Middleweight',country:'NG',rank:1,wins:6,losses:0,history:[]},
{name:'Jose Aldo',weight:'Featherweight',country:'BR',rank:11,wins:1,losses:1,history:[]},
{name:'Giga Chikadze',weight:'Featherweight',country:'GE',rank:12,wins:1,losses:0,history:[]},
{name:'Michael Page',weight:'Welterweight',country:'GB',rank:16,wins:0,losses:1,history:[]},
{name:'Shavkat Rakhmonov',weight:'Welterweight',country:'KZ',rank:17,wins:0,losses:2,history:[]},
{name:'Rafael dos Anjos',weight:'Welterweight',country:'BR',rank:15,wins:0,losses:1,history:[]},
{name:'Georges St-Pierre',weight:'Welterweight',country:'CA',rank:4,wins:1,losses:0,history:[]},
{name:'Peter Yan',weight:'Bantamweight',country:'RU',rank:1,wins:5,losses:1,history:[]},
{name:'Korean Zombie',weight:'Featherweight',country:'KR',rank:0,wins:5,losses:0,history:[]},
{name:'Curtis Blaydes',weight:'Heavyweight',country:'US',rank:0,wins:6,losses:0,history:[]},
{name:'Anthony Johnson',weight:'Light Heavyweight',country:'US',rank:10,wins:1,losses:0,history:[]},
{name:'Khalil Turner',weight:'Lightweight',country:'US',rank:11,wins:1,losses:0,history:[]},
{name:'Esteban Ribovics',weight:'Lightweight',country:'AR',rank:13,wins:1,losses:0,history:[]},
{name:'Mateusz Gamrot',weight:'Lightweight',country:'PL',rank:14,wins:1,losses:0,history:[]}
];
let F=JSON.parse(localStorage.ratingDB||'null')||seed;let weight='P4P',page='home';
const save=()=>localStorage.ratingDB=JSON.stringify(F);const flag=f=>FLAGS[f.country]||'🏳️';
function render(){document.getElementById('weights').innerHTML=W.map(x=>`<button class="${x==weight?'on':''}" onclick="weight='${x}';page='rank';render()">${x}</button>`).join('');let m=document.getElementById('main');if(page==='home')home(m);if(page==='rank')rank(m);if(page==='fighters')fighters(m);if(page==='add')add(m)}
function list(){if(weight==='P4P')return F.slice().sort((a,b)=>(b.wins-b.losses)-(a.wins-a.losses)||b.wins-a.wins);return F.filter(f=>f.weight===weight).sort((a,b)=>(a.rank||99)-(b.rank||99));}
function row(f,i){let r=weight==='P4P'?i+1:(f.rank||i+1);return `<div class="row" onclick="openF('${encodeURIComponent(f.name)}')"><div class="rank">${r}</div><div class="flag">${flag(f)}</div><div class="grow"><div class="name">${f.name}</div><div class="meta">${f.weight}</div></div><div class="record">${f.wins}-${f.losses}</div></div>`}
function home(m){let w=F.reduce((a,f)=>a+f.wins,0),l=F.reduce((a,f)=>a+f.losses,0);m.innerHTML=`<div class="card"><div class="muted">DATABASE</div><div class="hero">${F.length}</div><div class="muted">бойцов в базе</div></div><div class="grid"><div class="stat"><b>${w}</b><span>ПОБЕД</span></div><div class="stat"><b>${l}</b><span>ПОРАЖЕНИЙ</span></div><div class="stat"><b>${W.length-1}</b><span>МУЖСКИХ ВЕСОВ</span></div><div class="stat"><b>＋</b><span>ДОБАВЛЯЙ БОИ</span></div></div><h3>TOP P4P</h3><div class="list">${F.slice().sort((a,b)=>(b.wins-b.losses)-(a.wins-a.losses)).slice(0,5).map((f,i)=>row(f,i)).join('')}</div>`}
function rank(m){m.innerHTML=`<div class="card"><div class="muted">RANKINGS</div><div class="hero" style="font-size:25px">${weight}</div></div><div class="list">${list().map((f,i)=>row(f,i)).join('')||'<div class="card muted">Нет бойцов</div>'}</div>`}
function fighters(m){m.innerHTML=`<div class="card"><button class="primary" onclick="page='addfighter';render()">＋ ДОБАВИТЬ БОЙЦА</button></div><input id="q" placeholder="Поиск бойца..." oninput="searchF()"><div id="fl" class="list">${F.map((f,i)=>row(f,i)).join('')}</div>`;}
function searchF(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('fl').innerHTML=F.filter(f=>f.name.toLowerCase().includes(q)).map((f,i)=>row(f,i)).join('')}
function add(m){m.innerHTML=`<div class="card"><div class="muted">NEW FIGHT</div><h2>＋ Бой</h2><label>Боец</label><select id="fighter">${F.map((f,i)=>`<option value="${i}">${flag(f)} ${f.name} — ${f.wins}-${f.losses}</option>`).join('')}</select><label>Результат</label><select id="result"><option value="W">ПОБЕДА</option><option value="L">ПОРАЖЕНИЕ</option></select><label>Метод</label><select id="method"><option>KO/TKO</option><option>SUBMISSION</option><option>DECISION</option></select><button class="primary" onclick="fight()">СОХРАНИТЬ БОЙ</button></div>`}
function addfighter(m){m.innerHTML=`<div class="card"><div class="muted">NEW FIGHTER</div><h2>Добавить бойца</h2><label>Имя</label><input id="newname" placeholder="Имя Фамилия"><label>Страна</label><select id="country">${Object.entries(FLAGS).map(([c,f])=>`<option value="${c}">${f} ${c}</option>`).join('')}</select><label>Весовая</label><select id="newweight">${W.slice(1).map(x=>`<option>${x}</option>`).join('')}</select><label>Начальный рейтинг</label><input id="newrank" type="number" min="1" max="99" value="15"><button class="primary" onclick="createFighter()">ДОБАВИТЬ</button></div>`}
function createFighter(){let name=document.getElementById('newname').value.trim();if(!name)return alert('Введите имя');if(F.some(f=>f.name.toLowerCase()===name.toLowerCase()))return alert('Такой боец уже есть');F.push({name,country:document.getElementById('country').value,weight:document.getElementById('newweight').value,rank:+document.getElementById('newrank').value||15,wins:0,losses:0,history:[]});save();page='fighters';render()}
function fight(){let f=F[+document.getElementById('fighter').value],win=document.getElementById('result').value==='W',method=document.getElementById('method').value;if(win)f.wins++;else f.losses++;f.history=f.history||[];f.history.unshift({result:win?'ПОБЕДА':'ПОРАЖЕНИЕ',method,date:new Date().toLocaleDateString('ru-RU')});save();document.getElementById('fighter').value=F.indexOf(f);openF(encodeURIComponent(f.name))}
function openF(n){let f=F.find(x=>x.name===decodeURIComponent(n));document.getElementById('modal').classList.add('show');document.getElementById('profile').innerHTML=`<div class="muted">FIGHTER PROFILE</div><h1>${flag(f)} ${f.name}</h1><div class="muted">${f.weight} · #${f.rank||'—'}</div><h2>${f.wins}-${f.losses}</h2><div class="grid"><div class="stat"><b>${f.wins}</b><span>ПОБЕД</span></div><div class="stat"><b>${f.losses}</b><span>ПОРАЖЕНИЙ</span></div></div><h3>FIGHT HISTORY</h3><div class="list">${(f.history||[]).map(h=>`<div class="row"><b>${h.result}</b><div class="grow"><div class="name">${h.method}</div><div class="meta">${h.date}</div></div></div>`).join('')||'<div class="muted">Пока нет боёв</div>'}</div>`}
render();
</script></body></html>
