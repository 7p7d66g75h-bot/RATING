<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMA Road to UFC V7</title><style>*{box-sizing:border-box}body{margin:0;background:#08090c;color:#f5f5f7;font:14px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:62px;background:#0d0e12;border-bottom:1px solid #292d35;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:5}.logo{font-weight:950;letter-spacing:.08em}.logo b{color:#e7353e}.layout{display:grid;grid-template-columns:210px 1fr;max-width:1400px;margin:auto}.side{border-right:1px solid #292d35;min-height:calc(100vh - 62px);padding:12px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#9ca3af;border:1px solid transparent;border-radius:10px;padding:13px;text-align:left}.nav button:hover,.nav button.on{background:#181a20;color:#fff;border-color:#30343d}.main{padding:22px;max-width:1200px;width:100%;margin:auto}.title{font-size:34px;font-weight:950;margin:4px 0}.ey{font-size:10px;color:#ef424b;letter-spacing:.18em;font-weight:900}.muted{color:#9299a6}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.card{background:#111318;border:1px solid #2a2e37;border-radius:14px;padding:16px}.hero{min-height:330px;padding:28px;border-radius:18px;border:1px solid #30343c;background:linear-gradient(135deg,#1a1d24,#0b0d11);display:flex;justify-content:space-between;align-items:end}.hero h1{font-size:48px;line-height:1;margin:8px 0}.btn{background:#191c22;color:#fff;border:1px solid #363b46;border-radius:10px;padding:12px 16px;font-weight:850}.red{background:#df3039;border-color:#df3039}.green{background:#287c53;border-color:#287c53}.tag{display:inline-block;border:1px solid #363b46;border-radius:999px;padding:5px 9px;margin:3px;font-size:11px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.money{font-size:28px;font-weight:950}.stat{font-size:27px;font-weight:950}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#7f8793;font-size:10px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;background:#0b0d11;color:#fff;border:1px solid #2b3039;border-radius:9px}.offer{background:#0c0e12;border:1px solid #30343c;border-radius:12px;padding:15px}.offer.hot{border-color:#8f3339}.badge{font-size:10px;background:#252932;padding:4px 7px;border-radius:5px}.risk{font-weight:900}.low{color:#5ac98a}.mid{color:#d5ab5e}.high{color:#ef5b61}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice button{padding:14px;background:#0d0f13;color:#c5cad3;border:1px solid #2c3039;border-radius:10px;text-align:left}.choice button.on{border-color:#e7353e;background:#211114;color:#fff}.mobile{display:none}.toast{position:fixed;right:16px;top:75px;z-index:20;width:min(390px,calc(100vw - 32px));background:#171a20;border:1px solid #414650;border-left:4px solid #e7353e;border-radius:12px;padding:14px;box-shadow:0 15px 40px #0009}.fight{display:grid;grid-template-columns:1fr 80px 1fr;gap:12px;text-align:center;align-items:center}.avatar{width:70px;height:70px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#292d36;font-weight:950}.bar{height:8px;background:#292d36;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#df3039}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #292d35;text-align:left}.event{padding:11px;border-left:3px solid #df3039;background:#0d0f13;margin:7px 0;border-radius:7px}.slider{width:100%;accent-color:#df3039}@media(max-width:800px){.layout{display:block}.side{display:none}.main{padding:14px 12px 80px}.g2,.g3,.form{grid-template-columns:1fr}.choice{grid-template-columns:1fr 1fr}.hero{min-height:390px;padding:20px}.hero h1{font-size:38px}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:10;background:#0c0d11f5;border-top:1px solid #292d35;grid-template-columns:repeat(5,1fr);padding:6px}.mobile button{border:0;background:none;color:#9ca3af;font-size:10px}.mobile .on{color:#fff}.fight{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const ORGS=[['UFC','major','🇺🇸'],['PFL','major','🇺🇸'],['ONE Championship','major','🇸🇬'],['RIZIN','major','🇯🇵'],['ACA','major','🇷🇺'],['KSW','major','🇵🇱'],['Cage Warriors','major','🇬🇧'],['LFA','major','🇺🇸'],['BRAVE CF','major','🇧🇭'],['OKTAGON MMA','major','🇨🇿'],['RCC','regional','🇷🇺'],['Fight Nights','regional','🇷🇺'],['MFP','regional','🇷🇺'],['Siberian Fight League','regional','🇷🇺'],['ACA Young Eagles','regional','🇷🇺'],['Open FC','regional','🇷🇺']];const W=[['Flyweight',56.7],['Bantamweight',61.2],['Featherweight',65.8],['Lightweight',70.3],['Welterweight',77.1],['Middleweight',83.9],['Light Heavyweight',93],['Heavyweight',120.2]];const N=['Максим Орлов','Дмитрий Сафин','Илья Морозов','Роман Беляев','Тимур Абаев','Влад Ким','Марк Соколов','Денис Крылов','Иван Петров','Артур Магомедов','Никита Лебедев','Марат Абдуллин'];let S=JSON.parse(localStorage.getItem('mmaRoadV7')||localStorage.getItem('mmaRoadV6')||'null')||{page:'home',fighter:null,offers:[],contract:null,neg:null,toast:null};function save(){localStorage.setItem('mmaRoadV7',JSON.stringify(S))}function go(p){S.page=p;S.toast=null;save();render()}function money(n){return '$'+Math.round(n).toLocaleString()}function ini(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2)}function esc(x){return String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function nav(){return [['home','⌂','Главная'],['career','♟','Карьера'],['offers','✉','Предложения'],['match','⚔','Соперник'],['world','◉','Мир']].map(x=>`<button class="${S.page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}function shell(c){let t=S.toast?`<div class="toast"><b>${esc(S.toast.t)}</b><p>${esc(S.toast.p)}</p><button class="btn red" onclick="S.toast=null;render()">Закрыть</button></div>`:'';return t+`<header class="top"><div class="logo">MMA <b>ROAD TO UFC</b></div><div class="muted">${S.fighter?esc(S.fighter.name)+' · '+S.fighter.record:'Новая карьера'}</div></header><div class="layout"><aside class="side"><div class="nav">${nav()}</div></aside><main class="main">${c}</main></div><nav class="mobile">${nav()}</nav>`}function home(){if(!S.fighter)return `<div class="hero"><div><div class="ey">CAREER RPG · V7</div><h1>Пробейся в UFC.</h1><p class="muted">Выбирай вес, лигу, соперников, контракты и пробивайся наверх.</p><button class="btn red" onclick="go('create')">Создать бойца</button></div></div>`;let f=S.fighter;return `<div class="hero"><div><div class="ey">${f.league} · ${f.weight}</div><h1>${esc(f.name)}</h1><p class="muted">${f.style} · ${f.record}</p><span class="tag">$${f.money.toLocaleString()}</span><span class="tag">${f.fans} FANS</span></div><button class="btn red" onclick="go('${S.contract?'camp':'offers'}')">${S.contract?'Лагерь':'Найти бой'}</button></div><div class="grid g3" style="margin-top:12px"><div class="card"><div class="muted">Лига</div><div class="stat">${f.league}</div></div><div class="card"><div class="muted">Рейтинг</div><div class="stat">${f.rank?'#'+f.rank:'NR'}</div></div><div class="card"><div class="muted">Форма</div><div class="stat">${f.form}%</div></div></div>`}function create(){return `<div class="ey">NEW CAREER</div><h1 class="title">Создание бойца</h1><div class="card"><div class="form"><div class="field"><label>Имя</label><input id="name" value="Александр Брюханов"></div><div class="field"><label>Возраст</label><input id="age" value="20" type="number"></div><div class="field"><label>Рост</label><input id="height" value="174" type="number"></div><div class="field"><label>Весовая</label><select id="weight">${W.map(x=>`<option>${x[0]} · ${x[1]} кг</option>`).join('')}</select></div><div class="field"><label>Стиль</label><select id="style"><option>Ударник</option><option>Борец</option><option>BJJ</option><option>Кикбоксер</option><option>Прессинг</option><option>Контрпанчер</option><option>Универсал</option></select></div><div class="field"><label>Страна</label><input id="country" value="RUS"></div></div><button class="btn red" style="margin-top:14px" onclick="start()">Начать карьеру</button></div>`}function start(){let f=S.fighter={name:document.getElementById('name').value,age:+document.getElementById('age').value,height:+document.getElementById('height').value,weight:document.getElementById('weight').value.split(' · ')[0],style:document.getElementById('style').value,league:'Siberian Fight League',record:'0-0',wins:0,losses:0,money:1500,fans:5,form:70,rank:0,history:[]};S.page='career';save();render()}function career(){let f=S.fighter;if(!f)return create();return `<div class="ey">CAREER HUB</div><h1 class="title">${esc(f.name)}</h1><div class="muted">${f.league} · ${f.weight} · ${f.record}</div><div class="grid g3" style="margin-top:13px"><div class="card"><div class="muted">Лига</div><div class="stat">${f.league}</div></div><div class="card"><div class="muted">Деньги</div><div class="stat">${money(f.money)}</div></div><div class="card"><div class="muted">Рейтинг</div><div class="stat">${f.rank?'#'+f.rank:'NR'}</div></div></div><div class="card" style="margin-top:12px"><h2>Контракт</h2>${S.contract?`<p>${esc(S.contract.org)} · VS ${esc(S.contract.opponent.name)}</p><span class="tag">ONE FIGHT</span><button class="btn red" onclick="go('camp')">Открыть лагерь</button>`:'<p class="muted">Контракта нет.</p>'}</div>`}function makeOffer(org){let o={name:N[Math.floor(Math.random()*N.length)],record:(2+Math.floor(Math.random()*14))+'-'+Math.floor(Math.random()*4),style:['Ударник','Борец','Кикбоксер','Охотник за сабмишнами'][Math.floor(Math.random()*4)],rank:Math.random()<.5?0:1+Math.floor(Math.random()*15),show:600+Math.floor(Math.random()*20)*250,org};return o}function genOffers(){let f=S.fighter;S.offers=[makeOffer(f.league),makeOffer(f.league),makeOffer(f.league)];if(f.wins>=2)S.offers.push(makeOffer('RCC'));if(f.wins>=4)S.offers.push(makeOffer('ACA'));if(f.wins>=7)S.offers.push(makeOffer('Cage Warriors'));if(f.wins>=10)S.offers.push(makeOffer('UFC'));S.page='offers';S.toast={t:'Есть предложения',p:`Получено ${S.offers.length} предложений на следующий бой.`};save();render()}function offers(){if(!S.fighter)return create();if(!S.offers.length)return `<div class="card"><h2>Входящих предложений нет</h2><p class="muted">Топовые лиги не дают тебе бой просто так. Сначала нужен рекорд и интерес промоушена.</p><button class="btn red" onclick="genOffers()">Проверить рынок</button></div>`;return `<div class="ey">INBOX · FIGHT OFFERS</div><h1 class="title">Предложения на бой</h1><p class="muted">Каждая карточка показывает, <b>какая лига предлагает бой</b>. Все предложения — на один бой.</p><div class="grid g2">${S.offers.map((o,i)=>`<div class="offer ${o.org==='UFC'?'hot':''}"><div class="row"><span class="badge">ПРЕДЛАГАЕТ: ${o.org}</span><span class="tag">ONE FIGHT</span></div><h2>${esc(o.name)}</h2><p class="muted">${o.record} · ${o.style} · ${o.rank?'#'+o.rank:'NR'}</p><div class="grid g2"><div><small class="muted">SHOW</small><div class="money">${money(o.show)}</div></div><div><small class="muted">WIN</small><div class="money">${money(o.show)}</div></div></div><div class="row" style="margin-top:12px"><button class="btn green" onclick="accept(${i})">Принять</button><button class="btn" onclick="talk(${i})">Переговоры</button><button class="btn" onclick="reject(${i})">Отказать</button></div></div>`).join('')}</div>`}function accept(i){let o=S.offers[i];S.contract={org:o.org,opponent:o,show:o.show,win:o.show};S.offers=[];S.toast={t:'Бой подписан',p:`${o.org} · один бой · ${o.name}.`};S.page='career';save();render()}function reject(i){S.offers.splice(i,1);save();render()}function talk(i){let o=S.offers[i];S.neg={org:o.org,opponent:o,show:o.show,win:o.show};S.page='neg';save();render()}function neg(){let n=S.neg,o=n.opponent;return `<div class="ey">NEGOTIATION</div><h1 class="title">${esc(o.org)} · ${esc(o.name)}</h1><div class="card"><span class="badge">КОНТРАК НА ОДИН БОЙ</span><p>${o.record} · ${o.style}</p><p class="muted">Твои условия:</p><label>Show: ${money(n.show)}</label><input class="slider" type="range" min="500" max="10000" step="100" value="${n.show}" oninput="S.neg.show=+this.value;render()"><label>Win: ${money(n.win)}</label><input class="slider" type="range" min="500" max="12000" step="100" value="${n.win}" oninput="S.neg.win=+this.value;render()"><div class="row" style="margin-top:12px"><button class="btn red" onclick="submitNeg()">Отправить условия</button><button class="btn" onclick="go('offers')">Назад</button></div></div>`}function submitNeg(){let n=S.neg,base=n.opponent.show*2,ratio=(n.show+n.win)/base;if(ratio>1.8){S.toast={t:'Промоушен отказал',p:`${n.org} не согласилась на такой гонорар.`};n.show=n.opponent.show;n.win=n.opponent.show;save();render();return}if(ratio>1.3){n.show=Math.round(n.opponent.show*1.15/50)*50;n.win=Math.round(n.opponent.show*1.2/50)*50;S.toast={t:'Встречное предложение',p:`${n.org} предлагает ${money(n.show)} / ${money(n.win)}.`};save();render();return}S.contract={org:n.org,opponent:n.opponent,show:n.show,win:n.win};S.offers=[];S.neg=null;S.page='career';S.toast={t:'Переговоры завершены',p:`Контракт на один бой с ${n.opponent.name}.`};save();render()}function camp(){if(!S.contract)return career();return `<div class="ey">TRAINING CAMP</div><h1 class="title">${esc(S.contract.org)} · ${esc(S.contract.opponent.name)}</h1><p class="muted">Контракт: один бой · Show ${money(S.contract.show)} · Win ${money(S.contract.win)}</p><div class="choice">${['🥊 Бокс','🤼 Борьба','🥋 BJJ','🦵 Кики','🫁 Кардио','🏋️ Сила'].map(x=>`<button onclick="campWeek('${x}')"><b>${x}</b><br><small>Выбрать фокус недели</small></button>`).join('')}</div><div class="card" style="margin-top:12px"><h2>Тренировочный лагерь</h2><p>Выбери фокус. После лагеря начнётся бой.</p><button class="btn red" onclick="campWeek('🫁 Кардио')">Завершить неделю</button></div>`}function campWeek(x){S.camp=(S.camp||0)+1;if(S.camp<6){S.toast={t:`Неделя ${S.camp}/6`,p:`Фокус: ${x}. Форма растёт.`};save();render()}else{startFight();save();render()}}function startFight(){S.fight={r:1,t:300,you:100,opp:100,log:['FIGHT NIGHT · ROUND 1']};S.page='fight'}function fight(){let q=S.fight,o=S.contract.opponent;if(!q)return career();if(q.result)return `<div class="card" style="text-align:center"><div class="ey">OFFICIAL RESULT</div><div class="stat">${q.result}</div><p>${q.method}</p><button class="btn red" onclick="finishFight()">Закрыть бой</button></div>`;return `<div class="fight"><div><div class="avatar">${ini(S.fighter.name)}</div><h2>${esc(S.fighter.name)}</h2><b>${q.you}%</b><div class="bar"><i style="width:${q.you}%"></i></div></div><div><div class="stat">${Math.floor(q.t/60)}:${String(q.t%60).padStart(2,'0')}</div><div>R${q.r}/3</div></div><div><div class="avatar">${ini(o.name)}</div><h2>${esc(o.name)}</h2><b>${q.opp}%</b><div class="bar"><i style="width:${q.opp}%"></i></div></div></div><div class="choice" style="margin-top:14px"><button onclick="act(1)">🥊 Ударка</button><button onclick="act(2)">🦵 Кики</button><button onclick="act(3)">🤼 Борьба</button><button onclick="act(4)">🥋 Партер</button><button onclick="act(5)">🎯 Контратака</button><button onclick="act(6)">🫁 Восстановление</button></div><div class="card" style="margin-top:12px">${q.log.slice(-8).map(x=>`<div class="event">${x}</div>`).join('')}</div>`}function act(a){let q=S.fight,skill=[0,70,68,66,64,72,75][a],d=a===6?0:Math.round(skill/9*(.7+Math.random())),e=a===6?2:Math.round((55+Math.random()*35)/10);if(a===6)q.you=Math.min(100,q.you+10);else q.opp=Math.max(0,q.opp-d);q.you=Math.max(0,q.you-e);q.t-=30;q.log.push(`R${q.r} · ${['','Ударка','Кики','Борьба','Партер','Контратака','Восстановление'][a]} · урон ${d}`);if(q.opp<=0||q.you<=0){q.result=q.opp<=0?'ПОБЕДА':'ПОРАЖЕНИЕ';q.method='KO/TKO'}else if(q.t<=0){if(q.r<3){q.r++;q.t=300;q.log.push('Перерыв. Новый раунд.')}else{q.result=q.you>q.opp?'ПОБЕДА':'ПОРАЖЕНИЕ';q.method='Decision'}}save();render()}function finishFight(){let f=S.fighter,q=S.fight,w=q.result==='ПОБЕДА',o=S.contract.opponent;f.history.push({o:o.name,org:S.contract.org,w});if(w){f.wins++;f.fans+=7;f.form=Math.min(100,f.form+6);f.money+=S.contract.show+S.contract.win}else{f.losses++;f.form=Math.max(40,f.form-8);f.money+=S.contract.show}f.record=f.wins+'-'+f.losses;if(f.league==='Siberian Fight League'&&f.wins>=3)f.league='RCC';else if(f.league==='RCC'&&f.wins>=6)f.league='ACA';else if(f.league==='ACA'&&f.wins>=9)f.league='Cage Warriors';else if(f.league==='Cage Warriors'&&f.wins>=12)f.league='UFC';S.contract=null;S.fight=null;S.camp=null;S.page='career';S.toast={t:w?'Победа!':'Поражение',p:`${q.method}. Рекорд теперь ${f.record}.`};save();render()}function match(){return `<div class="ey">MATCHMAKING</div><h1 class="title">Выбор соперника</h1><p class="muted">Здесь теперь всегда видно, <b>какая лига предлагает бой</b>.</p><button class="btn red" onclick="genOffers()">Обновить предложения</button>`}function world(){return `<div class="ey">MMA WORLD</div><h1 class="title">Организации</h1><div class="grid g3">${ORGS.map(o=>`<div class="card"><h2>${o[2]} ${o[0]}</h2><span class="tag">${o[1]==='major'?'TOP LEAGUE':'REGIONAL'}</span><p class="muted">${o[1]==='major'?'Рейтинги · P4P · титулы · контракты':'Региональный уровень без рейтингов'}</p></div>`).join('')}</div>`}function render(){let c=S.page==='home'?home():S.page==='create'?create():S.page==='career'?career():S.page==='offers'?offers():S.page==='match'?match():S.page==='neg'?neg():S.page==='camp'?camp():S.page==='fight'?fight():world();document.getElementById('app').innerHTML=shell(c)}render();</script></body></html>
